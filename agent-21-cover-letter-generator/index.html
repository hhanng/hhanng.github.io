<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover Letter Generator · Agent 21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="topnav">
  <a class="back-link" href="../index.html">← Portfolio</a>
  <span class="nav-badge">Agent #21</span>
</nav>

<div class="hero">
  <div class="hero-icon">✉️</div>
  <h1>Cover Letter Generator</h1>
  <p>Personalized, human-sounding cover letters with JD keyword matching.</p>
</div>

<div class="container">
  <div class="api-bar card">
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIza…" autocomplete="off">
    <span class="api-saved hidden" id="apiSaved">✓ Saved</span>
  </div>

  <div class="main-layout">
    <!-- Left: Inputs -->
    <div class="inputs-col">
      <div class="card">
        <h2 class="section-title">Job Details</h2>

        <div class="form-row">
          <div class="form-group">
            <label>Company Name</label>
            <input type="text" id="company" placeholder="e.g. Stripe">
          </div>
          <div class="form-group">
            <label>Role / Position</label>
            <input type="text" id="role" placeholder="e.g. Software Engineer Intern">
          </div>
        </div>

        <div class="form-group mt-12">
          <label>Job Description</label>
          <textarea id="jobDesc" rows="7" placeholder="Paste the full job description here…"></textarea>
        </div>

        <div class="form-group mt-12">
          <label>Your Background & Skills</label>
          <textarea id="background" rows="5" placeholder="Summarize your relevant experience, skills, and achievements…"></textarea>
        </div>

        <div class="form-group mt-12">
          <label>Tone</label>
          <div class="tone-tabs" id="toneTabs">
            <button class="tone-btn active" data-tone="Professional">Professional</button>
            <button class="tone-btn" data-tone="Enthusiastic">Enthusiastic</button>
            <button class="tone-btn" data-tone="Concise">Concise</button>
          </div>
        </div>

        <div id="errorBox" class="error-box hidden"></div>

        <button class="btn-generate" id="generateBtn">
          <span class="btn-icon">✨</span> Generate Cover Letter
        </button>
      </div>
    </div>

    <!-- Right: Output -->
    <div class="output-col">
      <div class="card output-card" id="outputCard">
        <div class="output-placeholder" id="outputPlaceholder">
          <div class="placeholder-icon">📄</div>
          <p>Your cover letter will appear here after you click Generate.</p>
        </div>

        <div class="output-content hidden" id="outputContent">
          <div class="output-header">
            <div class="output-meta">
              <span class="word-count-badge" id="wordCount">0 words</span>
            </div>
            <button class="btn-copy" id="copyBtn">Copy Letter</button>
          </div>

          <div class="letter-body" id="letterBody"></div>

          <div class="keywords-section" id="keywordsSection">
            <h3 class="kw-title">Matched Keywords</h3>
            <div class="kw-chips" id="kwChips"></div>
          </div>
        </div>

        <div class="loading-state hidden" id="loadingState">
          <div class="spinner"></div>
          <p>Writing your cover letter…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
