<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fdf6ee;color:#3d2000;font-family:'Segoe UI',system-ui,sans-serif;font-size:16px;min-height:100vh}
header{background:linear-gradient(135deg,#e8590c,#ff922b);padding:16px 20px;text-align:center}
header h1{font-size:1.3rem;font-weight:800;color:#fff}
header p{font-size:.88rem;color:#fff9;margin-top:3px}
/* tab nav */
.nav-wrap{background:#fff;border-bottom:2px solid #ffe3c2;overflow-x:auto;white-space:nowrap;padding:0 4px;display:flex}
.nav-tab{flex-shrink:0;padding:11px 14px;cursor:pointer;font-size:.82rem;font-weight:700;color:#8b4000;border-bottom:3px solid transparent;transition:.15s}
.nav-tab:hover{color:#e8590c}
.nav-tab.active{color:#e8590c;border-bottom-color:#e8590c;background:#fff8f0}
/* pages */
.page{display:none;max-width:860px;margin:0 auto;padding:20px 14px}
.page.active{display:block}
/* section title */
.stitle{font-size:1.05rem;font-weight:800;color:#e8590c;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
/* flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.flip-wrap{cursor:pointer;perspective:700px}
.flip-inner{position:relative;min-height:100px;transition:.5s;transform-style:preserve-3d;border-radius:12px}
.flip-wrap.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;width:100%;min-height:100px;border-radius:12px;padding:14px 16px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.flip-front{background:#fff;border:2px solid #ffd9b0;box-shadow:0 2px 8px #e8590c18}
.flip-back{background:#fff8f0;border:2px solid #ffc896;box-shadow:0 2px 8px #e8590c18;transform:rotateY(180deg)}
.f-en{font-size:1.05rem;font-weight:700;color:#c44b00;line-height:1.4}
.f-vi{font-size:.9rem;color:#7a4000;margin-top:6px;line-height:1.4}
.f-hint{font-size:.7rem;color:#d9b08c;margin-top:8px}
.speak-btn{background:#fff;border:1px solid #ffd9b0;border-radius:6px;padding:3px 9px;font-size:.72rem;cursor:pointer;color:#e8590c;margin-top:8px;align-self:flex-start;transition:.15s}
.speak-btn:hover{background:#fff8f0;border-color:#e8590c}
/* full script button */
.script-btn{background:#fff;border:2px solid #e8590c;color:#e8590c;border-radius:8px;padding:9px 18px;font-size:.88rem;font-weight:700;cursor:pointer;transition:.15s;margin-bottom:14px}
.script-btn:hover{background:#fff8f0}
/* script overlay */
.script-box{background:#fff;border:2px solid #ffd9b0;border-radius:12px;padding:18px;margin-bottom:16px;display:none;line-height:1.8}
.script-box.show{display:block}
.script-box .en-line{font-size:1rem;font-weight:600;color:#c44b00}
.script-box .vi-line{font-size:.88rem;color:#8b5000;margin-bottom:8px}
/* quiz */
.quiz-section{background:#fff;border:2px solid #ffd9b0;border-radius:12px;padding:18px;margin-bottom:16px}
.quiz-q{font-size:1rem;font-weight:700;color:#3d2000;margin-bottom:10px}
.quiz-input{width:100%;padding:10px 14px;border:2px solid #ffd9b0;border-radius:8px;font-size:.95rem;outline:none;background:#fdf6ee}
.quiz-input:focus{border-color:#e8590c}
.quiz-fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.88rem;display:none}
.quiz-fb.ok{background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7}
.quiz-fb.no{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}
.quiz-score-display{font-size:1.1rem;font-weight:800;color:#e8590c;text-align:center;padding:12px;background:#fff8f0;border-radius:8px;margin-top:10px}
/* phrasebook */
.pb-input-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pb-input-row input{flex:1;min-width:140px;padding:9px 12px;border:2px solid #ffd9b0;border-radius:8px;font-size:.9rem;background:#fdf6ee;outline:none;color:#3d2000}
.pb-input-row input:focus{border-color:#e8590c}
.pb-save-btn{background:#e8590c;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:.88rem;font-weight:700;cursor:pointer}
.pb-card{background:#fff;border:1px solid #ffd9b0;border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.pb-text{flex:1}
.pb-en{font-size:.95rem;font-weight:700;color:#c44b00}
.pb-vi{font-size:.85rem;color:#8b5000;margin-top:2px}
.pb-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:1.1rem;flex-shrink:0;padding:2px 6px;border-radius:4px}
.pb-del:hover{color:#e8590c;background:#fff8f0}
/* progress */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;font-size:.82rem}
.prog-bg{flex:1;background:#ffd9b0;border-radius:4px;height:8px;overflow:hidden}
.prog-fill{height:100%;background:#e8590c;border-radius:4px;transition:.4s}
.badge-btn{background:#e8590c;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:.88rem;font-weight:700;cursor:pointer;margin-top:6px;transition:.15s}
.badge-btn:hover{background:#c44b00}
.badge-outline{background:#fff;color:#e8590c;border:2px solid #e8590c}
.badge-outline:hover{background:#fff8f0}
.small-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:700}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-red{background:#fff3e0;color:#e65100}
</style>

  grocery:`EN: Hi, excuse me. Can you help me find the produce section?\nVI: Xin chào, xin lỗi. Bạn có thể chỉ giúp tôi khu vực rau củ không?\n\nEN: I'm looking for coconut milk. Do you carry it?\nVI: Tôi đang tìm nước cốt dừa. Chỗ này có bán không?\n\nEN: Thank you! Also, is this item on sale this week?\nVI: Cảm ơn! Ngoài ra, mặt hàng này có đang giảm giá tuần này không?\n\nEN: Great, I'll take it. Do you have a larger size?\nVI: Tuyệt, tôi sẽ lấy cái này. Bạn có cỡ lớn hơn không?`,

  bank:`EN: Hi, I'd like to open a new checking account today.\nVI: Xin chào, hôm nay tôi muốn mở tài khoản thanh toán mới.\n\nEN: I have my passport and utility bill as proof of address.\nVI: Tôi có hộ chiếu và hóa đơn tiện ích làm bằng chứng địa chỉ.\n\nEN: Is there a minimum balance required? What are the monthly fees?\nVI: Có số dư tối thiểu bắt buộc không? Phí hàng tháng là bao nhiêu?\n\nEN: Can I set up online banking and mobile deposit?\nVI: Tôi có thể thiết lập ngân hàng trực tuyến và gửi tiền qua điện thoại không?`,
  dmv:`EN: Hello, I'm here to apply for a driver's license.\nVI: Xin chào, tôi đến để nộp đơn xin bằng lái xe.\n\nEN: I have my passport, proof of residency, and Social Security card.\nVI: Tôi có hộ chiếu, bằng chứng cư trú và thẻ An sinh xã hội.\n\nEN: I would like to take the written test today. Is there a Vietnamese language option?\nVI: Tôi muốn thi lý thuyết hôm nay. Có tùy chọn tiếng Việt không?\n\nEN: What is the next available appointment for the driving test?\nVI: Lịch hẹn thi lái xe thực hành gần nhất là khi nào?`,
  work:`EN: Good morning. I wanted to let you know I'll be about 15 minutes late today.\nVI: Chào buổi sáng. Tôi muốn báo rằng hôm nay tôi sẽ đến muộn khoảng 15 phút.\n\nEN: I have a doctor's appointment tomorrow afternoon. May I leave at 3 PM?\nVI: Ngày mai tôi có lịch khám bác sĩ vào buổi chiều. Tôi có thể về lúc 3 giờ không?\n\nEN: I'm not sure I understood the instructions. Could you show me once more?\nVI: Tôi không chắc mình hiểu đúng hướng dẫn. Bạn có thể chỉ cho tôi lần nữa không?`,
  phone:`EN: Hello, this is [your name]. I'm calling to confirm my appointment on [day] at [time].\nVI: Xin chào, đây là [tên bạn]. Tôi gọi để xác nhận lịch hẹn của tôi vào [ngày] lúc [giờ].\n\nEN: I'm sorry, I didn't catch that. Could you repeat it more slowly?\nVI: Xin lỗi, tôi không nghe rõ. Bạn có thể nhắc lại chậm hơn không?\n\nEN: Can you spell that for me please?\nVI: Bạn có thể đánh vần cái đó cho tôi không?`,
  landlord:`EN: Hi, this is [name] in unit [number]. I'm calling to report a maintenance issue.\nVI: Xin chào, đây là [tên] ở căn hộ số [số]. Tôi gọi để báo cáo sự cố bảo trì.\n\nEN: The water heater stopped working last night. We have no hot water.\nVI: Máy nước nóng ngừng hoạt động tối qua. Chúng tôi không có nước nóng.\n\nEN: Can someone come to fix it today? It's quite urgent.\nVI: Có ai đến sửa hôm nay không? Khá khẩn cấp đấy.\n\nEN: Thank you. My phone number is [number].\nVI: Cảm ơn. Số điện thoại của tôi là [số].`,
  school:`EN: Hi, I'm [name]'s mother. I'm here for the parent-teacher conference.\nVI: Xin chào, tôi là mẹ của [tên]. Tôi đến để dự buổi họp phụ huynh-giáo viên.\n\nEN: How is my child doing in class? Are there any concerns?\nVI: Con tôi đang học như thế nào trong lớp? Có điều gì đáng lo ngại không?\n\nEN: My child is having some difficulty with reading. What can I do at home?\nVI: Con tôi đang gặp khó khăn với việc đọc. Tôi có thể làm gì ở nhà?\n\nEN: Thank you so much. Is there a Vietnamese interpreter available next time?\nVI: Cảm ơn rất nhiều. Lần sau có phiên dịch tiếng Việt không?`,
  emergency:`EN: 911, what is your emergency?\nVI: (Người điều phối 911 sẽ hỏi)\n\nEN: There is a fire at my house! Please send help immediately.\nVI: Nhà tôi đang cháy! Xin hãy gửi người giúp đỡ ngay lập tức.\n\nEN: My address is [full address]. Please hurry!\nVI: Địa chỉ của tôi là [địa chỉ đầy đủ]. Xin hãy nhanh lên!\n\nEN: I don't speak English well. Do you have a Vietnamese interpreter?\nVI: Tôi nói tiếng Anh không giỏi. Bạn có phiên dịch tiếng Việt không?`,
  smalltalk:`EN: Hi! I haven't seen you in a while. How have you been?\nVI: Xin chào! Lâu rồi không gặp bạn. Bạn có khỏe không?\n\nEN: It's so nice today, isn't it? Perfect weather for a walk.\nVI: Hôm nay thật đẹp phải không? Thời tiết hoàn hảo để đi dạo.\n\nEN: Do you know any good Vietnamese restaurants nearby?\nVI: Bạn có biết nhà hàng Việt Nam nào gần đây ngon không?\n\nEN: Thank you for everything. You have been so helpful!\nVI: Cảm ơn vì tất cả. Bạn đã giúp đỡ rất nhiều!`,
};

// Quiz questions (5 per tab — fill in blank)
const QUIZ_DATA = {
  grocery:[

    {q:'Is this on ___?',a:'sale'},
    {q:'Can I ___ by card?',a:'pay'},
    {q:'Do you have a store ___ or rewards card?',a:'app'},
    {q:'I would like to ___ this item.',a:'return'},
  ],
  doctor:[

    {q:'Please speak more ___. My English is limited.',a:'slowly'},

  bank:[

    {q:'How do I ___ money to another account?',a:'transfer'},

  ],
  dmv:[
    {q:'I need to get my driver\'s ___.',a:'license'},
    {q:'I need to ___ my car.',a:'register'},
    {q:'I ___ the test. Can I take it again?',a:'failed'},
    {q:'I received a traffic ___.',a:'ticket'},
    {q:'Can I make an ___ online?',a:'appointment'},
  ],
  work:[
    {q:'I need to request a day ___.',a:'off'},
    {q:'I am going to be ___ today.',a:'late'},
    {q:'When is the ___ deposited?',a:'paycheck'},
    {q:'Can you ___ me how to do this task?',a:'show'},

  ],
  phone:[
    {q:'Could you please speak more ___?',a:'slowly'},
    {q:'I need to ___ my appointment.',a:'confirm'},

    {q:'Please ___ while I get a pen.',a:'hold'},
    {q:'I will call you ___ in a few minutes.',a:'back'},
  ],
  landlord:[
    {q:'There is a water ___ in the bathroom.',a:'leak'},
    {q:'When is the ___ due each month?',a:'rent'},
    {q:'My neighbor is being very _____.',a:'noisy'},
    {q:'The smoke ___ is making a noise.',a:'detector'},
    {q:'How much ___ do I need to give before moving out?',a:'notice'},
  ],
  school:[
    {q:'My child was ___ because they were sick.',a:'absent'},
    {q:'What ___ was assigned today?',a:'homework'},
    {q:'I need to pick up my child ___ today.',a:'early'},
    {q:'How do I check my child\'s ___ online?',a:'grades'},
    {q:'My child is being ___.',a:'bullied'},
  ],
  emergency:[
    {q:'I need an ___.',a:'ambulance'},
    {q:'There is a ___!',a:'fire'},
    {q:'I am having chest ___.',a:'pains'},
    {q:'Please ___! This is an emergency.',a:'hurry'},
    {q:'Someone ___ into my house.',a:'broke'},
  ],
  smalltalk:[
    {q:'Nice to ___ you!',a:'meet'},
    {q:'Have a great ___!',a:'day'},
    {q:'I am still ___ English.',a:'learning'},
    {q:'You are very ___.',a:'kind'},
    {q:'See you next ___!',a:'time'},
  ],
};

// ── STATE ──
let quizState = {};     // tabId -> {idx, score, answers}
let phrasebook = JSON.parse(localStorage.getItem('ag104_phrasebook') || '[]');
let quizScores = JSON.parse(localStorage.getItem('ag104_quizscores') || '{}');

// ── BUILD NAV ──
function buildNav() {
  const nav = document.getElementById('nav-bar');
  nav.innerHTML = TABS.map((t, i) =>
    `<div class="nav-tab ${i===0?'active':''}" id="nav-${t.id}" onclick="showTab('${t.id}',this)">
      ${t.icon} ${t.label}
    </div>`
  ).join('');
}

// ── BUILD PAGES ──
function buildPages() {
  const container = document.getElementById('pages-container');
  const tabsToRender = TABS.filter(t => t.id !== 'phrasebook');

  let html = tabsToRender.map((t, i) => `
    <div class="page ${i===0?'active':''}" id="page-${t.id}">
      <div class="stitle">${t.icon} ${t.label} <span style="font-size:.8rem;color:#8b4000;font-weight:400">— ${t.viLabel}</span></div>
      ${quizScores[t.id] !== undefined ? `<div style="margin-bottom:10px"><span class="small-badge ${quizScores[t.id]>=4?'badge-green':'badge-red'}">Last quiz: ${quizScores[t.id]}/5</span></div>` : ''}

      <div class="stitle" style="font-size:.9rem">💬 Key Phrases — tap card to flip</div>
      <div class="flip-grid" id="flip-${t.id}"></div>

      <button class="script-btn" onclick="toggleScript('${t.id}')">📜 Show Full Script</button>
      <div class="script-box" id="script-${t.id}"></div>

      <div class="stitle" style="font-size:.9rem">📝 Quiz Me — fill in the blank</div>
      <div id="quiz-${t.id}"></div>
    </div>
  `).join('');

  // Phrasebook page
  html += `
    <div class="page" id="page-phrasebook">
      <div class="stitle">📖 My Personal Phrasebook</div>
      <p style="font-size:.88rem;color:#8b4000;margin-bottom:12px">Lưu những câu bạn thường dùng nhất. Save your most-used phrases here.</p>
      <div class="pb-input-row">
        <input id="pb-en" placeholder="English phrase..." style="flex:1">
        <input id="pb-vi" placeholder="Vietnamese translation...">
        <button class="pb-save-btn" onclick="savePhrase()">+ Save</button>
      </div>
      <div id="pb-list"></div>
    </div>`;

  container.innerHTML = html;
}

// ── SHOW TAB ──
function showTab(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  el.classList.add('active');
}

// ── BUILD FLIP CARDS ──
function buildFlipCards(tabId) {
  const list = PHRASES[tabId];
  if (!list) return;
  const el = document.getElementById('flip-' + tabId);
  if (!el) return;
  el.innerHTML = list.map((p, i) => `
    <div class="flip-wrap" onclick="handleFlipClick(event, '${tabId}-${i}')">
      <div class="flip-inner" id="fi-${tabId}-${i}">
        <div class="flip-front">
          <div class="f-en">${p.en}</div>
          <div class="f-hint">👆 Tap for Vietnamese</div>
          <button class="speak-btn" onclick="event.stopPropagation();speak('${escJs(p.en)}')">🔊 Listen</button>
        </div>
        <div class="flip-back">
          <div class="f-vi">🇻🇳 ${p.vi}</div>
          <div class="f-en" style="font-size:.88rem;margin-top:6px">${p.en}</div>
          <div class="f-hint">👆 Tap for English</div>
          <button class="speak-btn" onclick="event.stopPropagation();speak('${escJs(p.en)}')">🔊 Listen EN</button>
        </div>
      </div>
    </div>`).join('');
}

function handleFlipClick(e, id) {
  const wrap = e.currentTarget;
  wrap.classList.toggle('flipped');
}

function escJs(s) {
  return s.replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

// ── SPEAK ──
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = 0.9;
  window.speechSynthesis.speak(utt);
}

// ── TOGGLE SCRIPT ──
function toggleScript(tabId) {
  const box = document.getElementById('script-' + tabId);
  const isOpen = box.classList.contains('show');
  if (isOpen) { box.classList.remove('show'); return; }
  const raw = SCRIPTS[tabId] || '';
  box.innerHTML = raw.split('\n').map(line => {
    if (line.startsWith('EN:')) return `<div class="en-line">${line}</div>`;
    if (line.startsWith('VI:')) return `<div class="vi-line">${line}</div>`;
    return `<div style="height:8px"></div>`;
  }).join('');
  box.classList.add('show');
}

// ── QUIZ ──
function buildQuiz(tabId) {
  const questions = QUIZ_DATA[tabId];
  if (!questions) return;
  const el = document.getElementById('quiz-' + tabId);
  if (!el) return;

  if (!quizState[tabId]) quizState[tabId] = {idx:0, score:0, done:false};
  const state = quizState[tabId];

  if (state.done) {
    const score = state.score;
    const color = score >= 4 ? '#1b5e20' : score >= 2 ? '#e65100' : '#c62828';
    el.innerHTML = `<div class="quiz-score-display" style="color:${color}">
      Quiz Complete! You got ${score} / ${questions.length} correct 🎉
    </div>
    <button class="badge-btn badge-outline" onclick="resetQuiz('${tabId}')" style="margin-top:10px">↺ Try Again</button>`;
    return;
  }

  const q = questions[state.idx];
  const progress = `${state.idx + 1} / ${questions.length}`;
  el.innerHTML = `
    <div class="quiz-section">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px">
        <span class="small-badge badge-green">Question ${progress}</span>
        <span class="small-badge" style="background:#fff3e0;color:#e65100">Score: ${state.score}</span>
      </div>
      <div class="quiz-q">Fill in the blank: "${q.q.replace('___','_____')}"</div>
      <input class="quiz-input" id="quiz-input-${tabId}" placeholder="Type the missing word..."
        onkeydown="if(event.key==='Enter')checkQuiz('${tabId}')">
      <div class="quiz-fb" id="quiz-fb-${tabId}"></div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="badge-btn" onclick="checkQuiz('${tabId}')">Check Answer</button>
        <button class="badge-btn badge-outline" onclick="skipQuiz('${tabId}')">Skip</button>
      </div>
    </div>`;
  setTimeout(() => {
    const inp = document.getElementById(`quiz-input-${tabId}`);
    if(inp) inp.focus();
  }, 50);
}

function checkQuiz(tabId) {
  const inp = document.getElementById(`quiz-input-${tabId}`);
  if (!inp) return;
  const val = inp.value.trim().toLowerCase();
  const state = quizState[tabId];
  const questions = QUIZ_DATA[tabId];
  const q = questions[state.idx];
  const correct = val === q.a.toLowerCase();
  const fb = document.getElementById(`quiz-fb-${tabId}`);
  fb.style.display = 'block';
  if (correct) {
    state.score++;
    fb.className = 'quiz-fb ok';
    fb.textContent = `✅ Correct! The word was "${q.a}."`;
  } else {
    fb.className = 'quiz-fb no';
    fb.textContent = `❌ Not quite. The answer is "${q.a}."`;
  }
  inp.disabled = true;
  setTimeout(() => nextQuiz(tabId), 1200);
}

function skipQuiz(tabId) { nextQuiz(tabId); }

function nextQuiz(tabId) {
  const state = quizState[tabId];
  state.idx++;
  if (state.idx >= QUIZ_DATA[tabId].length) {
    state.done = true;
    quizScores[tabId] = state.score;
    localStorage.setItem('ag104_quizscores', JSON.stringify(quizScores));
  }
  buildQuiz(tabId);
}

function resetQuiz(tabId) {
  quizState[tabId] = {idx:0, score:0, done:false};
  buildQuiz(tabId);
}

// ── PHRASEBOOK ──
function savePhrase() {
  const en = document.getElementById('pb-en').value.trim();
  const vi = document.getElementById('pb-vi').value.trim();
  if (!en) return;
  phrasebook.unshift({en, vi: vi || '—'});
  localStorage.setItem('ag104_phrasebook', JSON.stringify(phrasebook));
  document.getElementById('pb-en').value = '';
  document.getElementById('pb-vi').value = '';
  renderPhrasebook();
}

function deletePhrase(idx) {
  phrasebook.splice(idx, 1);
  localStorage.setItem('ag104_phrasebook', JSON.stringify(phrasebook));
  renderPhrasebook();
}

function renderPhrasebook() {
  const el = document.getElementById('pb-list');
  if (!el) return;
  if (!phrasebook.length) {
    el.innerHTML = `<p style="color:#b8865a;font-size:.88rem;text-align:center;padding:30px">No saved phrases yet. Add your first one above!</p>`;
    return;
  }
  el.innerHTML = phrasebook.map((p, i) => `
    <div class="pb-card">
      <div class="pb-text">
        <div class="pb-en">🗣 ${p.en}</div>
        <div class="pb-vi">🇻🇳 ${p.vi}</div>
      </div>
      <button class="speak-btn" onclick="speak('${escJs(p.en)}')">🔊</button>
      <button class="pb-del" onclick="deletePhrase(${i})" title="Delete">✕</button>
    </div>`).join('');
}

// ── INIT ──
buildNav();
buildPages();

// Build flip cards and quizzes for all content tabs
Object.keys(PHRASES).forEach(tabId => {
  buildFlipCards(tabId);
  buildQuiz(tabId);
});

renderPhrasebook();
</script>
