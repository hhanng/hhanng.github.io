{type:'metrics',company:'google',q:'You notice a 15% drop in Google Search click-through rates over the past week. How do you investigate?',hint:['1. First clarify: is the metric actually down? Data integrity check','2. Segment: device, region, query type, time of day','3. Internal vs. external causes','4. Correlation with product changes','5. Hypothesis and next steps'],model:'Investigation framework:\n\nStep 1 — Validate the data\nIs this a measurement issue or real? Check: sampling changes, tracking code update, dashboard bugs. If data confirmed real, proceed.\n\nStep 2 — Segment the drop\n- By device: Desktop vs. mobile vs. tablet\n- By region: US only, global, specific markets?\n- By query type: Informational, navigational, commercial?\n- By time: Gradual decline or sudden drop? Which day?\n\nStep 3 — Internal causes\n- Any launches in the past week? Algorithm updates? UI changes (SERP redesign)? AI Overview expansion?\n- Check experiment logs for any features that may have affected results page\n\nStep 4 — External causes\n- Did competitors change? (Bing/ChatGPT getting more traffic?)\n- News event driving unusual query patterns?\n- Seasonality? (Holidays, back-to-school)\n\nStep 5 — Hypotheses\nMost likely: (A) AI Overviews giving zero-click answers → fewer clicks (but this is intended). (B) SERP layout change reducing CTR. (C) Query intent shift — users asking differently.\n\nResolution: If AI Overviews is causing it, this may be expected behavior. If UI change, roll back or A/B test. If external, monitor and contextualize.'},
{type:'metrics',company:'meta',q:'Facebook\'s daily active users have been flat for 3 consecutive quarters. What do you do?',hint:['1. Understand DAU components: new users, returning users, churned users','2. Cohort analysis','3. Geographic segmentation','4. Consider whether this is a metric definition issue','5. Product vs. market saturation hypothesis'],model:'Flat DAU analysis framework:\n\n1. Decompose DAU: New users + Reactivated users - Churned users = DAU change. Which component is causing flatness? If new users are declining but reactivation is up, it\'s an acquisition problem. If churn is rising, it\'s retention.\n\n2. Cohort analysis: Are newer cohorts (users who joined in the last 12 months) as engaged as older cohorts at the same age? If newer cohorts are weaker, product-market fit is declining for new users.\n\n3. Geographic analysis: Is US/Canada flat (suggesting saturation) while international is flat (suggesting growth challenges)? US saturation at 60%+ of internet users is expected.\n\n4. Demographic analysis: Is Gen Z DAU declining while 35+ is holding? If yes, this is a long-term product risk requiring generational strategy change.\n\n5. Engagement quality: Is DAU flat but session time declining? That would be more alarming than flat DAU with stable time-spent.\n\nHypotheses: (A) US market saturation — acceptable outcome. (B) Global saturation — requires new value prop. (C) Competition from TikTok — requires Reels investment. (D) Platform fatigue — requires product refresh.\n\nRecommendation: Define which scenario is true before action. Market saturation at 3B MAU globally is not necessarily solvable through product alone.'},
{type:'metrics',company:'amazon',q:'Amazon Prime Video\'s completion rate for new shows drops from 70% to 45% month-over-month. What is wrong?',hint:['1. Define completion rate clearly (ep 1 to final ep)','2. Segment by show, genre, release type','3. Data integrity check first','4. Content quality vs. product issue','5. What metric should you care about — completion rate or something else?'],model:'Step 1 — Define and validate\nCompletion rate: % of users who start a show and complete all episodes. Check: Is the denominator changing? (More casual browsers starting episodes?). Any tracking changes?\n\nStep 2 — Segment\n- Per show: Is it one bad show driving the drop, or systemic across all new releases?\n- Release type: Binge-release (all episodes at once) vs. weekly release. Binge shows historically have higher completion. Did release strategy change?\n- Genre: Does drama vs. comedy vs. kids vary?\n\nStep 3 — Timing\n- Are users dropping after episode 1? 2? Mid-season? End?\n- If drop after episode 1, the content hook is weak.\n- If drop mid-season, pacing or quality is declining.\n\nStep 4 — Hypotheses\n(A) Content quality issue with specific month\'s releases — most likely if limited to a few shows.\n(B) Product change: Autoplay off by default? UI navigation changes making continuation harder?\n(C) Seasonality: Summer months show lower completion for drama.\n(D) Metric inflation in prior periods — were there unusually good shows before?\n\nIs completion rate the right metric? Amazon cares about Prime retention. Hours watched and Prime renewal rate matter more than completion rate for any single show.'},
{type:'metrics',company:'google',q:'Define the North Star Metric for Google Maps. How would you measure the health of the product?',hint:['1. What is Google Maps\' purpose (utility, revenue, data)?','2. North Star: one metric that captures value delivery','3. Supporting metrics (engagement, quality, revenue)','4. Counter-metrics to prevent gaming','5. What does bad look like?'],model:'Google Maps purpose: Help people get from A to B reliably, and help businesses reach customers.\n\nNorth Star Metric: "Successful Trips" — number of navigation sessions where the user arrived at their destination without abandoning mid-route OR issuing a new search. This captures true utility delivered.\n\nWhy better than DAU: Maps DAU can be inflated by users opening Maps then closing it (no value delivered).\nWhy better than sessions: A session that ends in abandonment doesn\'t count.\n\nSupporting metrics:\n- Accuracy rate: % routes that match predicted travel time within 15%\n- Business discovery rate: % sessions that include a business search\n- Map coverage: % of roads worldwide indexed (accuracy of the map itself)\n- User-generated contributions: Reports per DAU (community health)\n- Revenue: Local ad CTR, Google Business Profile impressions\n\nCounter-metrics (to prevent gaming Successful Trips):\n- Destination accuracy: Did the user actually end up at the intended destination?\n- Re-navigation rate: User immediately navigated again suggests first route failed\n\nHealth check: If Successful Trips is growing but accuracy rate is declining, the growth is unsustainable.'},
{type:'metrics',company:'meta',q:'WhatsApp\'s message send rate is growing but user satisfaction is declining. How do you reconcile this?',hint:['1. The metrics tell different stories — which do you trust?','2. Consider spam/bot inflation of send rate','3. Engagement quality vs. quantity','4. Satisfaction survey methodology issues','5. What action would you take?'],model:'This apparent contradiction — more messages sent but lower satisfaction — has several possible explanations.\n\nHypothesis 1: Spam/business message inflation\nBusiness messaging on WhatsApp has grown rapidly. If bots and promotional messages inflate the send rate, user-initiated genuine messages may be flat or declining, while spam is degrading satisfaction.\nTest: Segment send rate by user type (individual, verified business, unverified). If unverified business sends are driving growth, this is the cause.\n\nHypothesis 2: Survey methodology\nIs satisfaction measured the same way (same question, same sampling)? If the survey recently started including inactive users or was pushed more aggressively, the sample may have changed.\n\nHypothesis 3: Notification fatigue\nMore messages sent → more messages received → users feel overwhelmed. Volume is growing but perceived quality per message is declining.\n\nHypothesis 4: Feature regression\nA recent product change (notification behavior, message delivery, UX) degraded experience.\n\nResolution: Analyze spam message % in total volume. A/B test notification management features. Cross-reference with NPS cohort data. If spam inflation confirmed, tighten Business Message verification and rate-limiting. Ultimately, satisfaction > volume — align incentives around message quality, not quantity.'},
{type:'metrics',company:'amazon',q:'How do you measure the success of Amazon\'s recommendation algorithm?',hint:['1. Business goal: increase purchase rate, not just clicks','2. Short-term vs. long-term metrics','3. Counter-metrics: avoid filter bubbles, privacy concerns','4. Personalization quality metrics','5. A/B testing framework'],model:'Recommendation algorithm goals: Show the right product to the right user at the right time → increase purchase rate and customer lifetime value.\n\nPrimary success metrics:\n1. Recommendation CTR: % of recommendations clicked. (Directional but gameable — can show cheap clickbait.)\n2. Add-to-cart rate from recommendations: Higher signal — user intent.\n3. Recommendation-assisted purchase rate: % of purchases that had a recommendation in the session path.\n4. Incremental revenue: Revenue attributable to recommendations vs. a baseline (control group). True North Star.\n\nLong-term metrics:\n5. Customer lifetime value of recommendation users vs. non-users.\n6. Return rate on recommendation-driven purchases: If recommendations drive purchases of wrong items, returns increase.\n7. Cross-category discovery rate: Are users buying from new categories through recommendations? Signals expanding wallet share.\n\nCounter-metrics:\n- Filter bubble score: % of recommendations outside user\'s past purchase categories (prevent overfit)\n- Diversity of recommended products: Preventing monopolization by high-margin or high-ad-spend items\n\nA/B test setup: Test algorithm variants on matched user cohorts; primary KPI: incremental GMV; observe for 4+ weeks to capture repeat purchase behavior.'},
// ─ BEHAVIORAL ──────────────────────────────────────────────────────────────
{type:'behavioral',company:'google',q:'Tell me about a time you had to make a difficult product decision with incomplete data.',hint:['Use STAR: Situation, Task, Action, Result','Be specific about the data you had vs. needed','Show structured thinking, not gut feel','Quantify the outcome','What would you do differently?'],model:'Strong behavioral answer structure:\n\nSituation: "I was PM for [feature]. We had 2 weeks before launch and our A/B test only had 60% of the statistical power needed to confirm our hypothesis."\n\nTask: "I had to decide whether to launch, delay, or run a smaller-scale test."\n\nAction: "I analyzed what we DID know: (1) Direction of effect was positive in all cuts. (2) The cost of delay was high (competitive pressure, engineer allocation). (3) I identified which failure mode was worse — false positive (launching something neutral) vs. false negative (not launching something good). I consulted with data science and determined the risk of the false positive was recoverable. I created a rollback plan and defined clear kill metrics. I recommended a phased rollout to 10% of users with a 2-week monitor period before full rollout."\n\nResult: "We launched. The metric improved 3% (within the CI of our test estimate). No rollback was needed. Post-hoc analysis at full rollout confirmed statistical significance at 95%+."\n\nKey PM signal: You didn\'t wait for perfect data; you defined the decision framework, understood risk asymmetry, and created a safety net.'},
{type:'behavioral',company:'meta',q:'Describe a time you had to influence stakeholders without direct authority.',hint:['STAR framework','Identify who the stakeholders were and why they resisted','Show how you built alignment (data, listening, finding common ground)','Leadership without authority is core PM skill','Quantify influence achieved'],model:'Strong answer framework:\n\n"I needed engineering to reprioritize their roadmap to support a critical user need, but the team had already committed to other features."\n\nAction strategy: (1) First, I spent time understanding the engineering team\'s priorities and constraints — what were they trying to achieve? I found their goal was to reduce technical debt, and my feature could be built in a way that addressed some of the same debt. (2) I built the business case quantitatively: "This feature addresses a problem affecting 35% of our DAU and is directly correlated with churn — here\'s the data." (3) I escalated selectively — I didn\'t go over their head, but I asked my manager to be present in the conversation to signal organizational importance. (4) I proposed a compromise: a lighter version of the feature in the current quarter, full version next quarter.\n\nResult: "Engineering agreed to the phased approach. The v1 launched on time, drove a 2% improvement in day-7 retention, and the full feature launched next quarter."\n\nKey signal: You listened first, built on shared interests, used data, and found a win-win compromise.'},
{type:'behavioral',company:'amazon',q:'Tell me about a time you failed and what you learned from it.',hint:['Be honest and specific about a real failure','Don\'t pick a non-failure ("I worked too hard")','Show self-awareness and growth','Emphasize the learnings concretely','Amazon values ownership and bias for action — tie your failure to these'],model:'Strong answer structure (aligned with Amazon\'s Leadership Principles):\n\n"I failed to deliver a feature on time because I didn\'t raise blockers early enough. [Specific situation: the API dependency from a partner team was behind schedule, and I knew this in week 2 but hoped it would resolve.]\n\nWhy I failed to raise it: I didn\'t want to be the PM who escalated too quickly and seemed like I couldn\'t handle problems. I also underestimated how long the delay would compound.\n\nBy week 5, when I finally escalated, we were 3 weeks behind and there was no recovery path before launch.\n\nWhat I learned: (1) Raise blockers the moment they become medium-risk, not when they become high-risk. The cost of raising a false alarm is much less than the cost of a late escalation. (2) I now have a weekly "Risk List" in my project tracking — I review it every Monday and explicitly decide whether each risk is stable, escalating, or resolved. (3) Under Amazon\'s Ownership LP, the PM owns the outcome, not just the inputs — I take this more seriously now.\n\nSince then, I\'ve delivered 4 consecutive on-time launches and proactively escalated 2 risks that were resolved before they became problems."'},
{type:'behavioral',company:'google',q:'How do you prioritize when you have more great ideas than engineering capacity?',hint:['Framework: impact vs. effort, user value vs. business value','Show how you involve the team','Stakeholder alignment','What you cut and how','Google values data-driven decisions'],model:'Prioritization framework I use:\n\n1. Clarify goals first: What is our primary objective this quarter? If it\'s retention, features that don\'t move retention get deprioritized regardless of impressiveness.\n\n2. Score features on two dimensions: User impact (DAU/MAU uplift, task success improvement, NPS) and effort (engineering weeks). Create an impact/effort matrix.\n\n3. Quick wins first: High-impact, low-effort items first — this builds momentum and trust with engineering.\n\n4. Discuss trade-offs with engineering: They often know that "medium effort" is actually 1 day vs. 2 months. Get their input before finalizing.\n\n5. Make the cuts explicit: Don\'t let features "wait" — either schedule them or explicitly say "not this cycle." This prevents dependency and gives clarity.\n\n6. Re-evaluate quarterly: The ranked list from 3 months ago may not be correct today. Data changes.\n\nGoogle-specific: I use OKRs as the filter. If a feature doesn\'t connect to a measurable KR, I challenge whether it belongs on the roadmap. It sounds harsh but it eliminates a lot of "nice to have" work.\n\nWhen stakeholders push back: I show them the impact scores transparently and explain the opportunity cost of their request.'},
{type:'behavioral',company:'meta',q:'Tell me about a product decision you made that was unpopular with the team but turned out to be right.',hint:['Show conviction backed by data','Describe how you handled team resistance','Don\'t be arrogant — acknowledge the team\'s valid concerns','Outcome should validate the decision (but also show humility if it was mixed)','Meta values moving fast and being bold'],model:'Strong answer:\n\n"I pushed to remove a feature that had thousands of passionate vocal users but was used by less than 0.3% of our DAU and blocked us from a major platform migration.\n\nThe team felt we were betraying loyal users. The community forums were vocal.\n\nMy reasoning: (1) Data showed 0.3% usage despite existing for 3 years — low ceiling. (2) The feature required 2 engineers on maintenance indefinitely. (3) Migration couldn\'t proceed cleanly without its removal. (4) The vocal users were not representative — passion doesn\'t equal frequency.\n\nHow I handled the team: I didn\'t dismiss their concerns — I genuinely investigated whether the vocal users represented a broader silent majority. Analysis showed they didn\'t. I shared this data. I also committed to building a migration path for those users and posting a public explanation in the community.\n\nOutcome: We removed the feature. Forum complaints were loud for 2 weeks and then subsided. The migration proceeded on schedule, delivering a 12% performance improvement for all users. Two of the vocal critics ended up using the replacement workflow and said it was better.\n\nLearning: Data + communication beats sentiment + silence. But always acknowledge what you\'re asking users to give up."'},
{type:'behavioral',company:'amazon',q:'Describe a time you had to deliver bad news to leadership.',hint:['Be direct and specific','Show how you prepared the message','What did you recommend alongside the bad news?','Amazon LP: Backbone — disagree and commit; also Earn Trust','Demonstrate ownership'],model:'Strong answer:\n\n"Our flagship experiment — which had been communicated to leadership as a potential +5% revenue lift — showed neutral results after 6 weeks. I had to tell the VP.\n\nPreparation: I didn\'t come with just the bad news. I did a thorough post-mortem first: (1) Was the experiment run correctly? (Yes — checked with data science.) (2) What did we learn? (The hypothesis about user behavior was wrong — users did not change their search behavior as predicted.) (3) What are the next steps? (Two alternative hypotheses, a prioritized test plan.)\n\nDelivery: I scheduled 20 minutes with the VP. I led with the result directly: \'The experiment showed no impact. I want to walk you through what we learned and what we\'re doing next.\' I didn\'t soften or bury it.\n\nHis reaction: He appreciated the directness. He pushed back on one of my hypotheses, which led to a good discussion that improved the test design.\n\nOutcome: The follow-up test launched 6 weeks later and showed a +2.3% lift. Not the 5% originally projected, but a real win.\n\nLearning: Leaders can handle bad news. What they can\'t handle is bad news with no plan. Always bring both."'},

{type:'technical',company:'google',q:'A/B testing is producing inconsistent results. How do you fix your experimentation setup?',hint:['1. Check: sample ratio mismatch, novelty effect, experiment pollution','2. Statistical validity: test duration, power, significance threshold','3. Interaction effects between experiments','4. Define primary metric and guard rails before running','5. Pre-experiment vs. post-experiment checks'],model:'Common A/B testing problems and solutions:\n\n1. Sample Ratio Mismatch (SRM): The control and treatment groups have unequal sizes when they should be equal. Causes: logging bugs, browser redirects that lose users, differential loading of the page. Fix: Check ratio before analyzing results. If SRM detected, results are invalid.\n\n2. Novelty Effect: Users behave differently because the feature is new, not because it\'s better. Fix: Run experiments for at least 2 full weeks; if possible, measure by user vintage (exclude users who were exposed on day 1).\n\n3. Network Effects: Users interact with each other. One user\'s treatment affects another user\'s control experience. Fix: Cluster randomization (randomize at the group/community level, not individual).\n\n4. Multiple Comparisons Problem: Running too many metrics and declaring victory on any positive one. Fix: Define primary metric before experiment. Use Bonferroni correction for multiple secondary metrics.\n\n5. Experiment Pollution: Users in multiple overlapping experiments. Fix: Proper experiment infrastructure with orthogonal layer system (Google\'s approach: each experiment layer is independent).\n\nBest practice setup: Pre-register hypothesis, define primary KPI, compute required sample size for 80%+ power, set minimum experiment duration, and commit to not peeking at results early (optional stopping inflates false positive rate).'},
{type:'technical',company:'meta',q:'What is the difference between precision and recall? When does each matter more for product decisions?',hint:['1. Definitions clearly','2. Precision-recall trade-off','3. Real product examples (spam filter, medical diagnosis, recommendation)','4. When false positives are worse than false negatives','5. F1 score and when to use it'],model:'Definitions:\n\nPrecision = TP / (TP + FP)\n"Of all the items we flagged, how many were actually correct?"\nExample: Of 100 spam emails our filter caught, 90 were actually spam → Precision = 90%.\n\nRecall = TP / (TP + FN)\n"Of all the truly relevant items, how many did we catch?"\nExample: Of 100 actual spam emails, our filter caught 80 → Recall = 80%.\n\nTrade-off: Improving precision often reduces recall and vice versa. The threshold for classification determines the balance.\n\nWhen Precision matters more (FP cost is high):\n- Recommendation systems: Showing irrelevant products/content annoys users (FP). Better to show fewer but highly relevant items.\n- Content moderation: False positive (removing legitimate content) damages creator trust → precision matters.\n- Medical screening for rare diseases: False positive leads to unnecessary, expensive, stressful follow-up tests.\n\nWhen Recall matters more (FN cost is high):\n- Spam filtering: Missing spam (FN) means users see harmful content → recall matters more.\n- Fraud detection: Missing fraud (FN) means real financial loss → optimize for recall.\n- Safety-critical detection (self-driving pedestrian detection): Missing a pedestrian (FN) is catastrophic.\n\nF1 Score: Harmonic mean of precision and recall. Use when both matter equally.'},
{type:'technical',company:'amazon',q:'How does a recommendation engine work? What are the main approaches and their trade-offs?',hint:['1. Collaborative filtering (user-user, item-item)','2. Content-based filtering','3. Hybrid approaches','4. Cold start problem','5. Real-time vs. batch'],model:'Recommendation engine approaches:\n\n1. Collaborative Filtering (CF)\nUser-User: "Users similar to you also liked X." Find users with similar purchase/rating history.\nItem-Item: "People who bought X also bought Y." More scalable than user-user because item catalog is smaller than user base.\nTrade-off: Requires historical data; doesn\'t explain WHY it\'s recommending something; privacy implications.\n\n2. Content-Based Filtering\nRecommend items similar to what the user has interacted with, based on item features (genre, author, category).\nPros: No cold start for items; explainable ("Because you bought X"). Cons: Overfit — user is stuck in a bubble of similar items.\n\n3. Matrix Factorization (MF)\nDecomposes the user-item interaction matrix into latent factors (embeddings). Netflix Prize winner. More computationally efficient than explicit CF.\n\n4. Deep Learning / Embeddings\nNeural networks learn complex patterns. YouTube uses a two-tower model: user embedding + item embedding → dot product = relevance score.\n\n5. Hybrid\nCombine CF + content-based + contextual signals (time of day, device) to get best of all worlds. Amazon, Netflix, Spotify use hybrid.\n\nCold Start Problem: New user or new item with no history. Solutions: (1) Onboarding questions. (2) Popularity fallback. (3) Content-based for new items.\n\nReal-time vs. Batch: Batch generates candidates daily; real-time re-ranks for context. Amazon does both.'},
{type:'technical',company:'google',q:'How would you design the backend for a real-time collaborative document editor (like Google Docs)?',hint:['1. The concurrency problem: two users editing the same document','2. Operational Transformation (OT) vs. CRDTs','3. Data model','4. Network protocol (WebSocket)','5. Conflict resolution, latency, storage'],model:'Core challenge: Multiple users editing the same document simultaneously without conflicts.\n\nApproach 1: Operational Transformation (OT) — Google Docs approach\nEach edit is an "operation" (insert character at position X, delete character at position Y). When two operations conflict, a transformation function reconciles them. Example: User A inserts "hello" at position 5; User B simultaneously deletes position 5. OT adjusts User B\'s operation based on User A\'s insert.\n\nApproach 2: CRDTs (Conflict-free Replicated Data Types)\nData structures designed so that all concurrent edits can be merged deterministically without conflicts. Simpler correctness guarantee. Used by Figma, some collaborative tools.\n\nSystem design components:\n1. WebSocket server: Persistent connection for real-time push of operations\n2. Operation log: Every edit appended to a log (can replay from any point)\n3. Presence service: Show where each user\'s cursor is (separate lightweight stream)\n4. Storage: Document state stored in database; operation log stored for history/undo\n5. Client: Optimistic UI — apply operations locally immediately, reconcile with server confirmations\n\nLatency: Client applies operations immediately (optimistic) and reverses if server rejects. Target < 100ms round-trip.\n\nScale: Shard documents across servers. Each document is a session; all editors of the same document route to the same server.'},
{type:'technical',company:'meta',q:'Explain how Facebook\'s News Feed ranking algorithm works at a high level.',hint:['1. Candidate generation → ranking → filtering','2. Ranking signals: social signals, engagement predictions, recency','3. Machine learning models','4. User controls and transparency','5. Business objectives vs. user experience trade-offs'],model:'News Feed ranking is a multi-stage pipeline:\n\nStage 1 — Candidate Generation\nFrom thousands of possible posts (friends, Pages, Groups, ads), narrow to ~500 candidates. Signals: Who you interact with most, recency, content type preferences.\n\nStage 2 — Scoring / Ranking\nML models predict the probability of multiple engagement types for each post:\n- P(like), P(comment), P(share), P(click), P(watch completion)\n- Each engagement type has a weight. "Share" is weighted much higher than "like" because it reflects deeper engagement.\n- Negative signals: P(hide post), P(unfollow), P(this is misinformation)\n\nStage 3 — Filtering\nApply business rules: content policy violations removed, diversity rules (don\'t show 3 consecutive posts from same source), ad frequency caps.\n\nStage 4 — Final ranking and display\nTop ~100 posts shown in ranked order. The exact ordering considers a diversity constraint to mix content types and sources.\n\nKey signals by weight: (1) User-post affinity (past interactions with poster). (2) Post popularity (early engagement velocity). (3) Content type (video > photo > link historically). (4) Recency. (5) User preferences (inferred and explicit).\n\nTrade-offs: Optimizing purely for engagement led to misinformation and outrage amplification. Meta now uses "meaningful interactions" metric — prioritizing posts that lead to longer conversations, not just quick reactions. Value alignment in ML ranking is an active research area.'},
{type:'technical',company:'amazon',q:'What is eventual consistency and when would you use it in a product?',hint:['1. Definition and contrast with strong consistency','2. CAP theorem context','3. Real product examples','4. When eventual consistency is acceptable vs. not','5. How it affects product design decisions'],model:'Eventual consistency: In a distributed system, after a write, there is a period where different nodes may return different values. Eventually (usually milliseconds to seconds), all nodes will converge to the same value.\n\nCAP Theorem: Choose at most 2 of Consistency, Availability, Partition Tolerance.\n\nAcceptable: Like counts, shopping carts, DNS, product inventory display.\nNot acceptable: Financial transactions, inventory reservation, authentication.\n\nPM implication: Choose eventual consistency for high-throughput features where minor inconsistency is harmless.'},

{type:'estimation',company:'google',q:'How much data does the average American smartphone user consume per month?',hint:['1. Types of usage: streaming, browsing, social, calls','2. Time spent on each activity','3. Data per minute for each activity type','4. Cross-check with carrier published averages'],model:'Average American: ~4-5 hours/day screen time.\nStreaming video (Netflix/YouTube): ~1 hr/day × 600MB/hr = 600MB\nSocial media (photos/video): ~1.5 hr/day × 80MB/hr = 120MB\nBrowsing: ~1 hr/day × 20MB/hr = 20MB\nMessages/email: ~30MB/day\nTotal: ~770MB/day × 30 = ~23GB/month.\nCarrier data: US average is ~17-20GB/month. My estimate is slightly high (assumes heavy video streaming).\nFinal: ~15-20GB/month for average US smartphone user.'},
{type:'estimation',company:'meta',q:'Estimate the number of active WhatsApp users in India.',hint:['1. India internet users','2. WhatsApp penetration among internet users','3. Active vs. registered distinction','4. Cross-check with Meta public disclosures'],model:'India smartphone users: ~700M (2024).\nInternet users: ~650M.\nWhatsApp penetration in India: very high — the dominant messaging app. ~85% of internet users.\n650M × 85% = ~550M registered.\nMonthly active: ~90% of registered = ~500M.\nMeta has disclosed India as WhatsApp\'s largest market with ~500M+ users.\nFinal: ~500 million monthly active WhatsApp users in India.'},
{type:'estimation',company:'amazon',q:'How many items are listed for sale on Amazon globally?',hint:['1. Amazon 1P (own inventory) vs. 3P (marketplace sellers)','2. Number of active sellers × items per seller','3. Cross-check with Amazon public disclosures','4. Consider category breadth'],model:'Amazon 3P sellers: ~9.7M sellers globally (2023). Active sellers: ~2M.\nAverage items per active seller: ~50 (some have 1, large sellers have 10K+).\n2M × 50 = 100M items from 3P sellers.\nAmazon 1P (first party): ~300K SKUs.\nTotal: ~350M listings.\nAmazon has publicly cited ~353 million products. My estimate aligns.\nFinal: ~350-400 million product listings on Amazon globally.'},
{type:'estimation',company:'google',q:'How many YouTube videos are uploaded per day?',hint:['1. Known: 500 hours of video per minute (2022 figure)','2. Average video length','3. Cross-check','4. Creator vs. viewer ratio'],model:'Known data point: YouTube stated "500 hours of video uploaded per minute" in 2022.\n500 hours/min × 60 min = 30,000 hours/hour × 24 = 720,000 hours/day.\nAverage video length: ~7 minutes = 7/60 hours = 0.117 hours.\n720,000 ÷ 0.117 = ~6.15M videos/day.\nSanity check: YouTube has 800M+ videos total (reported in various estimates). If growing at ~5M/day for 2 years, that\'s +3.6B new videos — plausible given the long history.\nFinal: ~4-6 million videos uploaded to YouTube per day.'},

{type:'strategy',company:'google',q:'Google\'s advertising revenue is 77% of total revenue. How should Google diversify?',hint:['1. Risk of ad concentration','2. Existing diversification efforts (Cloud, Hardware, Waymo)','3. New growth vectors','4. Sequencing: which to prioritize','5. Time horizon matters'],model:'Revenue concentration risk: Ad downturns or regulatory crackdowns hit Google disproportionately.\n\nCurrent diversification: Google Cloud (13% revenue, growing 28% YoY), Devices (Pixel, Nest), YouTube subscriptions, Google One.\n\nStrategic priorities: (1) Google Cloud: Best near-term opportunity. Already #3 in cloud, growing faster than AWS. Key: win enterprise AI workloads with Gemini on Vertex AI. (2) YouTube Subscriptions: Premium + TV + NFL → bundle with Google One for recurring revenue. (3) Waymo Commercialization: Multi-billion TAM if ride-hailing succeeds. (4) Healthcare: Research DeepMind → commercial products (AlphaFold licensing, medical imaging).\n\nSequencing: Cloud (immediate, proven), YouTube subscriptions (2-3 years), Healthcare (5-10 years), Waymo (speculative).\n\nRisk: Cloud requires heavy CAPEX. Hardware is challenging (Pixel margins thin). Focus beats breadth.'},
{type:'strategy',company:'amazon',q:'Amazon is entering healthcare. What should be its key strategic priority?',hint:['1. Amazon\'s assets: logistics, data, AWS, Prime, pharmacy','2. Healthcare pain points: cost, access, coordination','3. Current Amazon Health moves','4. Where Amazon wins vs. incumbents','5. Regulatory moat considerations'],model:'Amazon\'s healthcare moves: Amazon Pharmacy, Amazon Clinic, One Medical ($3.9B acquisition).\n\nKey strategic priority: Own the healthcare access layer for the Prime member.\n\nWhy access vs. insurance/devices: Amazon\'s core competency is distribution + convenience. Making healthcare as easy to access as ordering a package is a genuine competitive advantage.\n\nStrategic priority framework: Build a "Prime Health" bundle — primary care (One Medical), pharmacy (Amazon Pharmacy), virtual care (Amazon Clinic), and health monitoring (data from Ring/Alexa). All accessed through a single Prime membership premium tier.\n\nWhy Amazon wins: 170M Prime members already trust Amazon for convenience. Healthcare incumbents (CVS, Walgreens, UnitedHealth) are not known for convenience. Amazon\'s logistics enables same-day medication delivery.\n\nChallenge: Healthcare is local, regulated, and relationship-driven. Amazon\'s One Medical is a strong beachhead but national coverage is years away. Regulatory complexity (HIPAA, state licensing) is a genuine moat for incumbents.'},
{type:'strategy',company:'meta',q:'Meta is betting big on the metaverse. Three years in, it has lost $40B. Should it continue?',hint:['1. Investment thesis: why the metaverse?','2. Current traction: Quest sales, Horizon Worlds, developer ecosystem','3. Time horizon for hardware platform shifts','4. Opportunity cost of $40B','5. Strategic options: double down, pivot, wind down'],model:'Investment thesis: Zuckerberg believes the next computing platform after mobile is spatial computing/AR/VR. If correct, Meta needs to lead it or be at Microsoft/Apple\'s mercy.\n\nCurrent state (2024): Quest 3 is best standalone VR headset. Apple Vision Pro validates the category but at 10x the price. Horizon Worlds has <1M DAU. Developer ecosystem is thin.\n\nThree strategic options:\n(A) Double down: Believe the thesis, hardware platform shifts take 10+ years (smartphones took 7 years). Continue investing.\n(B) Pivot to AR glasses: Shift investment from VR (gaming/niche) to AR glasses (mass market, Orion prototype looks promising). Ray-Ban Stories show early traction.\n(C) Wind down: $40B loss is too much. Refocus on core social/advertising.\n\nRecommendation: Shift emphasis from VR to AR. AR glasses have a clearer path to mass adoption than VR headsets. The key inflection point is getting AR glasses to <$500 with all-day battery. The organizational capability built in VR is directly transferable to AR. This is not winding down — it\'s pivoting to the higher-probability bet within the same strategic thesis.'},
{type:'strategy',company:'google',q:'How should Google compete with Shopify in e-commerce infrastructure?',hint:['1. Shopify\'s moat: merchant ecosystem, payments, logistics network','2. Google\'s assets: Shopping tab, Merchant Center, Maps, Pay','3. Build vs. partner strategy','4. Where Google uniquely wins','5. Avoid direct competition where Google has no advantage'],model:'Shopify moat: 1.7M merchants, proprietary logistics (Shopify Fulfillment Network), Shopify Payments, App Store ecosystem.\n\nDirect competition would be expensive and slow. Google should not build a merchant platform.\n\nGoogle\'s unique advantage: Discovery and intent. Google is where shoppers start — 49% of product searches start on Google (vs. 46% on Amazon). Shopify merchants need Google more than Google needs to be Shopify.\n\nStrategy: Be the best merchant acquisition and analytics tool for Shopify merchants, not a competitor.\n\n(1) Google Shopping as a premium merchant channel — deepen free listings, improve Shopping tab UX.\n(2) Google Analytics 4 + Merchant Center integration — give merchants better insights than Shopify native analytics.\n(3) Google Maps + local inventory — "Buy near you" for brick-and-mortar Shopify merchants.\n(4) Google Pay as a checkout option Shopify merchants want.\n\nThe bet: If Google is essential to merchant acquisition, merchants will pay for Google Ads. This is more sustainable than platform competition.'},

{type:'metrics',company:'google',q:'How would you measure the quality of Google Translate?',hint:['1. BLEU score (automated) vs. human evaluation','2. Language pair coverage','3. User satisfaction','4. Real-world task success (not just text accuracy)','5. Business metrics: % searches served in non-English'],model:'Multi-dimensional quality measurement:\n\n1. Automated quality: BLEU score — compares machine translation to human reference translations. Limitation: doesn\'t capture fluency or meaning well.\n\n2. Human evaluation: MOS (Mean Opinion Score) — human raters score translations on fluency (1-5) and adequacy (1-5). More expensive but higher signal.\n\n3. User behavior signals: (a) Did the user edit the translation? Edits = quality failure. (b) Did the user copy the translation (suggesting they trust it)? (c) Re-translation rate: user translates back to check if meaning preserved.\n\n4. Task completion: For key use cases — did the user successfully communicate what they intended? A/B test with human translation vs. machine.\n\n5. Language pair prioritization: Quality varies enormously by language pair. Track separately for high-traffic (Spanish, French) vs. low-resource languages (Swahili, Hmong).\n\n6. Business metric: % of non-English Google searches that use Translate in the session. Higher quality → more users trust it → more usage.'},
{type:'metrics',company:'meta',q:'What metrics would you use to evaluate the success of Instagram\'s Reels feature?',hint:['1. Engagement metrics for Reels specifically','2. Creator-side metrics (supply)','3. Business impact (ads, time-spent)','4. Counter-metrics (avoid gaming engagement)','5. Comparison to TikTok benchmark'],model:'Reels success framework:\n\nViewer-side: (1) Reels plays per DAU (reach). (2) Average watch completion rate (quality signal — higher % = more engaging). (3) Shares per Reel (virality). (4) Session starting with Reels (discovery power). (5) Time spent on Reels as % of total Instagram time.\n\nCreator-side: (1) % of active users who post a Reel in last 30 days. (2) Creator retention: % of Reels creators who post again in 7 days. (3) Professional creator share: % of Reels from verified/monetizing creators (quality proxy).\n\nBusiness: (1) Reels ad CPM vs. Feed/Stories. (2) Reels-attributable DAU incremental growth. (3) Time-in-app of Reels-heavy users vs. non-Reels users.\n\nCounter-metrics: (1) Clickbait engagement rate (high click, low watch completion). (2) Content policy violation rate per 1000 Reels. (3) % users who report a Reel per session.\n\nNorth Star: "Reels sessions per DAU" — captures both availability and habitual use.'},
{type:'metrics',company:'amazon',q:'How do you measure the success of Amazon\'s same-day delivery program?',hint:['1. Customer experience metrics','2. Operational metrics','3. Business impact','4. Geographic rollout metrics','5. Trade-offs: speed vs. cost vs. accuracy'],model:'Same-day delivery success metrics:\n\nCustomer Experience: (1) On-time rate: % of same-day orders delivered within the promised window. Target: >95%. (2) Customer satisfaction (CSAT): Post-delivery survey. (3) Return rate: Same-day orders returned within 7 days (quality proxy — were items correct?). (4) Repeat usage rate: % of same-day users who use it again within 30 days.\n\nOperational: (1) Average delivery cost per same-day order (vs. standard). (2) Warehouse utilization: % of same-day eligible SKUs actually fulfilled same-day. (3) Last-mile efficiency: Packages per driver per hour.\n\nBusiness Impact: (1) Same-day order incremental value: GMV from orders that wouldn\'t have been placed without same-day option (survey-based). (2) Prime renewal rate for same-day users vs. non-users. (3) Category penetration: % of eligible categories using same-day.\n\nNorth Star: "On-time same-day delivery rate" — the core promise. If this falls, everything else is irrelevant.'},
{type:'metrics',company:'google',q:'Gmail has a new "Smart Compose" feature. How do you measure whether it\'s successful?',hint:['1. Feature adoption vs. quality','2. User behavior changes','3. Time saved (the value prop)','4. Satisfaction vs. utility distinction','5. Long-term retention signal'],model:'Smart Compose success metrics:\n\nAdoption: (1) % of emails sent with at least one Smart Compose suggestion accepted. (2) % of active Gmail users who use Smart Compose in a session. Benchmark: >20% adoption within 30 days of launch.\n\nQuality: (1) Acceptance rate: % of suggestions shown that are accepted. Low acceptance = poor suggestion quality. Target: >15%. (2) Edit-after-accept rate: % of accepted suggestions that user immediately edits. High edit rate = suggestions are directionally right but wordy/off.\n\nValue Delivery: (1) Words written per session for Smart Compose users vs. control. Higher word count (if writing more emails) or lower time-per-email suggests efficiency gain. (2) Email send rate: Are users sending more emails? Increased send rate suggests Smart Compose reduces friction.\n\nSatisfaction: (1) NPS for Smart Compose feature (opt-in survey to users). (2) Feature disable rate: % of users who turn off Smart Compose in settings. High disable = net negative.\n\nNorth Star: Net benefit score — acceptance rate × improvement in email composition time. Captures both adoption and value.'},

{type:'behavioral',company:'google',q:'Describe a time you had to rapidly learn a new domain to do your job effectively.',hint:['STAR framework','Show learning strategy (not just "I read a lot")','How did you validate your learning?','How did domain knowledge change your product decisions?','Google values intellectual curiosity and learning agility'],model:'Strong answer:\n\n"I was assigned as PM for a healthcare data product after spending 3 years in consumer. I had two weeks before my first stakeholder meeting with hospital CIOs.\n\nLearning strategy: (1) I mapped the domain first — who are the key players, what are the regulatory constraints (HIPAA), what does the customer job-to-be-done look like for a hospital administrator? (2) I did 15 customer discovery calls in 10 days — not to sell, just to listen and learn vocabulary and pain. (3) I found the 2 internal domain experts and scheduled weekly 30-min briefings. (4) I read the 3 industry reports most cited by customers.\n\nValidation: After 2 weeks, I wrote a one-pager on my understanding of the domain and had the domain experts fact-check it. They corrected 3 significant misunderstandings.\n\nImpact on decisions: I initially wanted to launch with direct patient data access. The domain knowledge told me this required BAA (Business Associate Agreement) with every customer — a 3-6 month sales cycle blocker. I changed the MVP to aggregate, de-identified data only, removing the regulatory barrier.\n\nKey learning: Domain expertise is not about knowing everything — it\'s about knowing what you don\'t know and building the right knowledge network."'},
{type:'behavioral',company:'meta',q:'Tell me about a time you turned user feedback into a successful product change.',hint:['STAR framework','Be specific about what feedback and how collected','Show how you filtered signal from noise','Describe the change and outcome quantitatively','Meta values shipping quickly based on user insights'],model:'Strong answer:\n\n"During discovery for a feature, I conducted user interviews and noticed a pattern: 7 of 12 users mentioned they felt overwhelmed by notifications, but only 2 had actually adjusted notification settings.\n\nThis told me: (1) The problem is real and widespread. (2) Current notification settings are too hard to find or adjust.\n\nI validated this hypothesis: I dug into data and found that <3% of users had ever opened notification settings, despite 40% having disabled all notifications for the app entirely (a blunt response to the problem).\n\nChange: I proposed a "Notification Digest" — instead of multiple scattered notifications throughout the day, users would receive one summary at a time of their choosing. I fought for this against the eng team\'s preference for a simpler settings page improvement.\n\nResult: We A/B tested both. Notification Digest reduced daily notification volume by 35% for users in the test group but INCREASED re-engagement with notified content by 12% because users were in the right mindset when they opened it. DAU impact: +0.8% for the test cohort (statistically significant).\n\nKey signal: User feedback was pointing at a symptom (too many notifications). The real problem was timing and relevance, not just volume."'},
{type:'behavioral',company:'amazon',q:'Describe a time you had to work with a very difficult cross-functional partner.',hint:['STAR: be specific about who and why they were difficult','Show empathy — understand their perspective','Describe your resolution approach','Amazon LP: Earn Trust, Bias for Action','Outcome: did the project succeed?'],model:'Strong answer:\n\n"The head of the legal team consistently delayed my feature launches by requesting extensive reviews. He\'d ask for 2-3 week review cycles on features that I believed had minimal legal risk.\n\nInstead of working around him, I invested time in understanding his perspective. I asked for a 30-minute coffee to understand his biggest concerns and what \'adequate review\' meant to him.\n\nWhat I learned: He had been burned by a previous PM team that shipped a feature that resulted in a $2M regulatory fine. His caution was rational, not obstructionist. He also felt he was pulled in at the last minute, which forced him into a reactive mode.\n\nSolution: I proposed \'legal pre-mortems\' — a 1-page legal risk assessment I\'d write at the start of each project, reviewed by his team at the 20% done stage. This gave him early visibility and gave me 3 weeks to adjust before legal became a launch blocker.\n\nResult: Our next 4 features all shipped on time. His review cycle dropped from 2-3 weeks to 5 days because we were addressing risks earlier. We now have a template other PMs use company-wide.\n\nKey insight: \'Difficult\' partners usually have legitimate concerns. Find the root cause before changing the relationship."'},
{type:'behavioral',company:'google',q:'How do you keep your team motivated during a long, difficult project?',hint:['Show awareness of team psychology','Specific tactics, not platitudes','Progress visibility matters','Connect work to user impact','How you handle failure states within the project'],model:'Specific motivation tactics I use on long projects:\n\n1. Break into milestones with celebrations: A 12-month project needs quarterly wins. I define "milestone moments" — shipping to beta users, hitting 1K signups, passing infra review — and celebrate them explicitly (team lunch, shout-out in all-hands).\n\n2. Connect work to users: I bring in 1 user story every 2 weeks to sprint reviews — a quote from a user interview, a support ticket that our work will solve. Abstract product work becomes concrete human impact.\n\n3. Protect the team from organizational turbulence: When priorities shift above us, I filter and translate — I explain what changed and why, and reframe which parts of our work still matter. Uncertainty is demoralizing; clarity restores energy.\n\n4. One-on-ones with honest check-ins: I ask "On a scale of 1-10, how energized are you by this project right now?" and actually listen. If someone is a 5 or below, I dig in and address the root cause — usually scope ambiguity or impact uncertainty.\n\n5. Acknowledge when things are hard: I\'ve found that saying "this sprint was genuinely difficult, and here\'s why it mattered" is more motivating than false positivity.\n\nWhat I avoid: Mandatory "fun" activities that don\'t match the team\'s culture, and empty praise without context.'},

{type:'technical',company:'google',q:'What is the difference between SQL and NoSQL databases? When would you choose each?',hint:['1. Structure: schema vs. schemaless','2. Scaling: horizontal vs. vertical','3. ACID vs. BASE','4. Real product examples for each','5. PM-level: when does this choice matter for your product?'],model:'SQL (Relational): Structured tables, fixed schema, ACID transactions (Atomicity, Consistency, Isolation, Durability), vertical scaling primarily.\nExamples: PostgreSQL, MySQL, Amazon RDS.\n\nNoSQL: Flexible schema (document, key-value, graph, columnar), BASE (Basically Available, Soft-state, Eventually consistent), horizontal scaling.\nExamples: MongoDB (document), Redis (key-value), Cassandra (wide-column), Neo4j (graph).\n\nChoose SQL when: Data has clear relationships and needs consistency (financial transactions, user accounts, inventory). You need complex queries with JOINs. Data structure is stable.\n\nChoose NoSQL when: High write volume, need horizontal scaling (billions of events). Data is unstructured or semi-structured (user activity logs, content metadata). Low latency reads at massive scale (Redis for session data, Cassandra for time-series).\n\nHybrid: Most large products use both. User profile (SQL for consistency), user activity feed (Cassandra for scale), session token (Redis for speed).\n\nPM insight: The DB choice affects your team\'s velocity and your product\'s scalability ceiling. Ask your engineers early — changing the database after scale is painful and expensive.'},
{type:'technical',company:'meta',q:'How would you explain REST API to a non-technical product manager?',hint:['1. Analogy-first explanation','2. Core concepts: request, response, methods','3. Why PMs should care','4. Common product use cases','5. Security considerations'],model:'Analogy: Think of a restaurant. You (the client) look at the menu (API documentation), give your order to the waiter (API request), the kitchen (server) prepares it, and the waiter brings it back (API response). REST is the standard for how you communicate with the kitchen.\n\nCore concepts for PMs:\n- Endpoint: A URL that represents a resource. GET /users/123 retrieves user 123.\n- Methods: GET (read), POST (create), PUT (update), DELETE (remove).\n- Request/Response: You send structured data (JSON), you get structured data back.\n- Status codes: 200 OK, 404 Not Found, 500 Server Error.\n\nWhy PMs should care:\n1. API dependencies: If your feature requires a new API endpoint, that\'s an engineering cost. Know this before committing to a timeline.\n2. Third-party integrations: "We\'ll integrate with Stripe" — understand that this means calling Stripe\'s REST API, which has rate limits and reliability implications.\n3. Mobile performance: More API calls = more latency = worse UX. Design features to minimize round trips.\n4. Data contracts: API design is a contract between teams. Changes break things. Stability matters.\n\nSecurity: Never expose sensitive data in GET URL parameters (visible in logs). Authentication tokens must be in headers, not URLs.'},
{type:'technical',company:'amazon',q:'What is the difference between machine learning and traditional programming from a PM perspective?',hint:['1. Rule-based vs. learned behavior','2. How does ML "work" at a conceptual level','3. ML product challenges: data, accuracy, explainability, bias','4. When to use ML vs. rules','5. PM responsibility for ML products'],model:'Traditional programming: A human writes explicit rules. IF condition THEN action. Deterministic and explainable.\nExample: "If price < $10, show \'Budget Pick\' badge."\n\nMachine learning: A model learns patterns from examples (training data). No explicit rules written. The model predicts outcomes based on patterns.\nExample: "Show this user products they\'re likely to buy next" — model learns from millions of purchase histories.\n\nML-specific product challenges PMs must understand:\n1. Training data quality: "Garbage in, garbage out." If historical data is biased (e.g., hiring model trained on historical male hires), the model perpetuates bias.\n2. Accuracy vs. coverage: A 95% accurate fraud model still flags 5% of legitimate transactions. At 1M transactions/day, that\'s 50,000 false positives. Design the user experience for the errors, not just the successes.\n3. Explainability: Users often want to know "why?" ML models can\'t always explain their reasoning. Build explainability features or set user expectations.\n4. Concept drift: The world changes. A model trained on 2020 data may perform poorly in 2024. PMs must build model retraining into the roadmap.\n5. Feedback loops: ML predictions affect behavior, which affects future training data. A recommendation model that shows popular content → makes popular content more popular → skews future recommendations.\n\nPM responsibility: Define success metrics before training (don\'t let the data science team optimize for a metric you didn\'t agree on). Own the model\'s user impact, not just technical performance.'}
];

// ─── STATE ────────────────────────────────────────────────────────────────────
const S=k=>localStorage.getItem('a114_'+k);
const W=(k,v)=>localStorage.setItem('a114_'+k,JSON.stringify(v));
const J=k=>{try{return JSON.parse(S(k));}catch{return null;}};
let history = J('sessions') || [];
let selectedCo = 'all';

function saveHistory(){ W('sessions', history); updateHdrStat(); }
function updateHdrStat(){
  const total = history.length;
  const avgScore = total > 0 ? Math.round(history.reduce((a,b)=>a+b.avgScore,0)/total) : 0;
  document.getElementById('hdr-stat').textContent = total > 0 ? total+' sessions · avg '+avgScore+'%' : '';
}
updateHdrStat();

// ─── NAV ──────────────────────────────────────────────────────────────────────
function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='bank') renderBank();
  if(id==='history') renderHistory();
}
function selCo(btn){
  document.querySelectorAll('.co-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selectedCo = btn.dataset.co;
}

// ─── TYPE/COMPANY METADATA ────────────────────────────────────────────────────
const TYPE_META = {
  product:   {label:'Product Design',  color:'blue',  frameworks:['User → Pain Points → Solutions → Trade-offs','Goal Clarification → Personas → Features → Metrics','Problem Space → Solution Space → Go-to-Market']},
  estimation:{label:'Estimation',      color:'green', frameworks:['Start with known anchors','Break into segments and multiply','Sanity check with cross-references','State assumptions explicitly','Order of magnitude first, then refine']},
  strategy:  {label:'Strategy',        color:'purple',frameworks:['Competitive analysis: strengths vs. threats','Strategic options: build/buy/partner','Framework: Porter\'s Five Forces','Cost-benefit of each option','Recommendation with explicit trade-offs']},
  metrics:   {label:'Metrics',         color:'yellow',frameworks:['Validate data first','Segment: device / region / user type / time','Internal (product changes) vs. external causes','Hypothesize, prioritize, test','Define North Star + Supporting + Counter metrics']},
  behavioral:{label:'Behavioral',      color:'orange', frameworks:['STAR: Situation → Task → Action → Result','Be specific, not generic','Quantify outcomes when possible','Show self-awareness and growth','Tie to company Leadership Principles']},
  technical: {label:'Technical',       color:'blue',   frameworks:['Define scope and requirements first','Trade-offs for each approach','Scale considerations','Real-world examples','Explain to a non-engineer clearly']}
};
const CO_LABELS = {google:'🔵 Google',meta:'🔷 Meta',amazon:'🟠 Amazon'};

// ─── SESSION ──────────────────────────────────────────────────────────────────
let session = null;
let sessTimer = null;
const RUBRIC_DIMS = [
  {id:'structure',  label:'Structure & Framework', desc:'Used a logical, clear framework appropriate to the question'},
  {id:'user',       label:'User Empathy',           desc:'Demonstrated understanding of user needs and pain points'},
  {id:'data',       label:'Data & Metrics',         desc:'Referenced data, metrics, and quantitative thinking'},
  {id:'tradeoffs',  label:'Trade-offs & Risk',      desc:'Acknowledged trade-offs and potential failure modes'},
  {id:'impact',     label:'Impact & Clarity',       desc:'Communicated clearly with strong business impact focus'}
];

function startSession(){
  const type  = document.getElementById('s-type').value;
  const count = parseInt(document.getElementById('s-count').value);
  const time  = parseInt(document.getElementById('s-time').value);

  let pool = QUESTIONS.filter(q=>(type==='all'||q.type===type) && (selectedCo==='all'||q.company===selectedCo));
  if(pool.length === 0){ alert('No questions match your filters. Try different settings.'); return; }
  // shuffle
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const qs = pool.slice(0, Math.min(count, pool.length));

  session = {
    qs, current: 0,
    responses: [], scores: [],
    secsLeft: time, hasTimer: time > 0,
    startTime: Date.now()
  };

  document.getElementById('session-setup').style.display='none';
  document.getElementById('session-active').style.display='block';
  document.getElementById('session-results').style.display='none';

  if(session.hasTimer){
    sessTimer = setInterval(tickSessTimer, 1000);
    updateTimerDisplay();
  } else {
    document.getElementById('sess-timer').textContent = '∞';
  }

  buildRubric();
  renderSessionQ();
}

function tickSessTimer(){
  session.secsLeft--;
  updateTimerDisplay();
  if(session.secsLeft <= 0){ clearInterval(sessTimer); endSession(false); }
}
function updateTimerDisplay(){
  const m=Math.floor(session.secsLeft/60), s=session.secsLeft%60;
  const el=document.getElementById('sess-timer');
  el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  el.classList.toggle('danger', session.secsLeft<=300);
}

function renderSessionQ(){
  const q = session.qs[session.current];
  const tm = TYPE_META[q.type];
  const typeBadge = document.getElementById('q-type-badge');
  typeBadge.className='q-type-badge badge-'+tm.color;
  typeBadge.textContent = tm.label;
  document.getElementById('q-company-badge').innerHTML=CO_LABELS[q.company]?'<span class="badge badge-muted" style="background:var(--card2);color:var(--muted);border:1px solid var(--border);">'+CO_LABELS[q.company]+'</span>':'';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('sess-progress').textContent = 'Question '+(session.current+1)+' of '+session.qs.length;
  document.getElementById('q-response').value = '';
  document.getElementById('hint-panel').style.display='none';
  document.getElementById('model-ans-panel').style.display='none';
  document.getElementById('hint-btn').textContent='💡 Framework Hint';
  document.getElementById('ans-btn').textContent='📖 Model Answer';
  resetRubric();
  // Per-question timer (8 min)
  const qTimerEl=document.getElementById('q-per-timer');
  qTimerEl.textContent='Suggested: 8 minutes per question';
}

function toggleHint(){
  const panel = document.getElementById('hint-panel');
  const q = session.qs[session.current];
  const tm = TYPE_META[q.type];
  const showing = panel.style.display !== 'none';
  if(showing){ panel.style.display='none'; document.getElementById('hint-btn').textContent='💡 Framework Hint'; return; }
  // Build hint content: question-specific hints + framework
  const allHints = [...(q.hint||[]), '', '── General Framework ──', ...(tm.frameworks||[])];
  panel.innerHTML='<div class="hint-title">Framework & Steps</div><ul class="hint-steps">'+
    allHints.filter(h=>h).map(h=>'<li>'+h+'</li>').join('')+'</ul>';
  panel.style.display='block';
  document.getElementById('hint-btn').textContent='✕ Hide Hint';
}

function toggleModelAns(){
  const panel = document.getElementById('model-ans-panel');
  const q = session.qs[session.current];
  const showing = panel.style.display !== 'none';
  if(showing){ panel.style.display='none'; document.getElementById('ans-btn').textContent='📖 Model Answer'; return; }
  panel.innerHTML='<div class="model-answer">'+q.model+'</div>';
  panel.style.display='block';
  document.getElementById('ans-btn').textContent='✕ Hide Answer';
}

function buildRubric(){
  const el = document.getElementById('rubric');
  el.innerHTML='';
  RUBRIC_DIMS.forEach(d=>{
    const div=document.createElement('div');
    div.className='rubric-dim';
    div.innerHTML=`<div class="rubric-dim-name">
      <span>${d.label}</span>
      <span class="score-display" id="score-${d.id}">0 / 20</span>
    </div>
    <div class="rubric-dim-desc">${d.desc}</div>
    <input type="range" class="score-slider" id="slider-${d.id}" min="0" max="20" value="0" step="1" oninput="updateScore('${d.id}')">`;
    el.appendChild(div);
  });
  updateTotalScore();
}
function resetRubric(){
  RUBRIC_DIMS.forEach(d=>{
    const sl=document.getElementById('slider-'+d.id);
    if(sl){ sl.value=0; document.getElementById('score-'+d.id).textContent='0 / 20'; }
  });
  updateTotalScore();
}
function updateScore(id){
  const val=parseInt(document.getElementById('slider-'+id).value);
  document.getElementById('score-'+id).textContent=val+' / 20';
  updateTotalScore();
}
function updateTotalScore(){
  const total=RUBRIC_DIMS.reduce((s,d)=>{const sl=document.getElementById('slider-'+d.id);return s+(sl?parseInt(sl.value):0);},0);
  document.getElementById('total-score').textContent=total+'/100';
  document.getElementById('total-score').style.color=total>=80?'var(--green)':total>=60?'var(--yellow)':'var(--red)';
}
function getScores(){
  const scores={};
  RUBRIC_DIMS.forEach(d=>{ scores[d.id]=parseInt(document.getElementById('slider-'+d.id).value); });
  return scores;
}

function submitQ(){
  const resp = document.getElementById('q-response').value.trim();
  const scores = getScores();
  const total = Object.values(scores).reduce((a,b)=>a+b,0);
  session.responses.push(resp);
  session.scores.push({total, ...scores});
  session.current++;
  if(session.current >= session.qs.length){ endSession(false); }
  else { renderSessionQ(); }
}
function skipQ(){ session.responses.push(''); session.scores.push({total:0}); session.current++; if(session.current>=session.qs.length) endSession(false); else renderSessionQ(); }

function endSession(manual){
  clearInterval(sessTimer);
  const answered = session.scores.filter(s=>s.total>0).length;
  const avgScore = answered>0 ? Math.round(session.scores.filter(s=>s.total>0).reduce((a,b)=>a+b.total,0)/answered) : 0;
  const duration = Math.round((Date.now()-session.startTime)/60000);

  // Save to history
  const rec={
    date: new Date().toLocaleDateString(),
    qs: session.qs.map(q=>({q:q.q,type:q.type,company:q.company})),
    scores: session.scores,
    avgScore, answered, total: session.qs.length, duration
  };
  history.unshift(rec);
  if(history.length>20) history.pop();
  saveHistory();

  document.getElementById('session-active').style.display='none';
  const resEl=document.getElementById('session-results');
  resEl.style.display='block';

  const scoreColor=avgScore>=80?'var(--green)':avgScore>=60?'var(--yellow)':'var(--red)';
  let qBreakdown='';
  session.qs.forEach((q,i)=>{
    const sc=session.scores[i]||{total:0};
    const tm=TYPE_META[q.type];
    qBreakdown+=`<div class="score-row"><span style="flex:1;font-size:.82rem;line-height:1.4;">${q.q.slice(0,80)}…</span><span class="badge badge-${tm.color}" style="margin-left:8px;">${tm.label}</span><span style="font-weight:700;min-width:50px;text-align:right;color:${sc.total>=80?'var(--green)':sc.total>=60?'var(--yellow)':'var(--red)'};">${sc.total}/100</span></div>`;
  });

  resEl.innerHTML=`<div class="card" style="text-align:center;">
    <div class="card-title">Session Complete${manual?' (Ended Early)':''}</div>
    <div class="score-circle" style="border-color:${scoreColor};color:${scoreColor}">${avgScore}%</div>
    <div style="font-size:1rem;margin-bottom:6px;">${answered} of ${session.qs.length} answered · ${duration} min</div>
    <div style="font-size:.82rem;color:var(--muted);margin-bottom:16px;">${avgScore>=80?'Excellent performance!':avgScore>=60?'Good — review weaker areas.':'Keep practicing!'}</div>
    <div>${qBreakdown}</div>
    <button class="btn btn-blue" style="margin-top:14px;" onclick="document.getElementById('session-setup').style.display='block';document.getElementById('session-results').style.display='none';renderRecentSessions();">New Session</button>
  </div>`;
}

function renderRecentSessions(){
  const el=document.getElementById('recent-sessions');
  if(history.length===0){el.innerHTML='<div style="color:var(--muted);font-size:.82rem;">No sessions yet.</div>';return;}
  el.innerHTML=history.slice(0,5).map(s=>`<div class="hist-item"><span>${s.date} · ${s.duration} min</span><span class="badge badge-${s.avgScore>=80?'green':s.avgScore>=60?'yellow':'red'}">${s.answered}/${s.total} answered · ${s.avgScore}%</span></div>`).join('');
}
renderRecentSessions();

// ─── QUESTION BANK ────────────────────────────────────────────────────────────
function renderBank(){
  const type=document.getElementById('bank-type').value;
  const co=document.getElementById('bank-co').value;
  const pool=QUESTIONS.filter(q=>(type==='all'||q.type===type)&&(co==='all'||q.company===co));
  document.getElementById('bank-count').textContent=pool.length+' questions';
  const el=document.getElementById('bank-list');
  el.innerHTML='';
  pool.forEach(q=>{
    const tm=TYPE_META[q.type];
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
      <span class="badge badge-${tm.color}">${tm.label}</span>
      ${CO_LABELS[q.company]?'<span class="badge" style="background:var(--card2);color:var(--muted);border:1px solid var(--border);">'+CO_LABELS[q.company]+'</span>':''}
    </div>
    <div style="font-size:.9rem;font-weight:600;margin-bottom:8px;">${q.q}</div>
    <button class="btn btn-muted" style="font-size:.75rem;padding:5px 12px;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.textContent=this.textContent.includes('Show')?'Hide Hint':'Show Hint'">Show Hint</button>
    <div style="display:none;margin-top:8px;"><ul style="list-style:none;display:flex;flex-direction:column;gap:3px;">${(q.hint||[]).map(h=>'<li style="font-size:.8rem;color:var(--muted);padding:2px 0;">▸ '+h+'</li>').join('')}</ul></div>`;
    el.appendChild(div);
  });
}
renderBank();

// ─── HISTORY ──────────────────────────────────────────────────────────────────
function renderHistory(){
  const el=document.getElementById('hist-list');
  if(history.length===0){el.innerHTML='<div style="color:var(--muted);font-size:.82rem;padding:10px 0;">No sessions yet. Complete a practice session to see history.</div>';return;}
  el.innerHTML=history.map(s=>`<div class="hist-item">
    <div><div style="font-weight:600;">${s.date} · ${s.duration} min</div>
    <div style="font-size:.75rem;color:var(--muted);">${s.answered} of ${s.total} answered</div></div>
    <span class="badge badge-${s.avgScore>=80?'green':s.avgScore>=60?'yellow':'red'}">${s.avgScore}%</span>
  </div>`).join('');

  const total=history.length;
  const avgScore=total>0?Math.round(history.reduce((a,b)=>a+b.avgScore,0)/total):0;
  const totalQs=history.reduce((a,b)=>a+b.answered,0);
  const best=total>0?Math.max(...history.map(s=>s.avgScore)):0;
  document.getElementById('hist-stats').innerHTML=[
    {num:total,label:'Sessions Completed'},
    {num:totalQs,label:'Questions Answered'},
    {num:avgScore+'%',label:'Average Score'},
    {num:best+'%',label:'Best Session'}
  ].map(s=>'<div class="stat-card"><div class="stat-num">'+s.num+'</div><div class="stat-label">'+s.label+'</div></div>').join('');
}
function clearHistory(){ history=[]; saveHistory(); }
renderHistory();
</script>
</body>
</html>
