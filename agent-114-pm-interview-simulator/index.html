<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAANG Mock PM Interview Simulator — Agent #114</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--card2:#20243a;--blue:#4f8ef7;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--purple:#a78bfa;--orange:#fb923c;--text:#e2e8f0;--muted:#64748b;--border:#2d3150;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
header h1{font-size:1rem;font-weight:700;color:var(--blue);}
header span{font-size:.78rem;color:var(--muted);}
.nav{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav-btn{padding:11px 16px;background:none;border:none;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.5px;transition:all .2s;}
.nav-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.nav-btn:hover:not(.active){color:var(--text);}
.page{display:none;padding:16px;max-width:900px;margin:0 auto;}
.page.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.card-title{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-green{background:var(--green);color:#000;}
.btn-red{background:var(--red);color:#fff;}
.btn-yellow{background:var(--yellow);color:#000;}
.btn-purple{background:var(--purple);color:#000;}
.btn-muted{background:var(--card2);color:var(--muted);border:1px solid var(--border);}
.btn:hover{opacity:.85;transform:translateY(-1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;font-size:.85rem;outline:none;}
select:focus{border-color:var(--blue);}
textarea{width:100%;background:var(--card2);border:2px solid var(--border);color:var(--text);padding:12px;border-radius:8px;font-size:.88rem;line-height:1.6;outline:none;resize:vertical;font-family:inherit;}
textarea:focus{border-color:var(--blue);}
/* Timer */
.timer-box{background:var(--card2);border-radius:12px;padding:16px;text-align:center;margin-bottom:12px;}
.timer-main{font-size:2.5rem;font-weight:700;font-family:monospace;color:var(--yellow);}
.timer-main.danger{color:var(--red);animation:blink 1s infinite;}
.timer-sub{font-size:.8rem;color:var(--muted);margin-top:4px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
/* Q card */
.q-type-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;margin-bottom:8px;}
.q-text{font-size:1.05rem;font-weight:600;line-height:1.6;margin-bottom:12px;}
.q-company{font-size:.78rem;color:var(--muted);margin-bottom:12px;}
/* Framework hints */
.hint-panel{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.hint-title{font-size:.72rem;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.hint-steps{list-style:none;display:flex;flex-direction:column;gap:4px;}
.hint-steps li{font-size:.82rem;padding:4px 0;border-bottom:1px solid var(--border);color:var(--text);}
.hint-steps li::before{content:'▸ ';color:var(--blue);}
/* Model answer */
.model-answer{background:#0d1117;border-radius:8px;padding:14px;font-size:.82rem;line-height:1.8;color:#a0d8ef;border:1px solid var(--border);margin-top:10px;white-space:pre-wrap;}
/* Scoring rubric */
.rubric-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px;}
.rubric-dim{background:var(--card2);border-radius:10px;padding:12px;border:1px solid var(--border);}
.rubric-dim-name{font-size:.82rem;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.rubric-dim-desc{font-size:.75rem;color:var(--muted);margin-bottom:8px;}
.score-slider{width:100%;accent-color:var(--blue);}
.score-display{font-size:.82rem;font-weight:700;color:var(--blue);min-width:40px;text-align:right;}
/* Progress bar */
.prog-bar{height:6px;background:var(--card2);border-radius:3px;}
.prog-fill{height:100%;border-radius:3px;background:var(--blue);transition:width .4s;}
/* Badge */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;}
.badge-blue{background:#4f8ef730;color:var(--blue);}
.badge-green{background:#4ade8030;color:var(--green);}
.badge-yellow{background:#fbbf2430;color:var(--yellow);}
.badge-red{background:#f8717130;color:var(--red);}
.badge-purple{background:#a78bfa30;color:var(--purple);}
.badge-orange{background:#fb923c30;color:var(--orange);}
/* Score card */
.score-circle{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;margin:0 auto 14px;border:4px solid var(--blue);}
.score-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.85rem;}
/* Stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.stat-card{background:var(--card2);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border);}
.stat-num{font-size:1.8rem;font-weight:700;color:var(--blue);}
.stat-label{font-size:.7rem;color:var(--muted);margin-top:4px;}
/* Company tabs */
.company-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.co-tab{padding:6px 16px;border-radius:8px;border:2px solid var(--border);background:none;cursor:pointer;font-size:.82rem;font-weight:700;transition:all .2s;color:var(--muted);}
.co-tab.active{color:#fff;}
.co-tab[data-co=google].active{border-color:#4285f4;background:#4285f430;}
.co-tab[data-co=meta].active{border-color:#0668e1;background:#0668e130;}
.co-tab[data-co=amazon].active{border-color:#ff9900;background:#ff990030;}
.co-tab[data-co=all].active{border-color:var(--blue);background:#4f8ef730;color:var(--blue);}
/* History list */
.hist-item{background:var(--card2);border-radius:8px;padding:10px 14px;margin-bottom:6px;border:1px solid var(--border);font-size:.82rem;display:flex;justify-content:space-between;align-items:center;}
</style>
</head>
<body>
<header>
  <h1>🎯 FAANG Mock PM Interview Simulator</h1>
  <span>Agent #114 · 100 AI Agents Challenge</span>
  <span id="hdr-stat" style="margin-left:auto;font-size:.78rem;color:var(--muted);"></span>
</header>
<div class="nav">
  <button class="nav-btn active" onclick="showPage('session',this)">▶ Practice Session</button>
  <button class="nav-btn" onclick="showPage('bank',this)">📋 Question Bank</button>
  <button class="nav-btn" onclick="showPage('history',this)">📊 History</button>
</div>

<!-- SESSION -->
<div class="page active" id="page-session">
  <!-- Setup -->
  <div id="session-setup">
    <div class="card">
      <div class="card-title">Session Configuration</div>
      <div class="row">
        <select id="s-type">
          <option value="all">All Question Types</option>
          <option value="product">Product Design</option>
          <option value="estimation">Estimation</option>
          <option value="strategy">Strategy & Prioritization</option>
          <option value="metrics">Metrics & Analysis</option>
          <option value="behavioral">Behavioral</option>
          <option value="technical">Technical</option>
        </select>
        <select id="s-count">
          <option value="5">5 Questions</option>
          <option value="10" selected>10 Questions</option>
          <option value="15">15 Questions</option>
          <option value="20">20 Questions</option>
        </select>
        <select id="s-time">
          <option value="2700">45 min</option>
          <option value="1800">30 min</option>
          <option value="3600">60 min</option>
          <option value="0">No Timer</option>
        </select>
      </div>
      <div class="card-title" style="margin-top:6px;">Company Track</div>
      <div class="company-tabs">
        <button class="co-tab active" data-co="all" onclick="selCo(this)">All FAANG</button>
        <button class="co-tab" data-co="google" onclick="selCo(this)">🔵 Google</button>
        <button class="co-tab" data-co="meta" onclick="selCo(this)">🔷 Meta</button>
        <button class="co-tab" data-co="amazon" onclick="selCo(this)">🟠 Amazon</button>
      </div>
      <button class="btn btn-blue" onclick="startSession()" style="margin-top:8px;">▶ Start Session</button>
    </div>
    <div class="card" id="setup-history">
      <div class="card-title">Recent Sessions</div>
      <div id="recent-sessions"></div>
    </div>
  </div>

  <!-- Active session -->
  <div id="session-active" style="display:none;">
    <div class="timer-box">
      <div class="timer-main" id="sess-timer">45:00</div>
      <div class="timer-sub" id="sess-progress">Question 1 of 10</div>
    </div>
    <div class="card">
      <div id="q-type-badge"></div>
      <div id="q-company-badge" style="margin-bottom:6px;"></div>
      <div id="q-text" class="q-text"></div>
      <div id="q-per-timer" style="font-size:.8rem;color:var(--muted);margin-bottom:10px;"></div>
      <div class="row">
        <button class="btn btn-muted" id="hint-btn" onclick="toggleHint()">💡 Framework Hint</button>
        <button class="btn btn-muted" id="ans-btn" onclick="toggleModelAns()">📖 Model Answer</button>
      </div>
      <div id="hint-panel" class="hint-panel" style="display:none;"></div>
      <div id="model-ans-panel" style="display:none;"></div>
      <textarea id="q-response" rows="7" placeholder="Type your answer here… Structure it using the framework hint. Think out loud."></textarea>
    </div>
    <!-- Scoring rubric -->
    <div class="card">
      <div class="card-title">Self-Score This Answer (5 dimensions × 20 pts = 100)</div>
      <div class="rubric-grid" id="rubric"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);">
        <span style="font-weight:700;">Total Score</span>
        <span style="font-size:1.3rem;font-weight:700;color:var(--blue);" id="total-score">0/100</span>
      </div>
    </div>
    <div class="row" style="justify-content:space-between;">
      <button class="btn btn-muted" onclick="skipQ()">Skip →</button>
      <button class="btn btn-green" onclick="submitQ()">Submit & Next ✓</button>
      <button class="btn btn-red" onclick="endSession(true)">End Session</button>
    </div>
  </div>

  <!-- Results -->
  <div id="session-results" style="display:none;"></div>
</div>

<!-- QUESTION BANK -->
<div class="page" id="page-bank">
  <div class="card">
    <div class="card-title">All 120 Questions</div>
    <div class="row">
      <select id="bank-type" onchange="renderBank()">
        <option value="all">All Types</option>
        <option value="product">Product Design</option>
        <option value="estimation">Estimation</option>
        <option value="strategy">Strategy</option>
        <option value="metrics">Metrics</option>
        <option value="behavioral">Behavioral</option>
        <option value="technical">Technical</option>
      </select>
      <select id="bank-co" onchange="renderBank()">
        <option value="all">All Companies</option>
        <option value="google">Google</option>
        <option value="meta">Meta</option>
        <option value="amazon">Amazon</option>
      </select>
      <span id="bank-count" style="font-size:.78rem;color:var(--muted);"></span>
    </div>
  </div>
  <div id="bank-list"></div>
</div>

<!-- HISTORY -->
<div class="page" id="page-history">
  <div class="card">
    <div class="card-title">Performance Overview</div>
    <div class="stat-grid" id="hist-stats"></div>
  </div>
  <div class="card">
    <div class="card-title">Session History</div>
    <div id="hist-list"></div>
  </div>
  <button class="btn btn-muted" onclick="if(confirm('Reset all history?')){clearHistory();renderHistory();}">🗑 Reset History</button>
</div>

<script>
// ─── QUESTION DATA ─────────────────────────────────────────────────────────────
// Format: {type, company, q, hint[], model}
// 20 questions per type × 6 types = 120
const QUESTIONS = [
// ─ PRODUCT DESIGN ──────────────────────────────────────────────────────────
{type:'product',company:'google',q:'Design a product for seniors who want to stay connected with their grandchildren.',hint:['1. Clarify the problem & goals','2. Define user personas (seniors: tech comfort, physical limitations)','3. User journey & pain points','4. Core features (max 3)','5. Success metrics','6. Trade-offs & risks'],model:'I\'d start by clarifying: are we building a standalone app, integrating into existing Google products, or a device? I\'ll assume a mobile-first app.\n\nUser personas: Tech-novice grandparent (70+, limited smartphone experience, possible vision/motor issues) and digitally active grandchild (8-25).\n\nKey pain points from research: Complexity of current apps, fear of "doing something wrong," poor visibility, asynchronous communication gap.\n\nCore features: (1) Large-button, simplified interface with voice navigation. (2) Automatic photo/video sharing — grandchildren opt-in to send life updates automatically. (3) Easy video calls with one-tap reconnect.\n\nSuccess metrics: DAU, avg session length, % users making ≥1 connection/week, churn rate < 5%/month.\n\nTrade-off: Simplicity vs. features — I\'d cut all non-essential features in v1 to maximize adoption by the key persona.'},
{type:'product',company:'google',q:'How would you improve Google Maps for visually impaired users?',hint:['1. Understand current state & user needs','2. Identify specific pain points by impairment level','3. Leverage existing Google tech (voice, AI)','4. Prioritize: navigation vs. discovery vs. ambient info','5. Metrics: task completion rate, error rate, NPS'],model:'Visually impaired users span a spectrum from low vision to complete blindness. Current Maps has basic screen reader support but lacks deep accessibility.\n\nPain points: (1) No real-time obstacle detection on sidewalks. (2) Visual map not useful. (3) "Turn in 200 ft" is imprecise for a pedestrian.\n\nOpportunities: (1) AI-powered audio descriptions of surroundings using phone camera (Google Lens integration). (2) Haptic feedback for turn-by-turn on supported devices. (3) Crowdsourced accessibility data (elevator status, ramp locations). (4) Transit: exact car boarding instructions.\n\nPriority: Real-time audio navigation with camera-based obstacle warnings — highest impact.\n\nMetrics: Task completion rate for navigation, time-to-destination, user satisfaction (NPS from accessibility community).'},
{type:'product',company:'google',q:'Design a feature to help remote teams collaborate better using Google Workspace.',hint:['1. Define "collaborate better" — what problem?','2. Identify personas (async vs. sync workers, time zones)','3. Current tools gap analysis','4. Feature ideation','5. Pick 1 feature with clear rationale','6. MVP scope, metrics'],model:'Remote collaboration breaks down in three ways: async information loss, meeting fatigue, and social isolation.\n\nI\'ll focus on async information loss — the highest-impact problem. When a decision happens in a meeting, distributed team members miss context.\n\nFeature: "Decision Log" — automatically transcribes Google Meet meetings, extracts action items and decisions using AI, and posts a structured summary to a shared Google Doc with @mentions. Team members can comment, ask questions, or mark themselves as informed.\n\nWhy better than alternatives: Slack threads get buried; email is slow; current Meet transcripts are raw and unsearchable.\n\nMVP: AI-extracted action items + automatic Doc creation + @mention notification. v2 adds decision search and calendar linking.\n\nMetrics: % meetings with action items completed on time; reduction in follow-up meeting frequency; user survey on information clarity.'},
{type:'product',company:'meta',q:'Design a new feature for Instagram to reduce feelings of social comparison.',hint:['1. Clarify goal: wellbeing vs. engagement trade-off','2. Research: what causes comparison? (likes, follower counts, highlight reels)','3. Ideate solutions','4. Consider Meta\'s business model constraints','5. Metrics: wellbeing score, session quality over quantity'],model:'Social comparison on Instagram is driven by: visible like/follower counts, curated "perfect life" content, and algorithmic amplification of aspirational posts.\n\nMeta must balance user wellbeing with ad revenue (more time → more ads). I\'d argue improving wellbeing increases long-term retention.\n\nThree directions: (1) Hide public metrics by default (already piloted — reduces anxiety). (2) "Real Life" mode — prompt users to post unfiltered content 1x/week; algorithmically surface it. (3) Connection Score — shift feed algorithm to prioritize posts from close friends over influencers.\n\nI\'d prioritize Connection Score as it improves wellbeing while potentially increasing meaningful engagement (vs. passive scroll).\n\nMeasure: Time well spent survey, % users reporting lower anxiety, DAU retention, share of close-friend interactions. Risk: engagement may dip short-term — A/B test carefully.'},
{type:'product',company:'meta',q:'You are a PM at WhatsApp. Design a monetization feature that does not compromise user trust.',hint:['1. User trust = privacy, no ads, no spam','2. Explore: business messaging, premium features, payments','3. Evaluate each for trust impact','4. Choose one with clear rationale','5. Rollout strategy to maintain trust'],model:'WhatsApp\'s brand promise is privacy. Any monetization must not compromise end-to-end encryption or introduce spam.\n\nOptions evaluated: (1) Ads in Status (low trust impact, WhatsApp already experimenting). (2) Business API (already exists — expand). (3) WhatsApp Pay (payments in chat — high value, already launched in India). (4) Premium subscription for power users.\n\nI\'d recommend Premium subscription: $2.99/month for features that power users want but don\'t compromise core privacy: multiple device sync beyond 4 devices, message scheduling, advanced backup controls, larger file transfers (5GB vs. 2GB).\n\nWhy this maintains trust: entirely opt-in, core features remain free, no data monetization.\n\nTarget: business users and heavy personal users. 5% conversion of 2B MAU = 100M subscribers = $3.6B ARR at $3/month.\n\nRisks: Backlash if free features get paywalled. Mitigation: never remove existing free features.'},
{type:'product',company:'meta',q:'Design a safety feature for Facebook Marketplace to protect buyers and sellers.',hint:['1. Map current safety risks (fraud, fake items, dangerous meetups)','2. User personas: casual sellers, buyers, power users','3. Solutions by risk category','4. Balance friction vs. safety','5. Metrics: fraud rate, dispute rate, user trust score'],model:'Facebook Marketplace has three main safety risks: (1) Item fraud (fake/misrepresented goods). (2) Payment scams. (3) Physical safety at meetups.\n\nFor item fraud: Verified seller badge (ID-verified + positive reviews), photo authenticity check using AI to detect stock images, and escrow-style payment hold until buyer confirms receipt.\n\nFor payment scams: Integrate Facebook Pay with buyer protection; flag unusual payment requests (gift cards, wire transfer).\n\nFor meetup safety: "Safe Meetup" feature — suggests public Facebook-verified locations, allows user to share real-time location with a trusted contact, "I\'m safe" check-in prompt.\n\nPriority: Escrow payment system + safe meetup locations — these address highest-severity harms.\n\nMetrics: Dispute rate (target < 0.5%), fraud report rate, completion rate of transactions, seller trust score.'},
{type:'product',company:'amazon',q:'Design a new feature for Amazon Prime to increase retention among members who rarely use it.',hint:['1. Diagnose: why do they rarely use it?','2. Segments: video non-users, shipping infrequent, no music/books use','3. Value gap analysis','4. Feature that creates a habit or adds new value','5. Metrics: feature adoption, renewal rate'],model:'Prime members who rarely use it likely subscribed for shipping but don\'t engage with video, music, or other benefits. Their renewal risk is high.\n\nRoot cause: They don\'t know about or see value in non-shipping benefits.\n\nIdea: "Prime Value Summary" — a monthly personalized email/notification showing how much the member saved (shipping + services), what benefits they haven\'t tried, and a curated "Try this week" recommendation. Example: "You saved $47 in shipping. You haven\'t tried Prime Video — here\'s a show matching your Amazon purchase history: Outdoor cooking shows."\n\nAdditionally: "Prime Benefits Explorer" — an in-app hub that shows all 20+ benefits visually with one-click trials.\n\nMetrics: Feature click-through rate, new benefit adoption rate, 90-day renewal rate for previously low-engagement segment, NPS of targeted segment.'},
{type:'product',company:'amazon',q:'How would you redesign Amazon\'s checkout experience to increase conversion?',hint:['1. Identify checkout drop-off causes (friction points)','2. Map user journey','3. Prioritize highest-impact friction','4. Solutions','5. A/B test plan'],model:'Checkout drop-off causes: (1) Unexpected costs (shipping, tax) revealed late. (2) Too many steps. (3) Payment friction. (4) Uncertainty about delivery date.\n\nAmazon already has 1-click checkout for Prime, but first-time buyers face friction.\n\nHigh-impact improvements: (1) Show total cost including shipping/tax on the cart page, not at final step. (2) Guest checkout with friction-free path (no account creation required). (3) Auto-detect and surface the cheapest + fastest delivery option upfront. (4) Trust signals: real-time delivery date prediction with confidence percentage.\n\nFor Prime members: persistent "Order by 5pm, get it tomorrow" countdown on product pages reduces last-minute checkout abandonment.\n\nMetrics: Checkout completion rate (current industry avg 45-55%, Amazon reportedly ~60%), cart abandonment rate, time-to-purchase, repeat purchase rate.'},
{type:'product',company:'amazon',q:'Design a product to help Amazon expand into the healthcare market.',hint:['1. Healthcare entry points: pharmacy, telehealth, devices, insurance','2. Amazon\'s assets: logistics, AWS, Alexa, Prime base','3. Choose one beachhead market','4. Build vs. buy vs. partner','5. Regulatory considerations'],model:'Amazon has already entered healthcare via Amazon Pharmacy and Amazon Clinic. I\'ll design an expansion into chronic disease management, leveraging existing assets.\n\nBeachhead: Diabetes management (34M Americans, $327B annual cost).\n\nProduct: "Amazon Health Monitor" — an integrated system using a continuous glucose monitor (CGM) + Alexa + Amazon Pharmacy. CGM data flows to an Alexa skill that provides real-time alerts, medication reminders, and automatic pharmacy reorders when supplies run low.\n\nAmazon\'s unfair advantages: (1) Prime same-day delivery for supplies. (2) Alexa ambient computing. (3) AWS cloud for HIPAA-compliant data. (4) Amazon Pharmacy for prescription management.\n\nBuild strategy: Partner with CGM manufacturers (Dexcom/Abbott), build Alexa skill + app in-house, integrate Amazon Pharmacy.\n\nRegulatory: FDA Software as Medical Device classification, HIPAA compliance required. Timeline: 18-24 months to launch.\n\nMetrics: Enrolled users, medication adherence rate, average A1C improvement, NPS, subscription renewal.'},
{type:'product',company:'google',q:'How would you design a product to help people learn a new language faster?',hint:['1. Define "faster" — measurable outcomes','2. User segments: hobbyists vs. necessity learners','3. Current solutions gap (Duolingo, tutors, immersion)','4. Key insight: what accelerates acquisition?','5. Feature set, MVP, metrics'],model:'Learning research shows language acquisition is accelerated by: spaced repetition, real conversational practice, and contextual immersion.\n\nUser persona: Young professional learning Spanish for a career opportunity, 30 min/day available.\n\nCurrent gap: Duolingo is gamified but lacks real conversation practice. Tutors are expensive. Rosetta Stone is too slow.\n\nProduct: "LinguaAI" — a conversational AI tutor powered by Gemini that simulates real-world scenarios. User picks a scenario (job interview in Spanish, ordering food, negotiating a deal). AI plays the other role, responds naturally, and gives real-time feedback on grammar, vocabulary, and pronunciation.\n\nKey differentiators: (1) Personalized scenario library. (2) Pronunciation feedback using speech recognition. (3) Adaptive difficulty. (4) Daily 10-min challenge.\n\nMVP: 5 scenarios for Spanish/French/Mandarin, Android + iOS.\n\nMetrics: User retention at 30 days (target: 40%), self-reported fluency gains, vocabulary recall score.'},
{type:'product',company:'meta',q:'Design a product to help content creators on Facebook monetize their audience.',hint:['1. Creator pain points: discovery, monetization, audience data','2. Monetization models: subscriptions, tips, merch, ads','3. Meta\'s platform advantages','4. Creator vs. audience trade-offs','5. Metrics: creator revenue, platform take-rate, creator retention'],model:'Facebook creators struggle with: low organic reach (algorithm change), unclear monetization paths, and competition from TikTok/YouTube.\n\nFocusing on monetization: I\'d design a "Creator Subscription" product — fans pay $4.99/month for exclusive content, live Q&As, early access, and creator-only community posts.\n\nDifferentiation from Patreon: Integrated in Facebook where audience already exists. No need to drive traffic elsewhere.\n\nKey features: (1) Tiered subscriptions (3 tiers). (2) Exclusive content feed for subscribers. (3) Live subscriber-only video. (4) Subscriber analytics (who is engaging, churn signals). (5) Meta takes 20% (vs. Patreon\'s 8-12%), but provides distribution.\n\nCreator onboarding: Invite top 10K creators, offer 6 months with 0% fee to seed content and subscribers.\n\nMetrics: Creator MRR, subscriber retention, number of creators earning >$1K/month, platform revenue from subscriptions.'},
{type:'product',company:'amazon',q:'Design a feature for Alexa to be more useful for elderly users living alone.',hint:['1. Understand needs: safety, loneliness, medication, cognitive support','2. Current Alexa limitations for elderly','3. Feature prioritization by impact and feasibility','4. Privacy considerations are critical','5. Success metrics'],model:'Elderly users living alone face three primary risks: health emergencies (falls, medical events), social isolation, and medication non-adherence.\n\nCurrent Alexa: Good for music/reminders, but passive — it only responds, doesn\'t proactively check in.\n\nFeature: "Alexa Companion Mode" — proactive daily wellness check. Alexa asks "Good morning, how are you feeling today?" If no response by 10am, it notifies a designated family member. It tracks daily interaction patterns and flags unusual silence.\n\nAdditional features: (1) Fall detection integration (Echo device microphone + accelerometer partnerships). (2) Medication reminders with confirmation ("Did you take your blood pressure pill?"). (3) Daily brain exercises — short 5-min memory games.\n\nPrivacy: All data stays on-device or family-authorized only. Explicit opt-in required. No advertising.\n\nMetrics: Daily engagement rate, family caregiver NPS, medication adherence improvement (survey), emergency detection speed (if partnered with monitoring services).'},
{type:'product',company:'google',q:'You\'re a PM at Google Search. How would you improve search results for medical queries?',hint:['1. Define the problem: accuracy, trust, personalization, speed','2. Current state and failures','3. Solutions: quality signals, authoritative sources, user context','4. AI/ML opportunities','5. Metrics: click-through, YMYL quality signals, return visit rate'],model:'Medical queries are "YMYL" (Your Money or Your Life) — high stakes. Failures include: misinformation ranking high, no personalization, lack of actionable guidance.\n\nImprovements: (1) Elevate authoritative sources (Mayo Clinic, CDC, WebMD) with stronger quality signals and freshness weighting. (2) AI-generated medical summaries (like Google\'s featured snippets but with sourcing from multiple trusted sources and a disclaimer). (3) "Is this serious?" indicator — use NLU to classify query urgency and surface "Call your doctor if…" guidance. (4) Personalization based on location (local hospital finder), past queries, and device (more detailed on desktop).\n\nEthical considerations: Never replace medical advice — clearly label AI summaries as informational. Partner with medical boards to validate content.\n\nMetrics: Medical query satisfaction rate (5-star survey), click-through to authoritative sources, medical return search rate (lower = better, indicates query was resolved), zero-click resolution for common queries.'},
{type:'product',company:'meta',q:'Design a new type of social network for professional collaboration.',hint:['1. Define differentiation vs. LinkedIn','2. Use case: projects vs. status vs. hiring','3. Network effects strategy','4. Monetization','5. Metrics: connection quality, collaboration outcomes'],model:'LinkedIn is strong at career status and recruiting, weak at actual collaboration. GitHub is good for code but narrow. The gap: professional project collaboration across disciplines.\n\nProduct: "Forge" — a collaboration-first social network where the unit is a project, not a profile. Users create or join projects (startup ideas, research papers, hackathons, creative works). The feed shows project updates, not career milestones.\n\nCore features: (1) Project pages with milestones, roles needed, and public progress. (2) Skill-based matching: "You have design skills → 3 projects need a designer." (3) Async project discussion (threaded, not real-time chat). (4) Public portfolio: completed projects become your resume.\n\nNetwork effects: More projects → more users with skills → better matching → more completed projects.\n\nMonetization: Premium for companies to post "Open Projects" (like job postings, but for collaborators). $299/month per posting.\n\nMetrics: Projects completed per user, cross-discipline collaboration rate, returning user rate at 30/60/90 days.'},
{type:'product',company:'amazon',q:'How would you improve Amazon\'s product review system?',hint:['1. Problems: fake reviews, gaming, recency bias, poor discovery','2. Solutions for authenticity','3. Solutions for usefulness','4. Consider all stakeholders','5. Metrics: review authenticity score, purchase satisfaction'],model:'Amazon reviews have three major issues: fake reviews (incentivized), recency bias (old reviews dominate), and review usefulness (too many "Great!" 5-stars with no content).\n\nSolutions: (1) Verified Purchase + AI authenticity scoring — flag reviews with patterns of coordinated posting, unusual reviewer history, or incentive language. Display confidence score. (2) Review structured prompts — after purchase, prompt with specific Qs: "How was the build quality? Does it match the description? Would you buy again?" This generates more useful reviews. (3) Decay weighting — recent reviews weighted more heavily in the star rating. (4) "Top critical review" surface more prominently — many users only read positive reviews. (5) Q&A as review supplement — encourage existing owner Q&A alongside reviews.\n\nPriority: Fake review detection + structured prompts have highest ROI.\n\nMetrics: Review authenticity score (% flagged as fake), purchase satisfaction rate (returns), % reviews with detailed content (>100 words).'},
{type:'product',company:'google',q:'Design a product to help freelancers manage their business finances.',hint:['1. Freelancer pain points: invoicing, taxes, cash flow, time tracking','2. Existing solutions (QuickBooks, Wave, FreshBooks) — gaps','3. Google\'s unfair advantage (Docs, Sheets, Pay, Calendar)','4. Core feature set','5. Monetization, metrics'],model:'Freelancers struggle most with: chasing invoices, quarterly tax estimates, and irregular cash flow anxiety.\n\nGoogle\'s advantage: G Suite integration, Google Pay, Calendar.\n\nProduct: "Google Work" — freelance business hub integrated into Google Workspace.\n\nCore features: (1) Invoice creation from Gmail — detect "how much do I owe?" emails and offer to auto-generate an invoice. (2) Auto-expense categorization from Gmail receipts. (3) Quarterly tax estimate calculator (based on income entered, location). (4) Cash flow forecast: "Based on outstanding invoices, you\'ll receive $3,200 in the next 30 days." (5) Time tracking widget in Google Calendar.\n\nMVP: Invoice + expense tracking integrated in Gmail. Revenue model: Free for 1 client, $9.99/month for unlimited.\n\nMetrics: Invoice creation rate, payment time (days-to-pay target: < 15 days), user retention at 90 days, tax feature usage, MRR growth.'},
{type:'product',company:'meta',q:'You are a PM for VR at Meta. Design a killer use case for Meta Quest that will drive mainstream adoption.',hint:['1. Define mainstream (50M+ users vs. current 20M)','2. Barriers to adoption: price, comfort, content, social acceptability','3. Beachhead use case','4. Network effects in VR','5. Metrics: daily active usage, session length, NPS'],model:'Current VR is dominated by gamers. Mainstream adoption (100M+) requires a use case compelling enough for non-gamers.\n\nHighest potential: Remote work / virtual office. Post-COVID, remote work is permanent for 30% of professionals. The pain: video call fatigue, lack of presence, no "watercooler" moments.\n\nProduct: "Horizon Workrooms 2.0" — a truly immersive virtual office. Key improvements over current: (1) Photorealistic avatars using phone camera scan (reduce uncanny valley). (2) Persistent virtual desk — your virtual workspace remembers your layout. (3) Mixed reality mode: see your real keyboard while in VR. (4) Spatial audio meeting rooms with breakout areas.\n\nNetwork effects: One power user convinces team → team adopts → org adopts.\n\nGo-to-market: Partner with 50 "Future of Work" companies for subsidized Quest distribution.\n\nMetrics: Daily VR session ≥ 2 hours, retention at 30 days (target 40% for work use case), NPS of remote workers vs. video call baseline.'},
{type:'product',company:'amazon',q:'Design a product to help small businesses succeed on Amazon\'s marketplace.',hint:['1. Small biz pain points: discovery, FBA costs, competitor suppression, returns','2. Amazon\'s business model alignment','3. Feature set by priority','4. Monetization: seller tools business model','5. Metrics: seller GMV, churn, NPS'],model:'Small business sellers (< $1M GMV/year) on Amazon face: algorithm opacity, large brand competition, FBA complexity, and high return fraud.\n\nProduct: "Amazon Seller Accelerator" — a premium seller toolkit ($99/month).\n\nFeatures: (1) "Visibility Forecast" — AI prediction of how listing changes (better photos, improved title) will impact ranking. (2) Competitor monitoring — alerts when a competitor changes price or listing. (3) Smart FBA cost optimizer — recommends whether to FBA or FBM for each product based on margin. (4) Return fraud detection — flags suspicious return patterns and provides evidence for appeals. (5) Sponsored Ads AI — auto-adjusts bids based on seasonality and conversion data.\n\nThis serves Amazon\'s interests: healthy seller ecosystem = more product variety = better customer experience.\n\nMetrics: Seller MoM GMV growth (vs. non-Accelerator control group), seller churn rate, NPS, feature adoption rate, revenue from subscription.'},
{type:'product',company:'google',q:'How would you build a better note-taking product using Google\'s AI capabilities?',hint:['1. Note-taking jobs-to-be-done: capture, organize, retrieve, synthesize','2. Current solutions gap (Notion, Obsidian, Google Keep)','3. AI-specific opportunities (summarization, linking, search)','4. Integration with Google ecosystem','5. Metrics: retention, retrieval success rate'],model:'Note-taking breaks down at retrieval — users capture notes they never find again. AI can fundamentally solve this.\n\nProduct: "Google Notes" — AI-powered knowledge base that auto-organizes and surfaces relevant information.\n\nCore AI features: (1) Auto-summarization: Long notes get a 3-sentence TL;DR. (2) Smart linking: When you write "meeting with Sarah," it automatically links to your Google Calendar event and previous notes mentioning Sarah. (3) Conversational retrieval: "What did I decide about the Q3 budget?" → AI finds and surfaces relevant notes. (4) Gmail integration: Key decisions from emails auto-saved as notes with context.\n\nMVP: AI search + auto-summary + Gmail capture. Native in Google Workspace.\n\nDifferentiation from Google Keep: Structured AI layer; differentiation from Notion: Google ecosystem integration + AI retrieval.\n\nMetrics: Daily active users, note retrieval success rate (user finds what they\'re looking for on first search), 30-day retention, NPS vs. Keep/Notion.'},
{type:'product',company:'meta',q:'Design a product that helps teenagers use social media more mindfully.',hint:['1. Define mindful use: intentional, time-aware, positive','2. Teen psychology: social validation, FOMO, identity formation','3. Features: friction, awareness, positive alternatives','4. Regulatory context (COPPA, proposed teen protections)','5. Metrics: session quality, self-reported wellbeing, usage patterns'],model:'Teens struggle with: compulsive checking (average 7-9 hours/day), social comparison anxiety, and FOMO-driven passive consumption.\n\nProduct: "Mindful Mode" — optional mode for teens that layers awareness and intentionality tools on top of Instagram.\n\nFeatures: (1) Session intention prompt — before opening app, ask "Why are you here? (Connect with friends / Get inspired / Explore / Just browsing)." (2) Time awareness nudge — gentle animation at 20 minutes showing "You set a goal of 30 min today — 10 left." (3) Positive scroll indicator — after each scroll, tiny indicator shows the emotional quality of recent content (a "positivity ratio"). (4) Curated "Focus Feed" — shows only posts from close friends, hiding influencer/brand content. (5) Weekly wellbeing check-in (3 Qs).\n\nOpt-in by teen, co-managed with parent through Family Center.\n\nMetrics: Self-reported anxiety reduction (weekly check-in), session intent vs. actual behavior alignment, opt-in rate, churn rate of Mindful Mode users vs. baseline.'},
// ─ ESTIMATION ──────────────────────────────────────────────────────────────
{type:'estimation',company:'google',q:'How many searches does Google process per day?',hint:['1. Start with known anchor (Google has ~90% search market share)','2. World internet users × searches/user/day','3. Cross-check with known public data','4. Sanity check your math','5. State assumptions clearly'],model:'Structured approach:\n\nGlobal internet users: ~5.5B.\nProportion who use search daily: ~70% = 3.85B daily searchers.\nAverage searches per person per day: 3-5 (light users search ~2x, power users ~10x). Use 4 as average.\nTotal searches/day: 3.85B × 4 = ~15.4B searches/day.\n\nGoogle market share: ~90%\nGoogle searches/day: 15.4B × 0.9 ≈ 13.9B ≈ ~14 billion searches/day.\n\nSanity check: Google has publicly stated "trillions of searches per year" ÷ 365 ≈ 5.5-8.5B/day (publicly cited ~8.5B). My estimate is in the right order of magnitude. If off, I\'d revisit: daily search frequency might be lower (~2.5) → 3.85B × 2.5 × 0.9 ≈ 8.7B ✓\n\nFinal answer: ~8-14 billion searches/day.'},
{type:'estimation',company:'meta',q:'Estimate the number of photos uploaded to Instagram every day.',hint:['1. Instagram MAU → DAU','2. Posting behavior (% who post per day, avg photos)','3. Don\'t forget Stories vs. Feed','4. Cross-check with public data','5. State assumptions'],model:'Instagram MAU: ~2B. DAU: ~500M (25% of MAU).\n\nPost behavior: On any given day:\n- % of DAU who post to Feed: ~15% = 75M users\n- Avg photos per feed post: 1.3 (some multi-photo)\n- Feed photos/day: 75M × 1.3 ≈ 100M\n\nStories: ~500M stories/day (Instagram has publicly stated this)\n- Stories are typically 1-5 photos/videos per person\n- ~100M users post Stories daily × 2 photos avg = 200M story photos\n\nReels: Growing — ~50M Reels uploaded/day (estimated)\n\nTotal: 100M (feed) + 200M (stories) + 50M (reels) ≈ 350M content pieces/day.\n\nSanity check: Instagram stated 100M photos/day in 2015. With 2x MAU growth and Stories/Reels, 300-500M seems reasonable.\n\nFinal: ~300-500M photos/videos per day.'},
{type:'estimation',company:'amazon',q:'How many packages does Amazon deliver in a day in the US?',hint:['1. Start with Amazon US revenue','2. Average order value → number of orders','3. Packages per order','4. Delivery share (Amazon Logistics vs. UPS/FedEx)','5. Cross-check'],model:'Amazon US annual revenue: ~$400B (2023), of which ~$350B is product sales (GMV including 3P).\n\nAverage order value: ~$50 (Prime orders skew higher, but many small orders)\nAnnual orders: $350B ÷ $50 = 7B orders/year.\n\nAdjust for multi-item orders (2 items/order on avg, packaged as 1.2 packages): 7B × 1.2 packages = 8.4B packages/year.\n\nAmazon Logistics handles ~67% of US deliveries now (2023 data): 8.4B × 0.67 = 5.6B Amazon-delivered/year.\n\nPer day: 5.6B ÷ 365 = ~15M packages/day (Amazon Logistics only). Total Amazon packages (including UPS/FedEx): ~23M/day.\n\nPublicly cited: Amazon delivers ~2.5B packages/year via its own logistics (2022 figure, lower), scaling up. ~7-8M Amazon-delivered per day more recently.\n\nFinal: 15-20M total Amazon packages delivered per day in the US.'},
{type:'estimation',company:'google',q:'Estimate the market size of the online education industry globally.',hint:['1. TAM: everyone who might learn online','2. Segment by type: K-12, higher ed, corporate, individual upskilling','3. Willingness to pay × addressable audience','4. Cross-check with reported figures','5. State CAGR opportunity'],model:'Segments:\n\n1. K-12 online: 1.5B students globally × 10% online participation × $200/year avg = $30B\n2. Higher Education online: 220M university students × 20% online × $1,500/year = $66B\n3. Corporate training: 3.4B workers × 30% at orgs that use e-learning × $200/year = $204B\n4. Individual upskilling (Coursera, Udemy, etc.): 500M interested adults × 8% paying × $150/year = $6B\n5. Language learning (Duolingo, Babbel): 500M learners × 5% paying × $100/year = $2.5B\n\nTotal TAM: ~$300-400B/year globally.\n\nSanity check: HolonIQ and other analysts cite global EdTech market at $300-400B by 2025. My estimate aligns.\n\nGrowth: CAGR of 12-15% driven by post-COVID normalization of online learning.\n\nFinal: ~$300-400B globally, growing to $500B+ by 2027.'},
{type:'estimation',company:'meta',q:'How many minutes of video are watched on Facebook every day?',hint:['1. Facebook DAU → video watchers','2. % who watch video, minutes per session','3. Growth of Reels vs. traditional video','4. Cross-check with YouTube (public data point)','5. State assumptions'],model:'Facebook DAU: ~2B. % who watch at least one video per day: ~50% = 1B video watchers.\n\nAvg video watch time per day for video watchers:\n- Passive feed scrollers watching short clips: ~5-10 min\n- Dedicated video watchers: ~20 min\n- Weighted average: ~8 minutes per video watcher\n\nTotal: 1B × 8 min = 8B minutes/day.\n\nReels addition: Reels launched heavily in 2022. Facebook Watch. Meta reported "over 3 billion videos watched daily" in 2015. With Reels dominating now, probably 10-15B minutes/day total.\n\nSanity check: YouTube reports 1B hours/day = 60B minutes/day. Facebook is probably 15-25% of YouTube\'s scale.\n60B × 20% = 12B minutes/day — aligns with my estimate.\n\nFinal: ~8-15 billion minutes of video watched on Facebook per day.'},
{type:'estimation',company:'amazon',q:'Estimate how many Alexa devices are active in the US.',hint:['1. Alexa device categories (Echo, Fire TV, 3P)','2. Cumulative sales since 2015 - churn','3. Cross-check household penetration','4. Activity definition','5. State assumptions clearly'],model:'Alexa device types: Echo smart speakers, Echo Show, Fire TV, third-party (Bose, Sonos, etc.), Ring devices.\n\nCumulative sales (2015-2024): Amazon has sold ~150M Echo devices globally (reported ~100M in 2019 + growth). US is ~40% = 60M Echo devices sold in US.\n\nAnnual churn (device replacement/disposal): ~10%/year average age 5 years: multiply by retention factor 0.65 ≈ 39M still active.\n\nFire TV with Alexa: ~50M Fire TV sticks in US × 70% active = 35M.\n3P devices: ~5M active.\n\nTotal: 39M + 35M + 5M = ~79M active Alexa devices in US.\n\n"Active" (used at least once in last 30 days): ~60-70% of owned devices. So 79M × 65% = ~52M actively used monthly.\n\nHousehold penetration check: 130M US households × 40% Alexa penetration (survey data) = 52M households with Alexa. Aligns!\n\nFinal: ~50-55M actively used Alexa devices in the US.'},
{type:'estimation',company:'google',q:'How many Gmail accounts are there worldwide?',hint:['1. Google total MAU → Gmail share','2. Multiple accounts per user','3. Inactive vs. active accounts','4. B2B (Workspace) accounts','5. Cross-check'],model:'Known anchor: Google reported 1.8B Gmail users in 2018. Conservative 2024 estimate with growth: ~2B active Gmail accounts.\n\nBreakdown:\n- Personal accounts: ~1.7B\n- Google Workspace (business): ~9M businesses × 10 employees avg = ~90M business accounts\n- Total accounts (including inactive): probably 3-4B (many people have multiple, abandoned accounts)\n\n"Active" (logged in last 30 days): ~2B.\n\nCross-check: Android has 3B+ active devices. Most Android devices require a Google account. Gmail is tightly coupled → at least 3B accounts exist. Active users likely 2B.\n\nFinal answer: ~2 billion active Gmail accounts worldwide. 3-4 billion total accounts including inactive.'},
{type:'estimation',company:'meta',q:'Estimate the revenue Facebook generates per user per year in the US.',hint:['1. Facebook US revenue / US MAU','2. Cross-check with Meta\'s disclosed ARPU by region','3. Understand the revenue model (ads = 97%)','4. How does this inform product decisions?','5. State implications'],model:'Meta disclosed ARPU (Average Revenue Per User) by region in earnings reports:\n\nUS & Canada ARPU: ~$200/year (Q4 historically higher). ~$50/quarter × 4 = $200/year.\n\nLet me verify with bottom-up:\nFacebook US DAU: ~180M. MAU: ~250M.\n\nMeta total revenue ~$134B (2023). US represents ~45% = ~$60B.\n\nUS MAU: ~250M.\nRevenue per US MAU: $60B ÷ 250M = $240/year.\n\nReasonable — Meta disclosed ~$226 ARPU for US/Canada in 2023.\n\nImplication for PM: Each active US user generates ~$200-240/year. Losing 1M DAU in the US = $200M annual revenue loss. This is why engagement metrics are closely tied to revenue targets.\n\nAlso: Daily active time × ad impressions × CPM drives revenue, not just user count.'},
{type:'estimation',company:'amazon',q:'How many Prime members does Amazon have globally?',hint:['1. US subscribers (known public data ~170M)','2. International: UK, Germany, Japan, India are largest','3. Cross-check: Prime revenue / subscription price','4. Active vs. lapsed members','5. Implications for product strategy'],model:'Known: Amazon disclosed ~200M Prime members globally in 2021. With growth, 2024 estimate: ~230M.\n\nBreakdown:\n- US: ~170M (known, ~50% of US households)\n- UK: ~15M (25% of UK households)\n- Germany: ~12M\n- Japan: ~10M\n- India: ~10M (lower price point)\n- Other international: ~13M\nTotal: ~230M\n\nRevenue cross-check: Amazon Prime subscription revenue ~$40B/year (disclosed). At $139/year (US) and lower international rates ($50 avg internationally): 170M × $139 + 60M × $50 = $23.6B + $3B = $26.6B. Underestimates because Prime includes ads business now.\n\nFinal: ~220-230M Prime members globally (2024 estimate).\n\nProduct implication: Prime members spend ~4x more than non-Prime on Amazon. Retention of each Prime member worth ~$400-500/year in incremental purchases.'},
{type:'estimation',company:'google',q:'Estimate the total storage used by Google Photos worldwide.',hint:['1. Google Photos MAU','2. Average photos per user','3. Average file size','4. Storage efficiency (compression)','5. Cross-check with Google\'s data center scale'],model:'Google Photos MAU: ~1.5B (reported).\nAvg photos stored per user: 2,000-5,000 photos (many have 10K+; casual users have 500). Use 3,000 avg.\nTotal photos: 1.5B × 3,000 = 4.5 trillion photos.\n\nAverage compressed photo size: Google applies compression. "Storage saver" quality: ~3MB compressed per photo. 4K video varies widely — let\'s focus on photos.\n\n4.5T × 3MB = 13.5 Exabytes just for photos.\n\nVideo: ~20% of users back up video, avg 10 videos of 50MB each = 10 × 50MB × 0.2 × 1.5B = 1.5 Exabytes.\n\nTotal: ~15 Exabytes.\n\nSanity check: Google said in 2020 they had "4 trillion photos" stored. At 3MB each → 12 Exabytes. My estimate aligns.\n\nFinal: ~15 Exabytes (15 million Terabytes) of storage used by Google Photos globally.'},
// ─ STRATEGY ────────────────────────────────────────────────────────────────
{type:'strategy',company:'google',q:'Google Search is losing market share to AI chatbots like ChatGPT. What should Google do?',hint:['1. Understand the threat: query types at risk','2. Google\'s advantages (data, distribution, brand, Gemini)','3. Strategic options: compete, differentiate, acquire, partner','4. Trade-offs and risks','5. Recommendation with rationale'],model:'Threat analysis: AI chatbots threaten informational and conversational queries (35% of Google search volume). Not yet threatening navigational, commercial, or local queries.\n\nGoogle\'s assets: 1) Gemini (competitive LLM). 2) Unmatched real-time web index. 3) Distribution (Android, Chrome, default on iOS). 4) Ad ecosystem. 5) Trust in factual information.\n\nStrategic options:\n(A) Integrate AI into Search (Google is doing this with AI Overviews) — defend core.\n(B) Position Gemini as a differentiated product — AI with real-time web access + cite sources → trust advantage.\n(C) Expand distribution — Gemini as default AI assistant on Chrome/Android.\n(D) Maintain search quality + ad revenue for non-AI queries.\n\nRecommendation: Dual-track strategy. Aggressively deploy AI Overviews on Search to defend core query volume. Simultaneously, invest in Gemini as a premium AI product differentiated by verified, real-time information. The risk: cannibalizing high-value ad clicks with zero-click AI answers. Mitigate by monetizing AI responses with sponsored sources/tools.'},
{type:'strategy',company:'meta',q:'TikTok is dominating short-form video. How should Meta respond?',hint:['1. TikTok\'s advantages: algorithm, content creation ease, younger demographic','2. Meta\'s advantages: network graph, monetization, Instagram/WhatsApp/FB reach','3. Options: copy, differentiate, acquire','4. Historical precedent (Stories response)','5. Prioritization framework'],model:'Meta has already launched Reels, which is the right directional response. The question is: what more should Meta do?\n\nTikTok advantages: Superior discovery algorithm, authentic/unpolished content culture, Gen Z identity.\nMeta advantages: Social graph (see Reels from friends), better monetization for creators, multi-platform distribution (Instagram + Facebook + WhatsApp).\n\nStrategic options:\n(A) Optimize Reels algorithm — close the discovery gap with more investment in ML. Already doing.\n(B) Differentiate: Lean into social graph — TikTok is about strangers; Reels from people you know. Unique positioning.\n(C) Creator monetization superiority — pay creators more, attract top talent away from TikTok.\n(D) WhatsApp Shorts — bring short video to WhatsApp\'s 2B users in markets where TikTok is weaker.\n\nRecommendation: Reels + social graph differentiation + creator payout superiority. Meta should not try to beat TikTok at its own game (discovery of strangers) but win at "social video" — content from friends and creators you follow. Creator payouts of $1B/year attracts top talent.'},
{type:'strategy',company:'amazon',q:'Should Amazon enter the smartphone market again?',hint:['1. Fire Phone failure analysis (2014)','2. Changed market conditions since then','3. Amazon\'s current mobile position (apps, hardware)','4. Strategic rationale for and against','5. Recommendation with explicit trade-offs'],model:'Fire Phone failed because: (1) No differentiation — Android phone without Google Play was crippled. (2) Overpriced for limited feature set. (3) No developer ecosystem. (4) Launched too late — Android/iOS had locked in network effects.\n\nHas anything changed?\n- Android/iOS duopoly even stronger. Switching costs are higher.\n- Amazon still lacks a mobile OS story.\n- However: Amazon has more hardware expertise (Alexa, Kindle, Ring, Echo Show).\n\nStrategic rationale FOR: Mobile is the largest surface for Amazon shopping. If Amazon controlled the device, it could prioritize Amazon services. Also: Privacy from Apple/Google data collection on Amazon user behavior.\n\nAgainst: $5-10B investment. Developer ecosystem impossible to rebuild. No path to differentiation. Better to invest in Alexa as a cross-platform AI assistant.\n\nRecommendation: No. Amazon should not re-enter smartphones. Instead, invest in (1) Alexa on iOS/Android — be the assistant layer. (2) Amazon Shopping as the best mobile commerce experience. (3) Fire HD tablets continue as budget entry point for families. (4) Partner with Android OEMs for Fire OS customizations in emerging markets.'},
{type:'strategy',company:'google',q:'YouTube is facing increasing competition from streaming services (Netflix, Disney+). How should YouTube respond?',hint:['1. Differentiation: UGC vs. premium; ad-supported vs. subscription','2. Competitive moats: creator ecosystem, live streaming, search','3. YouTube Premium opportunity','4. International growth angle','5. Metrics to defend'],model:'YouTube\'s position is fundamentally different from Netflix/Disney+:\n- YouTube: UGC/professional, free with ads, 2B+ MAU, Google search integration\n- Netflix/Disney+: Premium scripted, subscription-only, ~250M subs combined\n\nThey don\'t fully compete for the same hours — Netflix is "appointment watching," YouTube is "discovery and rabbit holes."\n\nWhere they do compete: evening entertainment time. YouTube Premium (ad-free, offline) is the battleground with subscription streaming.\n\nStrategic priorities: (1) Defend creator ecosystem — creators are the content moat. Creator monetization improvements keep supply strong. (2) YouTube Premium bundled with Google One / Workspace (already happening). (3) YouTube TV for live sports/news — unique vs. Netflix. (4) YouTube Shorts to capture mobile browsing time back from TikTok. (5) Original content selectively for marquee events (NFL Sunday Ticket).\n\nRecommendation: Don\'t try to be Netflix. Be the world\'s largest open content platform, win on variety and creator ecosystem, and use YouTube Premium as a conversion funnel from free users.'},
{type:'strategy',company:'meta',q:'How should Meta approach the regulatory risk of potential forced divestiture of Instagram?',hint:['1. Understand the regulatory risk (FTC antitrust case)','2. What makes Instagram valuable and why regulators want it divested','3. How Meta can reduce regulatory risk','4. Contingency planning if divestiture is ordered','5. Strategic implications for product decisions'],model:'The FTC argues Meta\'s acquisition of Instagram (2012) and WhatsApp (2014) was anticompetitive. A forced divestiture is possible but unlikely near-term — appeals could take years.\n\nMeta\'s strategic response should be multi-track:\n\nTrack 1 — Reduce regulatory risk: (1) Interoperability — allow cross-platform messaging with Signal/Telegram (EU DMA already requiring this). Makes Meta seem less like a walled garden. (2) Consumer choice features — tools that let users easily export data, disable algorithmic feed. (3) Political engagement — demonstrate economic contribution (5M businesses on Instagram, creator economy).\n\nTrack 2 — Prepare for divestiture contingency: Loosely couple Instagram from Facebook infrastructure — this reduces integration merger arguments and creates optionality. Ensure Instagram can operate independently.\n\nTrack 3 — New platform growth: Invest in Threads and other new properties so Meta\'s portfolio is not dependent on Instagram. Reduce antitrust negotiating leverage by showing innovation continues.\n\nProduct implications: Features that deeply integrate FB and Instagram (cross-posting, shared accounts) may need to be positioned carefully to avoid strengthening the antitrust argument.'},
{type:'strategy',company:'amazon',q:'Amazon Web Services is facing competition from Azure and Google Cloud. What should AWS prioritize?',hint:['1. Market position: AWS still #1 but losing share','2. Where is share being lost and why?','3. AWS strengths to double down on','4. Strategic priorities','5. Enterprise vs. startup strategy'],model:'AWS market share: ~31% (2023), Azure ~24%, GCP ~11%. AWS still leads but Azure grew fastest in 2023 due to Microsoft\'s enterprise relationships.\n\nWhere AWS is losing: Enterprise accounts with existing Microsoft 365/Azure AD relationships are defaulting to Azure. Google is winning ML/AI workloads.\n\nAWS strategic priorities:\n\n(1) AI/ML leadership: AWS must respond to Azure\'s OpenAI partnership. Bedrock (multi-model AI API) + Trainium/Inferentia chips position AWS for AI workloads. Priority: make Bedrock the easiest enterprise AI platform.\n\n(2) Enterprise relationships: AWS Partner Network — deeper integration with SIs (Accenture, Deloitte) who drive enterprise deals. AWS Activate for startups maintains future enterprise pipeline.\n\n(3) Price competitiveness: AWS is often 10-15% more expensive than competitors for commodity compute. Commit-based pricing (Savings Plans) helps but more aggressive pricing for workloads at risk of churn.\n\n(4) Vertical SaaS: AWS HealthLake, AWS for Automotive — verticalize cloud services where commoditization is greatest.\n\n(5) International: India and Southeast Asia are high-growth markets where AWS has strong position. Invest in local regions and compliance certifications.'},
{type:'strategy',company:'google',q:'How would you decide whether Google should build, buy, or partner for its AI assistant strategy?',hint:['1. Framework: build vs. buy vs. partner matrix','2. Strategic importance of AI control','3. Cost-benefit for each option','4. Time to market','5. Historical precedents (Google acquisitions)'],model:'Build vs. Buy vs. Partner analysis for Google AI assistant (Gemini):\n\nBuild (Gemini/DeepMind): \n+ Full control over architecture, data, pricing\n+ Aligned with Google\'s core competency\n+ No acquisition premium\n− Slow, requires talent and infrastructure\n− Already behind OpenAI on LLM capabilities at critical moment\n\nBuy (acquire a leading AI company):\n+ Fast time to market\n+ Acquire talent and IP\n− Extremely expensive ($10B+ for any meaningful AI company)\n− Regulatory scrutiny post-Fitbit/Wiz deal failures\n− Culture integration risk\n\nPartner (e.g., OpenAI deal like Microsoft did):\n+ Fastest to market\n+ Shared risk\n− Loss of strategic control, creates dependency\n− Microsoft precedent shows it works well for the partner acquirer\n\nRecommendation: Google should primarily Build — Gemini is genuinely competitive now, and Google has unique data assets (Search, Gmail, YouTube) that no acquisition can replicate. Selectively Partner for specific modalities (e.g., voice synthesis specialists). Avoid large AI acquisitions given regulatory environment. Google\'s Build option is stronger than most companies because of data moats.'},
{type:'strategy',company:'amazon',q:'Should Amazon acquire TikTok if it becomes available due to US regulatory pressure?',hint:['1. Why is TikTok for sale? (CFIUS/national security)','2. Amazon\'s strategic rationale','3. Financial analysis','4. Integration challenges','5. Regulatory considerations for Amazon'],model:'TikTok acquisition context: US Congress passed law requiring ByteDance to divest TikTok. Estimated value: $50-200B.\n\nAmazon\'s strategic rationale:\n(1) Video advertising market: TikTok\'s ad revenue ($20B+) complements Amazon\'s advertising business.\n(2) Social commerce: TikTok Shop is Amazon\'s fastest-growing competitive threat. Owning it eliminates the threat.\n(3) Prime Video + TikTok creators: Content synergies.\n(4) Gen Z reach: Amazon\'s demographic skews older; TikTok\'s Gen Z audience is valuable.\n\nFinancial analysis: At $100B acquisition price, TikTok\'s $20B revenue implies 5x revenue multiple. Amazon could plausibly integrate into advertising business (Amazon Ads is $47B) and grow to $30B in 3 years. IRR on $100B investment is marginal — requires aggressive synergy assumptions.\n\nChallenges: (1) CFIUS would still need to approve, even with US buyer — algorithm concerns. (2) ByteDance might retain the algorithm. (3) TikTok creator community is independent-minded, may revolt under Amazon ownership. (4) Amazon\'s other regulatory issues make a $100B+ acquisition politically difficult.\n\nRecommendation: Pursue only if algorithm rights are included and price is < $50B. Otherwise, invest $5B in Amazon creator video and Inspire (Amazon\'s TikTok clone).'},
{type:'strategy',company:'meta',q:'Meta is struggling to attract younger users (Gen Z). What is your 3-year strategy?',hint:['1. Diagnose: why is Gen Z leaving Facebook? What do they want?','2. Current products: Instagram is ok, Facebook is aging','3. Strategic assets: WhatsApp in some markets, Reels','4. Build vs. acquire for Gen Z','5. Metrics for success'],model:'Root cause: Gen Z (born 1997-2012) never adopted Facebook and is moving away from Instagram toward TikTok and BeReal. Reasons: (1) Facebook feels like their parents\' network. (2) Instagram promotes curated perfection = anxiety. (3) TikTok\'s algorithm is superior for discovery.\n\n3-Year Strategy:\n\nYear 1 — Reels & Authenticity:\n- Reels algorithm investment to close gap with TikTok\n- Launch BeReal-like "Candid Stories" feature on Instagram — push authenticity\n- Instagram "Teen Mode" with reduced social comparison features (reduces anxiety concern)\n- Double down on creator payouts to attract Gen Z creators back\n\nYear 2 — New Platform:\n- Threads: invest heavily. It has the right positioning (text-first, less polished) for Gen Z discourse\n- Launch a gaming-social hybrid: Game-native social features in partnership with Roblox/Fortnite-style platforms where Gen Z spends time\n\nYear 3 — Hardware:\n- Meta Quest as Gen Z platform for social VR experiences (Horizon Worlds 2.0 targeted at 16-25)\n- AR glasses (Orion) as the Gen Z status symbol device if pricing allows\n\nSuccess metrics: 18-24 DAU growth rate, Instagram story creation rate among under-25, Threads MAU growth.'},
