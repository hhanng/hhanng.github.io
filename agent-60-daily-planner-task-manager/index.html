<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent #60 — Daily Planner & Task Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card2: #1f2334;
      --border: #2a2d3e;
      --blue: #4f8ef7;
      --blue-dim: rgba(79, 142, 247, 0.12);
      --green: #4ade80;
      --green-dim: rgba(74, 222, 128, 0.12);
      --red: #f87171;
      --red-dim: rgba(248, 113, 113, 0.12);
      --yellow: #fbbf24;
      --yellow-dim: rgba(251, 191, 36, 0.12);
      --purple: #a855f7;
      --purple-dim: rgba(168, 85, 247, 0.12);
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --radius: 12px;
      --tr: 0.18s ease;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── HEADER ───────────────────────────────────── */
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-brand { display: flex; align-items: center; gap: 0.75rem; }
    .header-icon { font-size: 1.3rem; }
    .header-title { font-size: 1rem; font-weight: 700; }
    .header-sub { font-size: 0.7rem; color: var(--text-muted); }

    .tag {
      background: var(--blue-dim);
      color: var(--blue);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      border: 1px solid rgba(79, 142, 247, 0.35);
      letter-spacing: 0.03em;
    }

    /* ── TABS ─────────────────────────────────────── */
    .tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      gap: 0.1rem;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 0.7rem 1.1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--tr);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

    /* ── LAYOUT ───────────────────────────────────── */
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 3rem;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── CARDS ────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      margin-bottom: 0.9rem;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
    }

    /* ── FORMS ────────────────────────────────────── */
    .form-row {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
      min-width: 100px;
    }

    .form-group label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="date"],
    select {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.55rem 0.75rem;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
      transition: var(--tr);
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-dim);
    }

    input::placeholder { color: var(--text-muted); }
    select option { background: #1a1d27; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
      cursor: pointer;
      height: 4px;
    }

    /* ── BUTTONS ──────────────────────────────────── */
    .btn {
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      border: none;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--tr);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.3rem 0.45rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: var(--tr);
      line-height: 1;
    }
    .icon-btn:hover { color: var(--red); background: var(--red-dim); }

    /* ── TODAY TAB ────────────────────────────────── */
    .date-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .date-header h2 { font-size: 1.3rem; font-weight: 700; }

    .day-chips { display: flex; gap: 0.65rem; }

    .chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem 0.85rem;
      text-align: center;
      min-width: 54px;
    }

    .chip-num { font-size: 1.1rem; font-weight: 800; color: var(--blue); line-height: 1; }
    .chip-lbl { font-size: 0.62rem; color: var(--text-muted); display: block; margin-top: 1px; }

    /* Filter pills */
    .filter-row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.85rem;
    }

    .filter-pill {
      padding: 0.28rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--tr);
    }

    .filter-pill:hover { color: var(--text); border-color: var(--text-dim); }
    .filter-pill.active { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); font-weight: 600; }

    /* Task list */
    .task-list { display: flex; flex-direction: column; gap: 0.45rem; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      transition: var(--tr);
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    .task-item:hover { border-color: #35394f; }
    .task-item.done { opacity: 0.45; }
    .task-item.done .task-title { text-decoration: line-through; }

    .task-circle {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      transition: var(--tr);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
    }

    .task-circle:hover { border-color: var(--green); }
    .task-circle.checked { background: var(--green); border-color: var(--green); color: #052e16; }

    .task-title { flex: 1; font-size: 0.855rem; word-break: break-word; }

    .task-tags { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }

    .badge {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 0.18rem 0.48rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-high   { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(248,113,113,.3); }
    .badge-medium { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(251,191,36,.3);  }
    .badge-low    { background: var(--green-dim);  color: var(--green);  border: 1px solid rgba(74,222,128,.3);  }
    .badge-cat    { background: var(--blue-dim);   color: var(--blue);   border: 1px solid rgba(79,142,247,.25); }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .empty-icon { font-size: 2.2rem; margin-bottom: 0.6rem; }

    /* ── WEEK TAB ─────────────────────────────────── */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }

    @media (max-width: 600px) {
      .week-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .week-cell {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.4rem 0.55rem;
      text-align: center;
      cursor: pointer;
      transition: var(--tr);
      min-height: 115px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .week-cell:hover { border-color: var(--blue); }
    .week-cell.is-today { border-color: var(--blue); background: var(--blue-dim); }
    .week-cell.is-selected { border-color: var(--green); background: var(--green-dim); }

    .wc-name { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.2rem; letter-spacing: 0.04em; }
    .wc-num  { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.35rem; }
    .week-cell.is-today .wc-num { color: var(--blue); }
    .wc-count { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 0.4rem; }

    .wc-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: auto; }
    .wc-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s ease; }
    .wc-pct { font-size: 0.6rem; color: var(--green); font-weight: 700; margin-top: 0.2rem; }

    .day-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      margin-top: 0.9rem;
    }

    .day-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .day-panel-header h3 { font-size: 0.95rem; font-weight: 700; }

    /* ── GOALS TAB ────────────────────────────────── */
    .goals-list { display: flex; flex-direction: column; gap: 0.7rem; }

    .goal-item {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.95rem 1.1rem;
      transition: var(--tr);
      animation: fadeIn 0.15s ease;
    }

    .goal-item.done { opacity: 0.45; }

    .goal-row {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      margin-bottom: 0.75rem;
    }

    .goal-square {
      width: 19px;
      height: 19px;
      border: 2px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      font-weight: 700;
      transition: var(--tr);
      margin-top: 2px;
    }

    .goal-square:hover { border-color: var(--green); }
    .goal-square.checked { background: var(--green); border-color: var(--green); color: #052e16; }

    .goal-body { flex: 1; }
    .goal-name { font-size: 0.88rem; font-weight: 600; margin-bottom: 0.3rem; }
    .goal-item.done .goal-name { text-decoration: line-through; }

    .goal-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }

    .badge-weekly  { background: var(--blue-dim);   color: var(--blue);   border: 1px solid rgba(79,142,247,.3);  font-size: 0.62rem; font-weight: 700; padding: 0.15rem 0.48rem; border-radius: 999px; text-transform: uppercase; }
    .badge-monthly { background: var(--purple-dim); color: var(--purple); border: 1px solid rgba(168,85,247,.3);  font-size: 0.62rem; font-weight: 700; padding: 0.15rem 0.48rem; border-radius: 999px; text-transform: uppercase; }
    .badge-deadline { font-size: 0.65rem; color: var(--text-muted); }

    .goal-progress-row { display: flex; align-items: center; gap: 0.75rem; }
    .goal-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .goal-fill { height: 100%; border-radius: 3px; transition: width 0.25s ease, background 0.25s ease; }
    .goal-pct { font-size: 0.75rem; font-weight: 700; min-width: 34px; text-align: right; }

    /* ── STATS TAB ────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .stat-box {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1rem;
      text-align: center;
    }

    .stat-big { font-size: 2.4rem; font-weight: 800; line-height: 1; margin-bottom: 0.3rem; }
    .stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-sub { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.2rem; }

    .best-day-box {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
    }

    .best-day-name { font-size: 1.4rem; font-weight: 800; color: var(--blue); }
    .best-day-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }

    /* Chart */
    .chart-wrap {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .chart-label-row { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.9rem; }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      height: 90px;
    }

    .chart-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      gap: 0.25rem;
    }

    .chart-bar {
      width: 100%;
      background: var(--blue);
      border-radius: 4px 4px 0 0;
      min-height: 3px;
      transition: height 0.35s ease;
    }

    .chart-bar.today { background: var(--green); }

    .chart-day-labels {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .chart-day-lbl {
      flex: 1;
      text-align: center;
      font-size: 0.62rem;
      color: var(--text-muted);
    }

    .chart-day-lbl.today { color: var(--green); font-weight: 700; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Responsive */
    @media (max-width: 480px) {
      .form-row { flex-direction: column; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .content { padding: 1rem 0.85rem 3rem; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-brand">
    <span class="header-icon">📋</span>
    <div>
      <div class="header-title">Daily Planner</div>
      <div class="header-sub">Task Manager &amp; Goal Tracker</div>
    </div>
  </div>
  <span class="tag">TT #60</span>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" data-tab="today">☀️ Today</button>
  <button class="tab-btn" data-tab="week">📅 Week</button>
  <button class="tab-btn" data-tab="goals">🎯 Goals</button>
  <button class="tab-btn" data-tab="stats">📊 Stats</button>
</div>

<div class="content">

  <!-- ══ TODAY ══════════════════════════════════════════════ -->
  <div class="tab-panel active" id="tab-today">

    <div class="date-header">
      <h2 id="today-heading"></h2>
      <div class="day-chips">
        <div class="chip">
          <div class="chip-num" id="chip-done">0</div>
          <span class="chip-lbl">Done</span>
        </div>
        <div class="chip">
          <div class="chip-num" id="chip-total">0</div>
          <span class="chip-lbl">Total</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Add Task</div>
      <div class="form-row" style="margin-bottom:0.55rem">
        <div class="form-group" style="flex:1; min-width:200px">
          <label>Title</label>
          <input type="text" id="t-title" placeholder="What needs to be done?" />
        </div>
        <button class="btn btn-primary" id="t-add-btn" style="align-self:flex-end">+ Add</button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Priority</label>
          <select id="t-priority">
            <option value="medium">⚡ Medium</option>
            <option value="high">🔴 High</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="t-cat" placeholder="Work, Study…" />
        </div>
      </div>
    </div>

    <div class="filter-row" id="filter-row"></div>

    <div class="task-list" id="today-list"></div>
  </div>

  <!-- ══ WEEK ═══════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-week">
    <div class="card">
      <div class="section-label">Weekly Overview — <span id="week-range"></span></div>
      <div class="week-grid" id="week-grid"></div>
    </div>

    <div class="day-panel" id="day-panel" style="display:none">
      <div class="day-panel-header">
        <h3 id="day-panel-title"></h3>
        <button class="btn btn-ghost" id="day-panel-close" style="font-size:0.75rem; padding:0.3rem 0.7rem">✕ Close</button>
      </div>
      <div class="form-row" style="margin-bottom:0.85rem">
        <div class="form-group" style="flex:3; min-width:140px">
          <input type="text" id="wt-title" placeholder="Add task for this day…" />
        </div>
        <div class="form-group">
          <select id="wt-priority">
            <option value="medium">⚡ Medium</option>
            <option value="high">🔴 High</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
        <button class="btn btn-primary" id="wt-add-btn">+ Add</button>
      </div>
      <div class="task-list" id="day-task-list"></div>
    </div>
  </div>

  <!-- ══ GOALS ══════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-goals">
    <div class="card">
      <div class="section-label">Add Goal</div>
      <div class="form-row">
        <div class="form-group" style="flex:3; min-width:160px">
          <label>Goal</label>
          <input type="text" id="g-title" placeholder="What do you want to achieve?" />
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="g-type">
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        <div class="form-group">
          <label>Deadline</label>
          <input type="date" id="g-deadline" />
        </div>
        <button class="btn btn-primary" id="g-add-btn">+ Add</button>
      </div>
    </div>

    <div class="goals-list" id="goals-list"></div>
  </div>

  <!-- ══ STATS ══════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-stats">
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-big" id="s-today" style="color:var(--green)">0</div>
        <div class="stat-lbl">Completed Today</div>
      </div>
      <div class="stat-box">
        <div class="stat-big" id="s-week" style="color:var(--blue)">0</div>
        <div class="stat-lbl">This Week</div>
        <div class="stat-sub" id="s-week-sub"></div>
      </div>
      <div class="stat-box">
        <div class="stat-big" id="s-rate" style="color:var(--yellow)">0%</div>
        <div class="stat-lbl">Completion Rate</div>
        <div class="stat-sub">All time</div>
      </div>
      <div class="stat-box">
        <div class="stat-big" id="s-streak" style="color:var(--red)">0</div>
        <div class="stat-lbl">Day Streak 🔥</div>
        <div class="stat-sub" id="s-streak-sub"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:0.75rem">
      <div class="section-label">Most Productive Day</div>
      <div id="s-best-day" class="best-day-name">—</div>
      <div id="s-best-day-sub" class="best-day-sub"></div>
    </div>

    <div class="chart-wrap">
      <div class="chart-label-row">Tasks Completed — This Week</div>
      <div class="chart-bars" id="chart-bars"></div>
      <div class="chart-day-labels" id="chart-day-labels"></div>
    </div>
  </div>

</div><!-- /content -->

<script>
// ──────────────────────────────────────────────────────────────
// STORAGE
// ──────────────────────────────────────────────────────────────
const KEYS = { tasks: 'planner60_tasks', goals: 'planner60_goals' };

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; }
  catch { return []; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

const getTasks = () => load(KEYS.tasks);
const setTasks = v => save(KEYS.tasks, v);
const getGoals = () => load(KEYS.goals);
const setGoals = v => save(KEYS.goals, v);

// ──────────────────────────────────────────────────────────────
// UTILS
// ──────────────────────────────────────────────────────────────
const uid = () => Date.now() + '_' + Math.random().toString(36).slice(2, 7);
const toDS = d => d.toISOString().split('T')[0];
const todayDS = () => toDS(new Date());

function weekDays(ref) {
  const d = new Date(ref);
  d.setHours(0, 0, 0, 0);
  const dow = d.getDay();
  const diff = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  return Array.from({ length: 7 }, (_, i) => {
    const nd = new Date(d); nd.setDate(d.getDate() + i); return nd;
  });
}

function fmtFull(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function fmtShort(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function progressColor(p) {
  if (p >= 100) return 'var(--green)';
  if (p > 60)   return 'var(--blue)';
  if (p > 30)   return 'var(--yellow)';
  return 'var(--red)';
}

// ──────────────────────────────────────────────────────────────
// TABS
// ──────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'week')  renderWeek();
    if (tab === 'stats') renderStats();
  });
});

// ──────────────────────────────────────────────────────────────
// TODAY TAB
// ──────────────────────────────────────────────────────────────
let activeFilter = 'all';

function initToday() {
  document.getElementById('today-heading').textContent = fmtFull(new Date());
  buildFilters();
  renderToday();
}

const FILTERS = [
  { id: 'all',       label: 'All' },
  { id: 'active',    label: 'Active' },
  { id: 'done',      label: 'Completed' },
  { id: 'high',      label: '🔴 High' },
  { id: 'medium',    label: '⚡ Medium' },
  { id: 'low',       label: '🟢 Low' },
];

function buildFilters() {
  document.getElementById('filter-row').innerHTML = FILTERS.map(f =>
    `<button class="filter-pill${f.id === activeFilter ? ' active' : ''}" data-f="${f.id}">${f.label}</button>`
  ).join('');
  document.getElementById('filter-row').addEventListener('click', e => {
    const btn = e.target.closest('[data-f]'); if (!btn) return;
    activeFilter = btn.dataset.f;
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.toggle('active', b.dataset.f === activeFilter));
    renderToday();
  });
}

function renderToday() {
  const tasks = getTasks();
  const today = todayDS();
  let dayTasks = tasks.filter(t => t.date === today);
  const done  = dayTasks.filter(t => t.completed).length;
  document.getElementById('chip-done').textContent  = done;
  document.getElementById('chip-total').textContent = dayTasks.length;

  if (activeFilter === 'active')   dayTasks = dayTasks.filter(t => !t.completed);
  else if (activeFilter === 'done') dayTasks = dayTasks.filter(t => t.completed);
  else if (['high','medium','low'].includes(activeFilter))
    dayTasks = dayTasks.filter(t => t.priority === activeFilter);

  const pOrd = { high: 0, medium: 1, low: 2 };
  dayTasks.sort((a, b) => (a.completed - b.completed) || (pOrd[a.priority] - pOrd[b.priority]));

  const el = document.getElementById('today-list');
  el.innerHTML = dayTasks.length
    ? dayTasks.map(t => taskHTML(t)).join('')
    : `<div class="empty-state"><div class="empty-icon">✅</div>${activeFilter === 'all' ? 'No tasks yet — add one above!' : 'Nothing matches this filter.'}</div>`;
}

function taskHTML(t) {
  return `
    <div class="task-item${t.completed ? ' done' : ''}" id="ti-${t.id}">
      <div class="task-circle${t.completed ? ' checked' : ''}" data-toggle="${t.id}">${t.completed ? '✓' : ''}</div>
      <span class="task-title">${esc(t.title)}</span>
      <div class="task-tags">
        <span class="badge badge-${t.priority}">${t.priority}</span>
        ${t.category ? `<span class="badge badge-cat">${esc(t.category)}</span>` : ''}
        <button class="icon-btn" data-del="${t.id}" title="Delete">✕</button>
      </div>
    </div>`;
}

// delegated events for task list (both today and week day panel)
function bindTaskListEvents(containerEl, reRenderFn) {
  containerEl.addEventListener('click', e => {
    const toggleId = e.target.closest('[data-toggle]')?.dataset.toggle;
    const delId    = e.target.closest('[data-del]')?.dataset.del;
    if (toggleId) {
      const tasks = getTasks(); const t = tasks.find(x => x.id === toggleId);
      if (t) t.completed = !t.completed;
      setTasks(tasks); reRenderFn();
    }
    if (delId) {
      setTasks(getTasks().filter(x => x.id !== delId)); reRenderFn();
    }
  });
}

bindTaskListEvents(document.getElementById('today-list'), () => { renderToday(); });

// add task
function addTask(dateStr) {
  const titleEl = document.getElementById('t-title');
  const title   = titleEl.value.trim();
  if (!title) { titleEl.focus(); return; }
  const tasks = getTasks();
  tasks.push({
    id: uid(), title,
    priority: document.getElementById('t-priority').value,
    category: document.getElementById('t-cat').value.trim(),
    date: dateStr || todayDS(),
    completed: false, createdAt: Date.now()
  });
  setTasks(tasks);
  titleEl.value = '';
  document.getElementById('t-cat').value = '';
  renderToday();
}

document.getElementById('t-add-btn').addEventListener('click', () => addTask());
document.getElementById('t-title').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

// ──────────────────────────────────────────────────────────────
// WEEK TAB
// ──────────────────────────────────────────────────────────────
let selectedDS = null;

function renderWeek() {
  const tasks  = getTasks();
  const today  = todayDS();
  const days   = weekDays(new Date());
  const names  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  document.getElementById('week-range').textContent =
    fmtShort(days[0]) + ' – ' + fmtShort(days[6]);

  document.getElementById('week-grid').innerHTML = days.map((d, i) => {
    const ds        = toDS(d);
    const dayTasks  = tasks.filter(t => t.date === ds);
    const total     = dayTasks.length;
    const done      = dayTasks.filter(t => t.completed).length;
    const pct       = total > 0 ? Math.round((done / total) * 100) : 0;
    const isToday   = ds === today;
    const isSel     = ds === selectedDS;
    return `
      <div class="week-cell${isToday ? ' is-today' : ''}${isSel ? ' is-selected' : ''}" data-day="${ds}" data-label="${esc(fmtFull(d))}">
        <div class="wc-name">${names[i]}</div>
        <div class="wc-num">${d.getDate()}</div>
        <div class="wc-count">${total ? `${done}/${total}` : '–'}</div>
        ${total ? `
          <div class="wc-bar" style="margin-top:auto">
            <div class="wc-fill" style="width:${pct}%"></div>
          </div>
          <div class="wc-pct">${pct}%</div>` : ''}
      </div>`;
  }).join('');

  document.getElementById('week-grid').addEventListener('click', e => {
    const cell = e.target.closest('[data-day]'); if (!cell) return;
    selectedDS = cell.dataset.day;
    document.getElementById('day-panel-title').textContent = cell.dataset.label;
    document.getElementById('day-panel').style.display = 'block';
    renderDayPanel();
    renderWeek();
  }, { once: true });

  // re-bind after innerHTML overwrite
  setTimeout(() => {
    document.getElementById('week-grid').addEventListener('click', e => {
      const cell = e.target.closest('[data-day]'); if (!cell) return;
      selectedDS = cell.dataset.day;
      document.getElementById('day-panel-title').textContent = cell.dataset.label;
      document.getElementById('day-panel').style.display = 'block';
      renderDayPanel();
      renderWeek();
    });
  }, 0);
}

// Use event delegation on the static grid wrapper instead
document.getElementById('week-grid').addEventListener('click', e => {
  const cell = e.target.closest('[data-day]'); if (!cell) return;
  selectedDS = cell.dataset.day;
  document.getElementById('day-panel-title').textContent = cell.dataset.label;
  document.getElementById('day-panel').style.display = 'block';
  renderDayPanel();
  renderWeek();
});

document.getElementById('day-panel-close').addEventListener('click', () => {
  selectedDS = null;
  document.getElementById('day-panel').style.display = 'none';
  renderWeek();
});

function renderDayPanel() {
  if (!selectedDS) return;
  const tasks = getTasks().filter(t => t.date === selectedDS);
  const sorted = [...tasks].sort((a, b) => a.completed - b.completed);
  const el = document.getElementById('day-task-list');
  el.innerHTML = sorted.length
    ? sorted.map(t => taskHTML(t)).join('')
    : `<div class="empty-state" style="padding:1.5rem"><div class="empty-icon">📝</div>No tasks — add one above!</div>`;
}

bindTaskListEvents(document.getElementById('day-task-list'), () => {
  renderDayPanel();
  renderWeek();
  renderToday();
});

function addWeekTask() {
  if (!selectedDS) return;
  const titleEl = document.getElementById('wt-title');
  const title   = titleEl.value.trim(); if (!title) { titleEl.focus(); return; }
  const tasks = getTasks();
  tasks.push({
    id: uid(), title,
    priority: document.getElementById('wt-priority').value,
    category: '', date: selectedDS,
    completed: false, createdAt: Date.now()
  });
  setTasks(tasks);
  titleEl.value = '';
  renderDayPanel();
  renderWeek();
  if (selectedDS === todayDS()) renderToday();
}

document.getElementById('wt-add-btn').addEventListener('click', addWeekTask);
document.getElementById('wt-title').addEventListener('keydown', e => { if (e.key === 'Enter') addWeekTask(); });

// ──────────────────────────────────────────────────────────────
// GOALS TAB
// ──────────────────────────────────────────────────────────────
function renderGoals() {
  const goals = getGoals();
  const el = document.getElementById('goals-list');
  if (!goals.length) {
    el.innerHTML = `<div class="card empty-state"><div class="empty-icon">🎯</div>No goals yet — set one above!</div>`;
    return;
  }
  const sorted = [...goals].sort((a, b) => a.completed - b.completed);
  el.innerHTML = sorted.map(g => {
    const p = g.progress || 0;
    const col = progressColor(p);
    return `
      <div class="goal-item${g.completed ? ' done' : ''}">
        <div class="goal-row">
          <div class="goal-square${g.completed ? ' checked' : ''}" data-gtoggle="${g.id}">${g.completed ? '✓' : ''}</div>
          <div class="goal-body">
            <div class="goal-name">${esc(g.title)}</div>
            <div class="goal-meta">
              <span class="badge-${g.type}">${g.type}</span>
              ${g.deadline ? `<span class="badge-deadline">📅 ${g.deadline}</span>` : ''}
            </div>
          </div>
          <button class="icon-btn" data-gdel="${g.id}" title="Delete">✕</button>
        </div>
        <div class="goal-progress-row">
          <input type="range" min="0" max="100" value="${p}" style="accent-color:${col}" data-gprog="${g.id}" />
          <span class="goal-pct" id="gp-${g.id}" style="color:${col}">${p}%</span>
        </div>
        <div class="goal-bar" style="margin-top:0.5rem">
          <div class="goal-fill" id="gpbar-${g.id}" style="width:${p}%; background:${col}"></div>
        </div>
      </div>`;
  }).join('');
}

document.getElementById('goals-list').addEventListener('click', e => {
  const tId = e.target.closest('[data-gtoggle]')?.dataset.gtoggle;
  const dId = e.target.closest('[data-gdel]')?.dataset.gdel;
  if (tId) {
    const goals = getGoals(); const g = goals.find(x => x.id === tId);
    if (g) { g.completed = !g.completed; if (g.completed) g.progress = 100; }
    setGoals(goals); renderGoals();
  }
  if (dId) { setGoals(getGoals().filter(x => x.id !== dId)); renderGoals(); }
});

document.getElementById('goals-list').addEventListener('input', e => {
  const gId = e.target.closest('[data-gprog]')?.dataset.gprog;
  if (!gId) return;
  const v = parseInt(e.target.value);
  const goals = getGoals(); const g = goals.find(x => x.id === gId);
  if (g) g.progress = v;
  setGoals(goals);
  const col = progressColor(v);
  const pctEl = document.getElementById('gp-' + gId);
  const barEl = document.getElementById('gpbar-' + gId);
  if (pctEl) { pctEl.textContent = v + '%'; pctEl.style.color = col; }
  if (barEl) { barEl.style.width = v + '%'; barEl.style.background = col; }
  e.target.style.accentColor = col;
});

function addGoal() {
  const titleEl = document.getElementById('g-title');
  const title   = titleEl.value.trim(); if (!title) { titleEl.focus(); return; }
  const goals   = getGoals();
  goals.push({
    id: uid(), title,
    type: document.getElementById('g-type').value,
    deadline: document.getElementById('g-deadline').value,
    progress: 0, completed: false, createdAt: Date.now()
  });
  setGoals(goals);
  titleEl.value = '';
  renderGoals();
}

document.getElementById('g-add-btn').addEventListener('click', addGoal);
document.getElementById('g-title').addEventListener('keydown', e => { if (e.key === 'Enter') addGoal(); });

// ──────────────────────────────────────────────────────────────
// STATS TAB
// ──────────────────────────────────────────────────────────────
function renderStats() {
  const tasks  = getTasks();
  const today  = todayDS();
  const days   = weekDays(new Date()).map(d => toDS(d));

  // Today completed
  const todayDone = tasks.filter(t => t.date === today && t.completed).length;
  document.getElementById('s-today').textContent = todayDone;

  // Week
  const weekT  = tasks.filter(t => days.includes(t.date));
  const weekD  = weekT.filter(t => t.completed).length;
  document.getElementById('s-week').textContent = weekD;
  document.getElementById('s-week-sub').textContent = `of ${weekT.length} total`;

  // Completion rate
  const allDone = tasks.filter(t => t.completed).length;
  const rate    = tasks.length ? Math.round((allDone / tasks.length) * 100) : 0;
  document.getElementById('s-rate').textContent = rate + '%';

  // Streak
  const streak = calcStreak(tasks);
  document.getElementById('s-streak').textContent = streak;
  document.getElementById('s-streak-sub').textContent =
    streak > 1 ? 'Days in a row!' : streak === 1 ? 'Keep it up!' : 'Start today!';

  // Most productive day of week
  const dayCounts = [0,0,0,0,0,0,0];
  tasks.filter(t => t.completed).forEach(t => {
    const dow = new Date(t.date + 'T12:00:00').getDay();
    dayCounts[dow]++;
  });
  const maxVal = Math.max(...dayCounts);
  const maxDow = dayCounts.indexOf(maxVal);
  const DOW_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('s-best-day').textContent = maxVal > 0 ? DOW_NAMES[maxDow] : '—';
  document.getElementById('s-best-day-sub').textContent = maxVal > 0
    ? `${maxVal} task${maxVal === 1 ? '' : 's'} completed on ${DOW_NAMES[maxDow]}s`
    : 'Complete tasks to see your most productive day';

  // Chart
  const DAY_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const counts  = days.map(ds => tasks.filter(t => t.date === ds && t.completed).length);
  const maxCnt  = Math.max(...counts, 1);

  document.getElementById('chart-bars').innerHTML = counts.map((c, i) => {
    const h   = Math.max(Math.round((c / maxCnt) * 100), c > 0 ? 5 : 0);
    const isT = days[i] === today;
    return `<div class="chart-col">
      <span style="font-size:0.62rem; color:var(--text-muted); font-weight:600">${c || ''}</span>
      <div class="chart-bar${isT ? ' today' : ''}" style="height:${h}%"></div>
    </div>`;
  }).join('');

  document.getElementById('chart-day-labels').innerHTML = DAY_SHORT.map((n, i) =>
    `<div class="chart-day-lbl${days[i] === today ? ' today' : ''}">${n}</div>`
  ).join('');
}

function calcStreak(tasks) {
  let streak = 0;
  const d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = 0; i < 366; i++) {
    const ds   = toDS(d);
    const done = tasks.filter(t => t.date === ds && t.completed).length;
    if (done > 0) { streak++; }
    else if (ds === todayDS()) { /* today with 0 — don't break yet */ }
    else { break; }
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

// ──────────────────────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────────────────────
document.getElementById('g-deadline').value = todayDS();
initToday();
renderGoals();
</script>
</body>
</html>
