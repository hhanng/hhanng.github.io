<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vietnamese ↔ English Bilingual Phrasebook — Agent #113</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--card2:#20243a;--blue:#4f8ef7;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--purple:#a78bfa;--orange:#fb923c;--text:#e2e8f0;--muted:#64748b;--border:#2d3150;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
header h1{font-size:1rem;font-weight:700;color:var(--blue);}
header span{font-size:.78rem;color:var(--muted);}
.nav{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav-btn{padding:11px 16px;background:none;border:none;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.5px;transition:all .2s;}
.nav-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.nav-btn:hover:not(.active){color:var(--text);}
.page{display:none;padding:16px;max-width:900px;margin:0 auto;}
.page.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.card-title{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.btn{padding:7px 14px;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-green{background:var(--green);color:#000;}
.btn-red{background:var(--red);color:#fff;}
.btn-yellow{background:var(--yellow);color:#000;}
.btn-muted{background:var(--card2);color:var(--muted);border:1px solid var(--border);}
.btn:hover{opacity:.85;transform:translateY(-1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
select,input[type=text]{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;font-size:.85rem;outline:none;}
select:focus,input[type=text]:focus{border-color:var(--blue);}
/* Phrase cards */
.phrase-list{display:flex;flex-direction:column;gap:8px;}
.phrase-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px;transition:border-color .2s;}
.phrase-card:hover{border-color:var(--blue);}
.phrase-card .texts{flex:1;}
.phrase-en{font-size:.92rem;font-weight:600;margin-bottom:3px;}
.phrase-vi{font-size:.88rem;color:var(--yellow);font-style:italic;}
.phrase-cat{font-size:.65rem;color:var(--muted);margin-top:3px;}
.audio-btn{background:none;border:none;cursor:pointer;font-size:1.2rem;padding:2px 6px;border-radius:6px;transition:background .2s;}
.audio-btn:hover{background:var(--card);}
.star-btn{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:6px;transition:all .2s;color:var(--muted);}
.star-btn.starred{color:var(--yellow);}
/* Flashcard */
.fc-wrap{perspective:800px;margin:16px auto;max-width:500px;height:220px;cursor:pointer;}
.fc{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s;}
.fc.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:8px;}
.fc-front{background:var(--card2);border:2px solid var(--border);}
.fc-back{background:linear-gradient(135deg,#20243a,#1a1d27);border:2px solid var(--blue);transform:rotateY(180deg);}
.fc-main{font-size:1.5rem;font-weight:700;}
.fc-sub{font-size:.85rem;color:var(--muted);}
.fc-translation{font-size:1.2rem;color:var(--yellow);font-weight:600;}
.fc-hint{font-size:.72rem;color:var(--muted);text-align:center;margin-top:6px;}
/* Quiz */
.quiz-q{font-size:1rem;font-weight:600;margin-bottom:4px;}
.quiz-ctx{font-size:.8rem;color:var(--muted);margin-bottom:12px;}
.quiz-inp{width:100%;max-width:400px;padding:10px 14px;border:2px solid var(--border);border-radius:8px;background:var(--card2);color:var(--text);font-size:.95rem;outline:none;}
.quiz-inp:focus{border-color:var(--blue);}
.quiz-inp.correct{border-color:var(--green);background:#4ade8020;}
.quiz-inp.wrong{border-color:var(--red);background:#f8717120;}
.quiz-feedback{font-size:.88rem;min-height:22px;margin:8px 0;}
.prog-bar{height:6px;background:var(--card2);border-radius:3px;margin-top:6px;}
.prog-fill{height:100%;border-radius:3px;background:var(--blue);transition:width .4s;}
/* Search highlight */
.hl{background:#fbbf2440;color:var(--yellow);border-radius:3px;padding:0 2px;}
/* Stats */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;}
.badge-blue{background:#4f8ef730;color:var(--blue);}
.badge-green{background:#4ade8030;color:var(--green);}
.badge-yellow{background:#fbbf2430;color:var(--yellow);}
.badge-red{background:#f8717130;color:var(--red);}
/* Pagination */
.pagination{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
.page-btn{padding:5px 12px;border:1px solid var(--border);background:none;color:var(--muted);border-radius:6px;cursor:pointer;font-size:.78rem;transition:all .2s;}
.page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.page-btn:hover:not(.active){border-color:var(--blue);color:var(--blue);}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.cat-chip{padding:5px 12px;border:1px solid var(--border);background:none;color:var(--muted);border-radius:20px;cursor:pointer;font-size:.75rem;transition:all .2s;white-space:nowrap;}
.cat-chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.empty-state{text-align:center;padding:40px;color:var(--muted);font-size:.9rem;}
</style>
</head>
<body>
<header>
  <h1>🇻🇳🇺🇸 Vietnamese ↔ English Phrasebook</h1>
  <span>Agent #113 · 100 AI Agents Challenge</span>
  <span id="hdr-count" style="margin-left:auto;font-size:.78rem;color:var(--muted);"></span>
</header>
<div class="nav">
  <button class="nav-btn active" onclick="showPage('browse',this)">📖 Browse</button>
  <button class="nav-btn" onclick="showPage('flashcard',this)">🃏 Flashcard</button>
  <button class="nav-btn" onclick="showPage('quiz',this)">✏️ Quiz</button>
  <button class="nav-btn" onclick="showPage('starred',this)">⭐ My Phrasebook</button>
  <button class="nav-btn" onclick="showPage('search',this)">🔍 Search</button>
</div>

<!-- BROWSE -->
<div class="page active" id="page-browse">
  <div class="card">
    <div class="row">
      <select id="browse-cat" onchange="renderBrowse()">
        <option value="all">All Categories</option>
      </select>
      <span id="browse-count" style="font-size:.78rem;color:var(--muted);"></span>
    </div>
    <div class="cat-chips" id="browse-chips"></div>
  </div>
  <div id="browse-list" class="phrase-list"></div>
  <div class="pagination" id="browse-pages"></div>
</div>

<!-- FLASHCARD -->
<div class="page" id="page-flashcard">
  <div class="card">
    <div class="row">
      <select id="fc-cat">
        <option value="all">All Categories</option>
      </select>
      <select id="fc-dir">
        <option value="en">English → Vietnamese</option>
        <option value="vi">Vietnamese → English</option>
        <option value="random">Random Direction</option>
      </select>
      <button class="btn btn-muted" onclick="initFC()">🔀 Shuffle</button>
    </div>
  </div>
  <div class="fc-wrap" onclick="flipFC()">
    <div class="fc" id="fc">
      <div class="fc-face fc-front">
        <div class="fc-sub" id="fc-prompt"></div>
        <div class="fc-main" id="fc-q"></div>
        <div class="fc-sub" id="fc-cat-lbl"></div>
      </div>
      <div class="fc-face fc-back">
        <div class="fc-sub" id="fc-ans-label">Translation</div>
        <div class="fc-translation" id="fc-ans"></div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="audio-btn" id="fc-audio-q" onclick="event.stopPropagation();speakFC(false)">🔊 Q</button>
          <button class="audio-btn" id="fc-audio-a" onclick="event.stopPropagation();speakFC(true)">🔊 A</button>
        </div>
      </div>
    </div>
  </div>
  <div class="fc-hint">Click card to flip</div>
  <div class="row" style="justify-content:center;margin-top:10px;">
    <button class="btn btn-red" onclick="markFC(false)">✗ Practice More</button>
    <button class="btn btn-muted" onclick="skipFC()">→ Skip</button>
    <button class="btn btn-green" onclick="markFC(true)">✓ Got It</button>
  </div>
  <div style="text-align:center;margin-top:8px;">
    <div class="prog-bar" style="max-width:400px;margin:0 auto;"><div class="prog-fill" id="fc-prog"></div></div>
    <div style="font-size:.75rem;color:var(--muted);margin-top:4px;" id="fc-score-txt"></div>
  </div>
</div>

<!-- QUIZ -->
<div class="page" id="page-quiz">
  <div class="card">
    <div class="row">
      <select id="quiz-cat">
        <option value="all">All Categories</option>
      </select>
      <select id="quiz-dir">
        <option value="en">Translate to Vietnamese</option>
        <option value="vi">Translate to English</option>
      </select>
      <button class="btn btn-muted" onclick="initQuiz()">Start Quiz</button>
    </div>
  </div>
  <div class="card" id="quiz-card" style="display:none;">
    <div id="quiz-q" class="quiz-q"></div>
    <div id="quiz-ctx" class="quiz-ctx"></div>
    <input type="text" class="quiz-inp" id="quiz-inp" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')checkQuiz()">
    <div id="quiz-feedback" class="quiz-feedback"></div>
    <div class="row" style="margin-top:6px;">
      <button class="btn btn-blue" onclick="checkQuiz()">Check</button>
      <button class="btn btn-muted" onclick="skipQuiz()">Skip</button>
      <button class="btn btn-muted" onclick="showHint()">💡 Hint</button>
    </div>
    <div style="margin-top:10px;">
      <div class="prog-bar"><div class="prog-fill" id="quiz-prog"></div></div>
      <div style="font-size:.75rem;color:var(--muted);margin-top:4px;" id="quiz-score-txt"></div>
    </div>
  </div>
  <div id="quiz-result"></div>
</div>

<!-- STARRED -->
<div class="page" id="page-starred">
  <div class="card">
    <div class="card-title">My Personal Phrasebook <span id="star-count" class="badge badge-yellow">0</span></div>
    <div class="row">
      <button class="btn btn-muted" onclick="exportStarred()">📋 Export</button>
      <button class="btn btn-muted" onclick="clearStarred()">🗑 Clear All</button>
    </div>
  </div>
  <div id="starred-list" class="phrase-list"></div>
  <div id="starred-empty" class="empty-state" style="display:none;">⭐ Star phrases while browsing to add them here.</div>
</div>

<!-- SEARCH -->
<div class="page" id="page-search">
  <div class="card">
    <div class="row">
      <input type="text" id="search-inp" placeholder="Search English or Vietnamese…" style="flex:1;" oninput="runSearch()">
      <select id="search-cat" onchange="runSearch()">
        <option value="all">All Categories</option>
      </select>
    </div>
    <div style="font-size:.78rem;color:var(--muted);" id="search-count"></div>
  </div>
  <div id="search-results" class="phrase-list"></div>
  <div id="search-empty" class="empty-state" style="display:none;">No phrases found.</div>
</div>

// Build flat array with category info
const ALL_PHRASES = [];
CATEGORIES.forEach(cat=>{
  (PHRASES_RAW[cat.id]||[]).forEach(p=>{
    ALL_PHRASES.push({en:p[0], vi:p[1], cat:cat.id, catName:cat.name});
  });
});

// ─── STATE ────────────────────────────────────────────────────────────────────
const S=k=>localStorage.getItem('a113_'+k);
const W=(k,v)=>localStorage.setItem('a113_'+k,JSON.stringify(v));
const J=k=>{try{return JSON.parse(S(k));}catch{return null;}};
let starred = J('starred') || {};
let quizStats = J('qstats') || {correct:0,total:0};

function isStarred(en){ return !!starred[en]; }
function toggleStar(en){
  if(starred[en]) delete starred[en]; else starred[en]=true;
  W('starred',starred);
}

document.getElementById('hdr-count').textContent = ALL_PHRASES.length+' phrases · '+Object.keys(starred).length+' starred';

// ─── SPEECH ───────────────────────────────────────────────────────────────────
function speak(text, lang){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang==='vi' ? 'vi-VN' : 'en-US';
  utt.rate = 0.9;
  window.speechSynthesis.speak(utt);
}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='starred') renderStarred();
  if(id==='search') runSearch();
}

// ─── BROWSE ───────────────────────────────────────────────────────────────────
let browsePage=0, browsePageSize=20, browseCat='all';
function populateCatSelects(){
  const sels=['browse-cat','fc-cat','quiz-cat','search-cat'];
  sels.forEach(sid=>{
    const sel=document.getElementById(sid);
    if(!sel) return;
    CATEGORIES.forEach(c=>{
      const opt=document.createElement('option');
      opt.value=c.id; opt.textContent=c.name+' ('+PHRASES_RAW[c.id].length+')';
      sel.appendChild(opt);
    });
  });
  // Build chips
  const chips=document.getElementById('browse-chips');
  [{id:'all',name:'All'},...CATEGORIES].forEach(c=>{
    const btn=document.createElement('button');
    btn.className='cat-chip'+(c.id==='all'?' active':'');
    btn.textContent=c.id==='all'?'All ('+ALL_PHRASES.length+')':c.name;
    btn.onclick=()=>{
      document.querySelectorAll('.cat-chip').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('browse-cat').value=c.id;
      browseCat=c.id; browsePage=0; renderBrowse();
    };
    chips.appendChild(btn);
  });
}
function renderBrowse(){
  browseCat=document.getElementById('browse-cat').value;
  const pool = browseCat==='all'?ALL_PHRASES:ALL_PHRASES.filter(p=>p.cat===browseCat);
  const totalPages = Math.ceil(pool.length/browsePageSize);
  if(browsePage>=totalPages) browsePage=0;
  const slice = pool.slice(browsePage*browsePageSize, (browsePage+1)*browsePageSize);
  document.getElementById('browse-count').textContent=pool.length+' phrases';
  const listEl=document.getElementById('browse-list');
  listEl.innerHTML='';
  slice.forEach(p=>{ listEl.appendChild(makePhraseCard(p)); });
  // Pagination
  const pagesEl=document.getElementById('browse-pages');
  pagesEl.innerHTML='';
  if(totalPages<=1) return;
  for(let i=0;i<totalPages;i++){
    const btn=document.createElement('button');
    btn.className='page-btn'+(i===browsePage?' active':'');
    btn.textContent=i+1;
    btn.onclick=(()=>{ const p=i; return ()=>{browsePage=p;renderBrowse();window.scrollTo(0,0);}; })();
    pagesEl.appendChild(btn);
  }
}
function makePhraseCard(p, hl=''){
  const div=document.createElement('div');
  div.className='phrase-card';
  const starred_=isStarred(p.en);
  div.innerHTML=`<div class="texts">
    <div class="phrase-en">${hl?hlText(p.en,hl):p.en}</div>
    <div class="phrase-vi">${hl?hlText(p.vi,hl):p.vi}</div>
    <div class="phrase-cat">${p.catName}</div>
  </div>
  <button class="audio-btn" title="Play English" onclick="speak('${esc(p.en)}','en')">🔊</button>
  <button class="audio-btn" title="Play Vietnamese" onclick="speak('${esc(p.vi)}','vi')">🇻🇳</button>
  <button class="star-btn${starred_?' starred':''}" onclick="toggleStarCard(this,'${esc(p.en)}')" title="${starred_?'Unstar':'Star'}">${starred_?'⭐':'☆'}</button>`;
  return div;
}
function esc(s){ return s.replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function hlText(text, q){
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return text.replace(re,'<span class="hl">$1</span>');
}
function toggleStarCard(btn, en){
  toggleStar(en);
  const s=isStarred(en);
  btn.classList.toggle('starred',s);
  btn.textContent=s?'⭐':'☆';
  btn.title=s?'Unstar':'Star';
  document.getElementById('hdr-count').textContent=ALL_PHRASES.length+' phrases · '+Object.keys(starred).length+' starred';
}
populateCatSelects();
renderBrowse();

// ─── FLASHCARD ────────────────────────────────────────────────────────────────
let fcDeck=[], fcIdx=0, fcCorrect=0, fcTotal=0, fcFlipped=false;
function initFC(){
  const cat=document.getElementById('fc-cat').value;
  fcDeck = cat==='all'?[...ALL_PHRASES]:ALL_PHRASES.filter(p=>p.cat===cat);
  for(let i=fcDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fcDeck[i],fcDeck[j]]=[fcDeck[j],fcDeck[i]];}
  fcIdx=0; fcCorrect=0; fcTotal=0; fcFlipped=false;
  renderFC2();
}
function renderFC2(){
  if(fcIdx>=fcDeck.length){
    document.getElementById('fc-q').textContent='✓ Done! '+fcCorrect+'/'+fcTotal;
    document.getElementById('fc-prog').style.width='100%';
    return;
  }
  const p=fcDeck[fcIdx];
  const dir=document.getElementById('fc-dir').value;
  const showEn=dir==='en'||(dir==='random'&&Math.random()>.5);
  const card=document.getElementById('fc');
  card.classList.remove('flipped'); fcFlipped=false;
  document.getElementById('fc-prompt').textContent=showEn?'🇺🇸 English':'🇻🇳 Vietnamese';
  document.getElementById('fc-q').textContent=showEn?p.en:p.vi;
  document.getElementById('fc-cat-lbl').textContent=p.catName;
  document.getElementById('fc-ans-label').textContent='Translation';
  document.getElementById('fc-ans').textContent=showEn?p.vi:p.en;
  document.getElementById('fc-audio-q').dataset.lang=showEn?'en':'vi';
  document.getElementById('fc-audio-q').dataset.text=showEn?p.en:p.vi;
  document.getElementById('fc-audio-a').dataset.lang=showEn?'vi':'en';
  document.getElementById('fc-audio-a').dataset.text=showEn?p.vi:p.en;
  const pct=fcDeck.length>0?(fcIdx/fcDeck.length*100):0;
  document.getElementById('fc-prog').style.width=pct+'%';
  document.getElementById('fc-score-txt').textContent=fcIdx+'/'+fcDeck.length+' | ✓ '+fcCorrect;
}
function flipFC(){const c=document.getElementById('fc');c.classList.toggle('flipped');fcFlipped=!fcFlipped;}
function speakFC(isAnswer){
  const key=isAnswer?'fc-audio-a':'fc-audio-q';
  const btn=document.getElementById(key);
  speak(btn.dataset.text,btn.dataset.lang);
}
function markFC(know){ if(know) fcCorrect++; fcTotal++; fcIdx++; renderFC2(); }
function skipFC(){ fcIdx++; renderFC2(); }
initFC();

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
let quizDeck=[], quizIdx=0, qCorrect=0, qTotal=0, quizAnswered=false;
function initQuiz(){
  const cat=document.getElementById('quiz-cat').value;
  quizDeck=cat==='all'?[...ALL_PHRASES]:ALL_PHRASES.filter(p=>p.cat===cat);
  for(let i=quizDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[quizDeck[i],quizDeck[j]]=[quizDeck[j],quizDeck[i]];}
  quizIdx=0; qCorrect=0; qTotal=0; quizAnswered=false;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('quiz-result').innerHTML='';
  renderQuizQ();
}
function renderQuizQ(){
  if(quizIdx>=quizDeck.length){
    document.getElementById('quiz-card').style.display='none';
    const pct=qTotal>0?Math.round(100*qCorrect/qTotal):0;
    const cls=pct>=80?'feedback-good':pct>=60?'feedback-mid':'feedback-low';
    document.getElementById('quiz-result').innerHTML='<div class="card" style="text-align:center;"><div style="font-size:1.5rem;font-weight:700;color:var(--'+(pct>=80?'green':pct>=60?'yellow':'red')+')">'+pct+'%</div><div style="margin-top:6px;">'+qCorrect+'/'+qTotal+' correct</div><button class="btn btn-blue" style="margin-top:12px;" onclick="initQuiz()">Try Again</button></div>';
    quizStats.correct+=qCorrect; quizStats.total+=qTotal; W('qstats',quizStats);
    return;
  }
  const p=quizDeck[quizIdx];
  const dir=document.getElementById('quiz-dir').value;
  document.getElementById('quiz-q').textContent=dir==='en'?p.en:p.vi;
  document.getElementById('quiz-ctx').textContent='Translate to '+(dir==='en'?'Vietnamese':'English')+' — Category: '+p.catName;
  const inp=document.getElementById('quiz-inp');
  inp.value=''; inp.className='quiz-inp'; inp.disabled=false; inp.focus();
  document.getElementById('quiz-feedback').textContent='';
  quizAnswered=false;
  const pct=quizDeck.length>0?(quizIdx/quizDeck.length*100):0;
  document.getElementById('quiz-prog').style.width=pct+'%';
  document.getElementById('quiz-score-txt').textContent=quizIdx+'/'+quizDeck.length+' | Score: '+qCorrect+'/'+qTotal;
}
function normalize(s){ return s.toLowerCase().trim().replace(/[.,!?;:'"]/g,'').replace(/\s+/,' '); }
function fuzzyMatch(a,b){
  const na=normalize(a), nb=normalize(b);
  if(na===nb) return true;
  // allow 1-char difference for short answers, 2 for longer
  const maxDist = na.length<=5?1:2;
  return levenshtein(na,nb)<=maxDist;
}
function levenshtein(a,b){
  const dp=Array.from({length:a.length+1},(_,i)=>Array.from({length:b.length+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[a.length][b.length];
}
function checkQuiz(){
  if(quizAnswered) return;
  const p=quizDeck[quizIdx];
  const dir=document.getElementById('quiz-dir').value;
  const correct=dir==='en'?p.vi:p.en;
  const inp=document.getElementById('quiz-inp');
  const val=inp.value;
  if(!val.trim()){ document.getElementById('quiz-feedback').textContent='Type an answer first.'; return; }
  quizAnswered=true;
  inp.disabled=true;
  const ok=fuzzyMatch(val,correct);
  if(ok){ qCorrect++; inp.className='quiz-inp correct'; document.getElementById('quiz-feedback').innerHTML='<span style="color:var(--green);font-weight:700;">✓ Correct!</span>'; }
  else{ inp.className='quiz-inp wrong'; document.getElementById('quiz-feedback').innerHTML='<span style="color:var(--red);font-weight:700;">✗ Answer: </span><span style="color:var(--yellow)">'+correct+'</span>'; speak(correct,dir==='en'?'vi':'en'); }
  qTotal++;
  setTimeout(()=>{ quizIdx++; renderQuizQ(); },1400);
}
function skipQuiz(){ quizIdx++; renderQuizQ(); }
function showHint(){
  const p=quizDeck[quizIdx];
  const dir=document.getElementById('quiz-dir').value;
  const ans=dir==='en'?p.vi:p.en;
  document.getElementById('quiz-feedback').textContent='💡 Starts with: '+ans.slice(0,3)+'…';
}

// ─── STARRED ──────────────────────────────────────────────────────────────────
function renderStarred(){
  const keys=Object.keys(starred);
  document.getElementById('star-count').textContent=keys.length;
  document.getElementById('hdr-count').textContent=ALL_PHRASES.length+' phrases · '+keys.length+' starred';
  const listEl=document.getElementById('starred-list');
  listEl.innerHTML='';
  const empty=document.getElementById('starred-empty');
  if(keys.length===0){ empty.style.display='block'; return; }
  empty.style.display='none';
  const phrases=ALL_PHRASES.filter(p=>starred[p.en]);
  phrases.forEach(p=>{ listEl.appendChild(makePhraseCard(p)); });
}
function exportStarred(){
  const phrases=ALL_PHRASES.filter(p=>starred[p.en]);
  if(phrases.length===0){ alert('No starred phrases to export.'); return; }
  const lines=['English\tVietnamese\tCategory',...phrases.map(p=>p.en+'\t'+p.vi+'\t'+p.catName)];
  const url='data:text/plain;charset=utf-8,'+encodeURIComponent(lines.join('\n'));
  const a=document.createElement('a'); a.href=url; a.download='my-phrasebook.txt'; a.click();
}
function clearStarred(){
  if(!confirm('Clear all starred phrases?')) return;
  starred={}; W('starred',starred); renderStarred();
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
function runSearch(){
  const q=document.getElementById('search-inp').value.trim();
  const cat=document.getElementById('search-cat').value;
  let pool=cat==='all'?ALL_PHRASES:ALL_PHRASES.filter(p=>p.cat===cat);
  const resEl=document.getElementById('search-results');
  const emptyEl=document.getElementById('search-empty');
  if(!q){ resEl.innerHTML=''; emptyEl.style.display='none'; document.getElementById('search-count').textContent=''; return; }
  const ql=q.toLowerCase();
  const results=pool.filter(p=>p.en.toLowerCase().includes(ql)||p.vi.toLowerCase().includes(ql));
  document.getElementById('search-count').textContent=results.length+' result'+(results.length!==1?'s':'');
  resEl.innerHTML='';
  if(results.length===0){ emptyEl.style.display='block'; return; }
  emptyEl.style.display='none';
  results.slice(0,50).forEach(p=>{ resEl.appendChild(makePhraseCard(p,q)); });
}
