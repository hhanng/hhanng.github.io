<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent #116 · Advanced FAANG Patterns Trainer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--sub:#94a3b8;--accent:#38bdf8;--accent2:#7dd3fc;--green:#22c55e;--red:#ef4444;--orange:#f97316;--yellow:#eab308;--purple:#a78bfa}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* TOPBAR */
.topbar{background:#0a1628;border-bottom:1px solid var(--border);padding:11px 20px;display:flex;align-items:center;gap:12px}
.topbar .tag{font-size:.68rem;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
.topbar h1{font-size:.95rem;font-weight:800}
.back{margin-left:auto;font-size:.78rem;color:var(--sub);border:1px solid var(--border);padding:5px 12px;border-radius:6px;text-decoration:none;transition:background .15s}
.back:hover{background:var(--card)}

/* TABS */
.tabs{display:flex;background:#0a1628;border-bottom:1px solid var(--border)}
.tab-btn{padding:11px 22px;font-size:.86rem;font-weight:600;color:var(--sub);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;min-height:44px;white-space:nowrap}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover:not(.active){color:var(--text)}
.tab-pane{display:none}.tab-pane.active{display:block}

/* LIBRARY LAYOUT */
.lib-layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 88px)}

/* SIDEBAR */
.sidebar{background:#0a1628;border-right:1px solid var(--border);padding:12px 8px;overflow-y:auto}
.sidebar-title{font-size:.68rem;font-weight:700;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;padding:4px 10px 10px}
.pat-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;transition:background .15s;margin-bottom:2px;position:relative}
.pat-item:hover{background:var(--card)}
.pat-item.active{background:#0f2a3f;color:var(--accent)}
.pat-icon{font-size:1rem;flex-shrink:0;width:22px;text-align:center}
.pat-name{flex:1;line-height:1.3}
.due-badge{background:var(--orange);color:#fff;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:99px;margin-left:auto;flex-shrink:0}

/* DETAIL PANEL */
.detail{padding:22px 24px;overflow-y:auto;max-height:calc(100vh - 88px)}
.detail-header{margin-bottom:18px}
.detail-title{font-size:1.3rem;font-weight:800;margin-bottom:8px}
.trigger-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.trigger-badge{background:#0f2a3f;color:var(--accent);border:1px solid #1e4a6e;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600}

/* SVG DIAGRAM */
.diagram-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;text-align:center}
.diagram-label{font-size:.7rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.diagram-wrap svg{max-width:100%;height:auto}

/* CODE */
.code-wrap{background:#020c1b;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.code-header{background:var(--card);padding:8px 14px;font-size:.72rem;font-weight:700;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.copy-btn{background:none;border:1px solid var(--border);color:var(--sub);font-size:.7rem;padding:2px 8px;border-radius:4px;cursor:pointer;transition:all .15s}
.copy-btn:hover{color:var(--accent);border-color:var(--accent)}
pre{padding:16px;font-size:.8rem;line-height:1.7;overflow-x:auto;color:#a5f3fc;font-family:'Fira Code',monospace,sans-serif}

/* COMPLEXITY */
.cplx-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:.83rem}
.cplx-table th{background:var(--card);padding:8px 12px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:700;border:1px solid var(--border)}
.cplx-table td{padding:9px 12px;border:1px solid var(--border)}
.cplx-table tr:nth-child(even) td{background:#0d1b2a}
.better{color:var(--green);font-weight:700}
.worse{color:var(--red)}

/* PROBLEMS */
.problems-section{margin-bottom:20px}
.problems-title{font-size:.78rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.prob-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:.82rem;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;margin:3px}
.prob-btn:hover{border-color:var(--accent);color:var(--accent)}
.prob-num{color:var(--accent);font-weight:800}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:680px;margin:auto;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px}
.modal-title{font-size:1rem;font-weight:800;line-height:1.4}
.modal-close{background:none;border:none;color:var(--sub);font-size:1.5rem;cursor:pointer;flex-shrink:0;line-height:1}
.modal-close:hover{color:var(--text)}
.hint-btn{padding:6px 14px;background:#0f2a3f;border:1px solid #1e4a6e;color:var(--accent2);border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;margin-right:6px;margin-bottom:6px;transition:all .15s}
.hint-btn:hover{background:#1e4a6e}
.hint-box{background:#020c1b;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:8px;font-size:.83rem;line-height:1.6;display:none}
.hint-box.show{display:block}
.solution-wrap{margin-top:14px;display:none}
.solution-wrap.show{display:block}
.sol-label{font-size:.72rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.prob-statement{font-size:.88rem;line-height:1.6;color:var(--text);margin-bottom:14px;padding:12px;background:#020c1b;border-radius:8px;border:1px solid var(--border)}

/* PLACEHOLDER TABS */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--sub);text-align:center;gap:8px}
.placeholder .big{font-size:2.5rem}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--accent);color:var(--text);padding:9px 16px;border-radius:8px;font-size:.82rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999}
.toast.show{opacity:1}

/* SVG ANIMATIONS */
@keyframes slideRight{0%{transform:translateX(0)}50%{transform:translateX(18px)}100%{transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes moveDown{0%{transform:translateY(0)}50%{transform:translateY(10px)}100%{transform:translateY(0)}}
@keyframes expandR{0%{width:30px}50%{width:70px}100%{width:30px}}
@keyframes rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes blink{0%,100%{fill:#38bdf8}50%{fill:#0f172a}}
@keyframes flowDown{0%{transform:translateY(-6px);opacity:0}100%{transform:translateY(6px);opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(160px)}}
@keyframes popIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes arrowPulse{0%,100%{stroke:#38bdf8}50%{stroke:#f97316}}

@media(max-width:700px){
  .lib-layout{grid-template-columns:1fr}
  .sidebar{max-height:180px;overflow-x:auto;overflow-y:hidden;display:flex;flex-direction:row;flex-wrap:nowrap;padding:8px;gap:6px;border-right:none;border-bottom:1px solid var(--border)}
  .sidebar-title{display:none}
  .pat-item{flex-shrink:0;padding:7px 10px;border-radius:99px;margin-bottom:0}
  .pat-name{white-space:nowrap}
  .detail{max-height:none}
}
</style>
</head>

<script>
// ===================== PATTERNS DATA =====================
const PATTERNS = [
{
  id:1, icon:"📊", name:"Monotonic Stack",
  triggers:["next greater","previous smaller","largest rectangle","span","temperature"],
  template:`stack = []
for i, val in enumerate(nums):
    while stack and nums[stack[-1]] < val:
        idx = stack.pop()
        # process popped index (found answer for idx)
    stack.append(i)
# Remaining items in stack have no answer`,
  time:"O(n)", space:"O(n)", bruteTime:"O(n²)", bruteSpace:"O(1)",
  problems:[
    {title:"Next Greater Element",
     stmt:"For each element in nums1, find its next greater element in nums2. If none, return -1.",
     hints:["Iterate right-to-left or left-to-right maintaining a decreasing stack.","Pop from stack while top ≤ current value; top is the 'next greater' for popped elements.","Store answers in a hashmap keyed by value."],
     sol:`def nextGreaterElement(nums1, nums2):
    stack, nge = [], {}
    for n in nums2:
        while stack and stack[-1] < n:
            nge[stack.pop()] = n
        stack.append(n)
    for n in stack:
        nge[n] = -1
    return [nge[n] for n in nums1]`},
    {title:"Daily Temperatures",
     stmt:"Given daily temperatures, return how many days until a warmer temperature for each day.",
     hints:["Use a stack of indices, not values.","When you find a warmer day, pop and record the gap.","Remaining in stack never get a warmer day → 0."],
     sol:`def dailyTemperatures(T):
    res, stack = [0]*len(T), []
    for i, t in enumerate(T):
        while stack and T[stack[-1]] < t:
            j = stack.pop()
            res[j] = i - j
        stack.append(i)
    return res`},
    {title:"Largest Rectangle in Histogram",
     stmt:"Find the largest rectangle area in a histogram given bar heights.",
     hints:["For each bar, find the nearest shorter bar on left and right.","Monotonic stack gives you these boundaries in O(n).","Area = height × (right_boundary - left_boundary - 1)."],
     sol:`def largestRectangleArea(heights):
    heights.append(0)
    stack, max_area = [-1], 0
    for i, h in enumerate(heights):
        while stack[-1] != -1 and heights[stack[-1]] >= h:
            height = heights[stack.pop()]
            width = i - stack[-1] - 1
            max_area = max(max_area, height * width)
        stack.append(i)
    return max_area`},
    {title:"Trapping Rain Water",
     stmt:"Given elevation heights, compute how much water can be trapped between bars.",
     hints:["Two-pointer approach: track left_max and right_max.","Water at index i = min(left_max, right_max) - height[i].","Alternatively, use a stack to find bounded valleys."],
     sol:`def trap(height):
    l, r = 0, len(height)-1
    lmax = rmax = water = 0
    while l < r:
        if height[l] < height[r]:
            lmax = max(lmax, height[l])
            water += lmax - height[l]; l += 1
        else:
            rmax = max(rmax, height[r])
            water += rmax - height[r]; r -= 1
    return water`},
    {title:"Remove K Digits",
     stmt:"Remove k digits from a number string to make the smallest possible number.",
     hints:["Maintain a monotonic increasing stack of digits.","Pop from stack when current digit < top (and k > 0).","Handle leading zeros and remaining k in cleanup."],
     sol:`def removeKdigits(num, k):
    stack = []
    for d in num:
        while k and stack and stack[-1] > d:
            stack.pop(); k -= 1
        stack.append(d)
    stack = stack[:-k] if k else stack
    return ''.join(stack).lstrip('0') or '0'`}
  ]
},
{
  id:2, icon:"🪟", name:"Sliding Window Variable",
  triggers:["longest substring","minimum window","at most K","fruit baskets","permutation"],
  template:`l, counts = 0, {}
for r, val in enumerate(s):
    counts[val] = counts.get(val, 0) + 1
    while invalid(counts):   # shrink until valid
        counts[s[l]] -= 1
        if counts[s[l]] == 0: del counts[s[l]]
        l += 1
    result = max(result, r - l + 1)`,
  time:"O(n)", space:"O(k)", bruteTime:"O(n²)", bruteSpace:"O(k)",
  problems:[
    {title:"Longest Substring with K Distinct",
     stmt:"Find the length of the longest substring containing at most K distinct characters.",
     hints:["Expand right, shrink left when distinct chars > K.","Use a frequency map; shrink until len(map) ≤ K.","Window size r-l+1 is candidate answer."],
     sol:`def lengthOfLongestSubstringKDistinct(s, k):
    l, freq, res = 0, {}, 0
    for r, c in enumerate(s):
        freq[c] = freq.get(c, 0) + 1
        while len(freq) > k:
            freq[s[l]] -= 1
            if not freq[s[l]]: del freq[s[l]]
            l += 1
        res = max(res, r - l + 1)
    return res`},
    {title:"Minimum Window Substring",
     stmt:"Find the minimum window in s that contains all characters of t.",
     hints:["Track need dict and have dict (characters satisfied).","Expand right, shrink left when all chars satisfied.","Track minimum window by (start, length) when formed == required."],
     sol:`def minWindow(s, t):
    need = {}
    for c in t: need[c] = need.get(c,0)+1
    have, req = {}, len(need)
    formed = l = 0; ans = ""
    for r, c in enumerate(s):
        have[c] = have.get(c,0)+1
        if c in need and have[c] == need[c]: formed += 1
        while formed == req:
            if not ans or r-l+1 < len(ans): ans = s[l:r+1]
            have[s[l]] -= 1
            if s[l] in need and have[s[l]] < need[s[l]]: formed -= 1
            l += 1
    return ans`},
    {title:"Fruit Into Baskets",
     stmt:"Pick fruit from trees into 2 baskets, each holding one type. Maximize total fruit picked.",
     hints:["This is 'longest subarray with at most 2 distinct values'.","Use sliding window with frequency map.","Shrink when distinct types > 2."],
     sol:`def totalFruit(fruits):
    l, basket, res = 0, {}, 0
    for r, f in enumerate(fruits):
        basket[f] = basket.get(f,0)+1
        while len(basket) > 2:
            basket[fruits[l]] -= 1
            if not basket[fruits[l]]: del basket[fruits[l]]
            l += 1
        res = max(res, r-l+1)
    return res`},
    {title:"Longest Repeating Character Replacement",
     stmt:"Replace at most k characters in a string. Find the longest substring with all same character.",
     hints:["Track max frequency character in window.","Window is valid if window_size - max_freq ≤ k.","Never shrink window past its historical maximum size."],
     sol:`def characterReplacement(s, k):
    l, freq, maxf, res = 0, {}, 0, 0
    for r, c in enumerate(s):
        freq[c] = freq.get(c,0)+1
        maxf = max(maxf, freq[c])
        if (r-l+1) - maxf > k:
            freq[s[l]] -= 1; l += 1
        res = max(res, r-l+1)
    return res`},
    {title:"Permutation in String",
     stmt:"Check if any permutation of s1 is a substring of s2.",
     hints:["Fixed window of size len(s1).","Compare character frequency maps.","Slide window over s2, updating counts incrementally."],
     sol:`def checkInclusion(s1, s2):
    n1, n2 = len(s1), len(s2)
    if n1 > n2: return False
    need = [0]*26
    for c in s1: need[ord(c)-97] += 1
    have = [0]*26
    for i,c in enumerate(s2):
        have[ord(c)-97] += 1
        if i >= n1: have[ord(s2[i-n1])-97] -= 1
        if have == need: return True
    return False`}
  ]
},
{
  id:3, icon:"🔗", name:"Union Find",
  triggers:["connected components","merge groups","cycle detection","friends","accounts"],
  template:`parent = list(range(n))
rank = [0] * n

def find(x):
    if parent[x] != x:
        parent[x] = find(parent[x])  # path compression
    return parent[x]

def union(x, y):
    px, py = find(x), find(y)
    if px == py: return False  # already connected
    if rank[px] < rank[py]: px, py = py, px
    parent[py] = px
    if rank[px] == rank[py]: rank[px] += 1
    return True`,
  time:"O(α(n)) per op", space:"O(n)", bruteTime:"O(n)", bruteSpace:"O(n)",
  problems:[
    {title:"Number of Islands II",
     stmt:"Dynamically add land cells to a grid; after each addition return number of islands.",
     hints:["Use Union Find on grid coordinates mapped to 1D index.","When adding land, union with adjacent land cells.","Count components by tracking how many roots have no parent."],
     sol:`def numIslands2(m, n, positions):
    parent = {}
    def find(x):
        if parent[x] != x: parent[x] = find(parent[x])
        return parent[x]
    def union(x, y):
        px, py = find(x), find(y)
        if px != py: parent[px] = py; return True
        return False
    count, res = 0, []
    for r, c in positions:
        if (r,c) not in parent:
            parent[(r,c)] = (r,c); count += 1
            for dr,dc in [(-1,0),(1,0),(0,-1),(0,1)]:
                nb = (r+dr, c+dc)
                if nb in parent and union((r,c), nb): count -= 1
        res.append(count)
    return res`},
    {title:"Redundant Connection",
     stmt:"Find the last edge that can be removed to make a tree (remove a cycle edge).",
     hints:["Process edges one by one, union their endpoints.","If two nodes are already connected (same root), this edge is redundant.","Return the first such edge found."],
     sol:`def findRedundantConnection(edges):
    parent = list(range(len(edges)+1))
    def find(x):
        while parent[x] != x: parent[x] = parent[parent[x]]; x = parent[x]
        return x
    for u, v in edges:
        pu, pv = find(u), find(v)
        if pu == pv: return [u, v]
        parent[pu] = pv`},
    {title:"Friend Circles",
     stmt:"Given an NxN friendship matrix, find the number of friend circles.",
     hints:["Union all friends of each person.","Count distinct roots after all unions.","Path compression makes this very fast."],
     sol:`def findCircleNum(M):
    n = len(M)
    parent = list(range(n))
    def find(x):
        if parent[x]!=x: parent[x]=find(parent[x])
        return parent[x]
    for i in range(n):
        for j in range(i+1,n):
            if M[i][j]: parent[find(i)] = find(j)
    return sum(parent[i]==i for i in range(n))`},
    {title:"Accounts Merge",
     stmt:"Merge accounts that share at least one common email address.",
     hints:["Map each email to an account index; union accounts sharing emails.","After all unions, group emails by their root account.","Sort emails per group and format output."],
     sol:`def accountsMerge(accounts):
    parent = list(range(len(accounts)))
    def find(x):
        if parent[x]!=x: parent[x]=find(parent[x])
        return parent[x]
    email_acc = {}
    for i, acc in enumerate(accounts):
        for e in acc[1:]:
            if e in email_acc: parent[find(i)] = find(email_acc[e])
            else: email_acc[e] = i
    groups = {}
    for e, i in email_acc.items():
        groups.setdefault(find(i), set()).add(e)
    return [[accounts[i][0]] + sorted(emails) for i, emails in groups.items()]`},
    {title:"Satisfiability of Equality Equations",
     stmt:"Given equations like a==b and a!=b, determine if all are satisfiable.",
     hints:["Process all == equations first to union connected variables.","Then verify != equations: if two sides have same root, contradiction.","26 variables max (lowercase letters)."],
     sol:`def equationsPossible(equations):
    parent = list(range(26))
    def find(x):
        if parent[x]!=x: parent[x]=find(parent[x])
        return parent[x]
    for eq in equations:
        if eq[1]=='=':

// ===================== STATE =====================
const STORE = 'apt116_v1';
let state, activePat = null, activeProb = null;

function loadState(){
  try{state=JSON.parse(localStorage.getItem(STORE))||{};}catch(e){state={};}
  if(!state.patternStats)state.patternStats={};
}
function save(){localStorage.setItem(STORE,JSON.stringify(state));}

// ===================== TABS =====================
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',['library','challenge','quiz'][i]===name);
  });
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

// ===================== SIDEBAR =====================
function renderSidebar(){
  const el=document.getElementById('sidebar-list');
  const today=new Date().toISOString().slice(0,10);
  // Patterns 1-10 (full data)
  let html=PATTERNS.map(p=>{
    const stats=state.patternStats[p.id]||{};
    const isDue=stats.nextReview && stats.nextReview<=today;
    return `<div class="pat-item" id="pat-item-${p.id}" onclick="selectPattern(${p.id})">
      <span class="pat-icon">${p.icon}</span>
      <span class="pat-name">${p.name}</span>
      ${isDue?'<span class="due-badge">Due</span>':''}
    </div>`;
  }).join('');
  // Patterns 11-20 (stubs)
  html+=PATTERN_NAMES_11_20.map(p=>`
    <div class="pat-item" style="opacity:.45;cursor:default" title="Coming soon">
      <span class="pat-icon">${p.icon}</span>
      <span class="pat-name">${p.name}</span>
      <span style="font-size:.62rem;color:var(--sub);margin-left:auto">soon</span>
    </div>`).join('');
  el.innerHTML=html;
}

// ===================== PATTERN DETAIL =====================
function selectPattern(id){
  activePat=id;
  document.querySelectorAll('.pat-item').forEach(el=>el.classList.remove('active'));
  const item=document.getElementById('pat-item-'+id);
  if(item)item.classList.add('active');
  const p=PATTERNS.find(x=>x.id===id);
  if(!p)return;
  const stats=state.patternStats[id]||{};
  const detail=document.getElementById('detail-panel');
  detail.innerHTML=`
    <div class="detail-header">
      <div class="detail-title">${p.icon} ${p.name}</div>
      <div class="trigger-row">${p.triggers.map(t=>`<span class="trigger-badge">🔑 ${t}</span>`).join('')}</div>
    </div>

    <div class="diagram-wrap">
      <div class="diagram-label">Pattern Diagram</div>
      ${getSVG(id)}
    </div>

    <table class="cplx-table">
      <tr><th>Approach</th><th>Time</th><th>Space</th></tr>
      <tr><td><strong>${p.name}</strong></td><td class="better">${p.time}</td><td class="better">${p.space}</td></tr>
      <tr><td>Brute Force</td><td class="worse">${p.bruteTime}</td><td>${p.bruteSpace}</td></tr>

    <div class="code-wrap">
      <div class="code-header">

      </div>

    </div>

    <div class="problems-section">
      <div class="problems-title">📋 5 Problems — click to practice</div>
      <div>${p.problems.map((prob,i)=>`

    </div>`:''}
  `;
}

// ===================== PROBLEM MODAL =====================
function openProblem(patId, probIdx){
  const p=PATTERNS.find(x=>x.id===patId);
  if(!p)return;
  const prob=p.problems[probIdx];
  activeProb={patId,probIdx,prob};

  document.getElementById('modal-prob-title').textContent=`${p.icon} ${prob.title}`;
  document.getElementById('modal-prob-stmt').textContent=prob.stmt;
  document.getElementById('hint-0').textContent='';
  document.getElementById('hint-1').textContent='';
  document.getElementById('hint-2').textContent='';
  ['hint-0','hint-1','hint-2'].forEach(id=>document.getElementById(id).classList.remove('show'));
  document.getElementById('sol-wrap').classList.remove('show');
  document.getElementById('modal-sol').textContent=prob.sol;
  document.getElementById('prob-modal').classList.add('open');
}

function showHint(idx){
  if(!activeProb)return;
  const hint=activeProb.prob.hints[idx];
  const el=document.getElementById('hint-'+idx);
  el.textContent=(idx+1)+'. '+hint;
  el.classList.add('show');
}

function showSolution(){
  document.getElementById('sol-wrap').classList.add('show');
}

function closeModal(){
  document.getElementById('prob-modal').classList.remove('open');
}

// ===================== UTILS =====================
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function copyCode(id){
  const p=PATTERNS.find(x=>x.id===id);
  if(!p)return;
  navigator.clipboard.writeText(p.template).then(()=>toast('Copied!')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=p.template;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); toast('Copied!');
  });
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// Click outside modal
document.getElementById('prob-modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('prob-modal')) closeModal();
});

// ===================== INIT =====================
loadState();
renderSidebar();
// Default: select pattern 1
selectPattern(1);
