<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" role="img" aria-label="Crochet doll placeholder">
  <defs>
    <radialGradient id="skin" cx="42%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#efd2bb"/>
      <stop offset="100%" stop-color="#e0bb9d"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b4030"/>
      <stop offset="100%" stop-color="#3c2a1f"/>
    </linearGradient>
    <pattern id="knit" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#1b1b1d"/>
      <path d="M0 4h8M4 0v8" stroke="#2b2b2e" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect width="300" height="360" fill="#f4efe6"/>

  <!-- knit sweater -->
  <path d="M56 360 V266 c0 -44 42 -74 94 -74 s94 30 94 74 V360 Z" fill="url(#knit)"/>
  <path d="M150 198 l15 22 -15 17 -15 -17 Z" fill="#242427"/>

  <!-- necklace -->
  <path d="M124 200 q26 30 52 0" stroke="#c9a34e" stroke-width="3" fill="none"/>
  <circle cx="150" cy="224" r="3" fill="#c9a34e"/>

  <!-- hair behind -->
  <path d="M150 40 c-60 0 -88 46 -88 100 c0 46 8 86 20 128 c-28 -38 -34 -84 -24 -134 c-16 30 -18 74 -4 116 c-20 -58 -10 -168 34 -206 c22 -22 40 -30 62 -32 Z" fill="url(#hair)"/>
  <path d="M150 40 c60 0 88 46 88 100 c0 46 -8 86 -20 128 c28 -38 34 -84 24 -134 c16 30 18 74 4 116 c20 -58 10 -168 -34 -206 c-22 -22 -40 -30 -62 -32 Z" fill="url(#hair)"/>

  <!-- face -->
  <ellipse cx="150" cy="150" rx="63" ry="72" fill="url(#skin)"/>

  <!-- hair front / centre part -->
  <path d="M150 78 c-44 0 -68 32 -72 70 c11 -32 32 -49 57 -53 c-9 9 -13 22 -13 34 c7 -24 19 -37 30 -41 c11 4 23 17 30 41 c0 -12 -4 -25 -13 -34 c25 4 46 21 57 53 c-4 -38 -28 -70 -72 -70 Z" fill="url(#hair)"/>

  <!-- gold hoop earrings -->
  <circle cx="86" cy="168" r="7" fill="none" stroke="#c9a34e" stroke-width="3"/>
  <circle cx="214" cy="168" r="7" fill="none" stroke="#c9a34e" stroke-width="3"/>

  <!-- brows -->
  <path d="M101 133 q18 -11 34 -2" stroke="#4a3324" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M165 131 q16 -9 34 2" stroke="#4a3324" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- eye whites -->
  <circle cx="120" cy="150" r="13" fill="#fbf7f1" stroke="#c9b4a1" stroke-width="1.4"/>
  <circle cx="180" cy="150" r="13" fill="#fbf7f1" stroke="#c9b4a1" stroke-width="1.4"/>

  <!-- tortoiseshell round glasses -->
  <circle cx="120" cy="150" r="21" fill="none" stroke="#7a5a3a" stroke-width="3.6"/>
  <circle cx="180" cy="150" r="21" fill="none" stroke="#7a5a3a" stroke-width="3.6"/>
  <path d="M141 150 h18" stroke="#7a5a3a" stroke-width="3.6"/>
  <path d="M99 150 q-13 -3 -17 6" stroke="#7a5a3a" stroke-width="3.6" fill="none"/>
  <path d="M201 150 q13 -3 17 6" stroke="#7a5a3a" stroke-width="3.6" fill="none"/>

  <!-- blush -->
  <ellipse cx="108" cy="176" rx="11" ry="7" fill="#e7a9a0" opacity="0.6"/>
  <ellipse cx="192" cy="176" rx="11" ry="7" fill="#e7a9a0" opacity="0.6"/>

  <!-- mouth + cheeky tongue -->
  <path d="M139 190 q11 9 22 0" stroke="#9c5a52" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M147 194 q3 11 6 0 Z" fill="#d98a83"/>
</svg>
