<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" role="img" aria-label="3D cartoon avatar placeholder">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#d9dbdf"/>
    </radialGradient>
    <radialGradient id="skin" cx="40%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#f2f2f3"/>
      <stop offset="70%" stop-color="#dcdde0"/>
      <stop offset="100%" stop-color="#c7c9cd"/>
    </radialGradient>
    <radialGradient id="hair" cx="42%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#3c3e43"/>
      <stop offset="65%" stop-color="#26282c"/>
      <stop offset="100%" stop-color="#17181b"/>
    </radialGradient>
    <radialGradient id="shirt" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#fbfbfc"/>
      <stop offset="100%" stop-color="#e2e3e6"/>
    </radialGradient>
    <radialGradient id="eye" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#6f7378"/>
      <stop offset="60%" stop-color="#3a3c40"/>
      <stop offset="100%" stop-color="#202226"/>
    </radialGradient>
  </defs>

  <rect width="300" height="360" rx="36" fill="url(#bg)"/>

  <!-- hair back -->
  <path d="M150 40 C88 40 60 92 60 158 C60 236 74 300 92 356 L208 356 C226 300 240 236 240 158 C240 92 212 40 150 40 Z" fill="url(#hair)"/>

  <!-- shirt with collar -->
  <path d="M74 356 C78 300 108 274 150 274 C192 274 222 300 226 356 Z" fill="url(#shirt)"/>
  <path d="M150 276 l-20 20 12 14 8 -12 8 12 12 -14 Z" fill="#eceef1"/>
  <path d="M130 296 q20 20 40 0" fill="none" stroke="#cfd1d6" stroke-width="3"/>

  <!-- neck -->
  <path d="M132 250 h36 v26 q-18 14 -36 0 Z" fill="url(#skin)"/>

  <!-- face -->
  <ellipse cx="150" cy="168" rx="72" ry="80" fill="url(#skin)"/>

  <!-- hair front sweep -->
  <path d="M150 44 C96 44 70 92 70 150 C86 116 112 96 150 92 C188 96 214 116 230 150 C230 92 204 44 150 44 Z" fill="url(#hair)"/>
  <path d="M150 92 C120 92 96 108 84 138 C104 118 126 110 150 110 C174 110 196 118 216 138 C204 108 180 92 150 92 Z" fill="#2c2e32"/>

  <!-- brows -->
  <path d="M104 150 q20 -12 40 -3" stroke="#2a2c30" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M156 147 q20 -9 40 3" stroke="#2a2c30" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- eye whites -->
  <ellipse cx="120" cy="176" rx="18" ry="20" fill="#fdfdfe"/>
  <ellipse cx="180" cy="176" rx="18" ry="20" fill="#fdfdfe"/>

  <!-- irises (pupils layered by JS sit on top) -->
  <circle cx="122" cy="178" r="12" fill="url(#eye)"/>
  <circle cx="178" cy="178" r="12" fill="url(#eye)"/>
  <circle cx="127" cy="173" r="3.4" fill="#ffffff"/>
  <circle cx="183" cy="173" r="3.4" fill="#ffffff"/>

  <!-- lashes -->
  <path d="M104 168 q16 -10 34 -4" stroke="#1e2023" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M162 164 q16 -6 34 4" stroke="#1e2023" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="102" cy="200" rx="14" ry="9" fill="#c9cbcf" opacity="0.55"/>
  <ellipse cx="198" cy="200" rx="14" ry="9" fill="#c9cbcf" opacity="0.55"/>

  <!-- nose + smile -->
  <path d="M150 188 q5 10 -2 16" stroke="#c2c4c8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M128 214 q22 20 44 0" stroke="#8f9195" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
