<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doll Han Han — Han Han Nguyen</title>
  <meta name="description" content="Doll Han Han — a 3D-cartoon, single-screen portfolio for Han Han Nguyen, CS student building AI-powered apps." />
  <meta property="og:title" content="Doll Han Han | Han Han Nguyen" />
  <meta property="og:description" content="A 3D-cartoon single-screen portfolio — cursor-reactive avatar, greyscale modern-AI theme." />
  <meta property="og:url" content="https://hhanng.github.io/doll-han-han/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== one-screen stage ===== -->
  <main class="stage" id="stage">

    <!-- top-left: teaser link back to the full site -->
    <a class="view-all" href="https://hhanng.github.io" target="_blank" rel="noopener">View all 120+ projects &rarr;</a>

    <!-- top-right: other versions of this site -->
    <nav class="versions" aria-label="Other versions of this site">
      <span class="versions__label">other me &rarr;</span>
      <a class="versions__dot versions__dot--blob" href="https://hhanng.github.io/blob-han-han/" target="_blank" rel="noopener" data-tip="Blob" aria-label="Blob Han Han"></a>
      <a class="versions__dot versions__dot--claw" href="https://hhanng.github.io/claw-han-han/" target="_blank" rel="noopener" data-tip="Claw" aria-label="Claw Han Han"></a>
    </nav>

    <!-- centre: the doll (visual anchor) -->
    <!--
      SWAP-IN POINT: drop the 3D-cartoon avatar at  assets/doll.png
      (a ~5:6 crop, ideally on a white / light-grey or transparent
      background so it blends with the greyscale theme).
      Until it exists, assets/doll-placeholder.svg is shown instead.
      After adding it, tune the four --eye-* values in style.css so
      the pupils sit over the avatar's eyes.
    -->
    <div class="doll" id="doll">
      <img class="doll__img" id="dollImg" src="assets/doll.png" alt="3D cartoon avatar of Han Han Nguyen"
           onerror="this.onerror=null;this.src='assets/doll-placeholder.svg'" />
      <span class="pupil pupil--l" id="pupilL"></span>
      <span class="pupil pupil--r" id="pupilR"></span>
    </div>

    <!-- bottom-left: hero headline -->
    <section class="intro">
      <p class="intro__eyebrow">Your friendly AI builder</p>
      <h1 class="intro__name">Han Han Nguyen</h1>
      <p class="intro__text">
        CS student shipping 120+ AI-powered apps &amp; tools &mdash; plus freelance web &amp; branding.
        Dallas College &middot; GPA 3.87/4.0.
      </p>
    </section>

    <!-- bottom-right: entry points -->
    <nav class="dock" aria-label="Sections">
      <button class="dock__btn dock__btn--primary" type="button" data-modal="projects">
        <span class="dock__ico" aria-hidden="true">&#9634;</span> Projects
      </button>
      <button class="dock__btn" type="button" data-modal="contact">
        <span class="dock__ico" aria-hidden="true">&#9993;</span> Contact
      </button>
      <a class="dock__btn" href="assets/resume.pdf" target="_blank" rel="noopener" download>
        <span class="dock__ico" aria-hidden="true">&#8681;</span> Resume
      </a>
      <a class="dock__btn" href="https://github.com/hhanng" target="_blank" rel="noopener">
        <span class="dock__ico" aria-hidden="true">&#9740;</span> GitHub
      </a>
      <a class="dock__btn" href="https://www.linkedin.com/in/hanhanhazel" target="_blank" rel="noopener">
        <span class="dock__ico" aria-hidden="true">in</span> LinkedIn
      </a>
    </nav>
  </main>

  <!-- ===== modal ===== -->
  <div class="modal" id="modal" hidden>
    <div class="modal__scrim" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__x" type="button" data-close aria-label="Close">&times;</button>
      <h2 class="modal__title" id="modalTitle"></h2>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
