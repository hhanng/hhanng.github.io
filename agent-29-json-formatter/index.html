<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter & Explainer — Agent #29</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --card2: #222;
    --border: #2e2e2e;
    --accent: #b8c8e8;
    --accent-dim: rgba(184,200,232,0.12);
    --text: #e2e8f0;
    --muted: #888;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #facc15;
    --font-mono: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .badge-agent {
    font-size: 11px; font-weight: 600; letter-spacing: .05em;
    background: var(--accent-dim); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 4px;
    padding: 2px 8px;
  }
  header h1 { font-size: 18px; font-weight: 700; color: var(--text); }
  header h1 span { color: var(--accent); }

  .api-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px;
  }
  .api-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .api-row input {
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 13px; width: 260px;
    font-family: var(--font-mono);
  }
  .api-row input::placeholder { color: #555; }

  /* ── Main layout ── */
  main {
    flex: 1; display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px; padding: 16px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--accent);
  }
  .panel-header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
  }

  /* ── Toolbar ── */
  .toolbar {
    display: flex; gap: 6px; padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card2); color: var(--text);
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .btn.primary { background: var(--accent); color: #0f0f0f; border-color: var(--accent); }
  .btn.primary:hover { opacity: .85; }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .btn.danger:hover { background: rgba(248,113,113,.1); }

  /* ── Editor area ── */
  .editor-wrap {
    flex: 1; position: relative; display: flex; flex-direction: column;
    min-height: 0;
  }
  .line-number-wrap {
    flex: 1; display: flex; min-height: 0; position: relative;
  }
  .line-numbers {
    background: #151515; color: #444; font-family: var(--font-mono);
    font-size: 13px; line-height: 1.6; padding: 12px 8px 12px 12px;
    text-align: right; user-select: none; min-width: 40px;
    border-right: 1px solid var(--border); overflow: hidden;
    white-space: pre;
  }
  #jsonInput {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--font-mono); font-size: 13px;
    line-height: 1.6; padding: 12px 14px; resize: none;
    tab-size: 2; width: 100%;
  }
  #jsonInput::placeholder { color: #444; }

  /* ── Status bar ── */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px; border-top: 1px solid var(--border);
    font-size: 11px; flex-wrap: wrap; gap: 8px;
  }
  .valid-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-weight: 600; transition: color .2s;
  }
  .valid-badge.valid { color: var(--green); }
  .valid-badge.invalid { color: var(--red); }
  .valid-badge .circle { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .valid-badge.valid .circle { background: var(--green); }
  .valid-badge.invalid .circle { background: var(--red); }
  .stat-badges { display: flex; gap: 8px; color: var(--muted); }
  .stat-badge {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 7px; font-family: var(--font-mono);
  }

  /* ── Fix JSON banner ── */
  .fix-banner {
    display: none; align-items: center; justify-content: space-between;
    background: rgba(248,113,113,.08); border-top: 1px solid rgba(248,113,113,.3);
    padding: 8px 14px; gap: 10px; flex-wrap: wrap;
  }
  .fix-banner.show { display: flex; }
  .fix-banner p { font-size: 12px; color: var(--red); }

  /* ── Tabs ── */
  .tabs {
    display: flex; border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab-btn {
    padding: 10px 18px; font-size: 13px; font-weight: 500;
    color: var(--muted); background: transparent; border: none;
    cursor: pointer; border-bottom: 2px solid transparent;
    white-space: nowrap; transition: all .15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: auto; }
  .tab-content.active { display: flex; }

  /* ── Formatted tab ── */
  .formatted-wrap {
    flex: 1; position: relative; overflow: auto;
  }
  .formatted-wrap pre {
    margin: 0; padding: 14px;
    font-family: var(--font-mono); font-size: 13px; line-height: 1.6;
    white-space: pre; min-height: 100%;
  }
  .copy-btn-float {
    position: absolute; top: 10px; right: 10px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px; padding: 4px 10px;
    font-size: 11px; cursor: pointer; transition: all .15s;
  }
  .copy-btn-float:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Tree View ── */
  .tree-wrap { flex: 1; overflow: auto; padding: 14px; font-family: var(--font-mono); font-size: 13px; }
  .tree-node { padding-left: 18px; }
  .tree-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 0; cursor: default; border-radius: 4px;
    transition: background .1s;
  }
  .tree-row:hover { background: var(--accent-dim); }
  .tree-toggle {
    width: 14px; height: 14px; display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; color: var(--accent);
    font-size: 10px; flex-shrink: 0; transition: transform .15s;
  }
  .tree-toggle.expanded { transform: rotate(90deg); }
  .tree-key { color: var(--accent); }
  .tree-colon { color: var(--muted); }
  .type-badge {
    font-size: 9px; font-weight: 700; letter-spacing: .04em;
    border-radius: 3px; padding: 1px 5px; flex-shrink: 0;
  }
  .type-string { background: rgba(74,222,128,.15); color: #4ade80; }
  .type-number { background: rgba(251,191,36,.15); color: #fbbf24; }
  .type-boolean { background: rgba(167,139,250,.15); color: #a78bfa; }
  .type-null { background: rgba(156,163,175,.15); color: #9ca3af; }
  .type-object { background: rgba(184,200,232,.15); color: var(--accent); }
  .type-array { background: rgba(251,146,60,.15); color: #fb923c; }
  .tree-val { color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-children { overflow: hidden; transition: all .15s; }
  .tree-children.collapsed { display: none; }

  /* ── Explained tab ── */
  .explain-area { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .explain-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .explain-summary {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; line-height: 1.6;
    font-size: 14px;
  }
  .explain-summary .api-guess {
    margin-top: 8px; font-size: 12px; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
  }
  .fields-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .fields-table th {
    text-align: left; padding: 8px 10px; color: var(--muted);
    border-bottom: 1px solid var(--border); font-weight: 500;
    white-space: nowrap;
  }
  .fields-table td { padding: 7px 10px; border-bottom: 1px solid #1e1e1e; vertical-align: top; }
  .fields-table tr:last-child td { border-bottom: none; }
  .fields-table .field-name { color: var(--accent); font-family: var(--font-mono); }
  .fields-table .field-example { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }

  .access-row {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .access-row input {
    flex: 1; min-width: 140px; background: var(--card2);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: var(--font-mono); font-size: 13px;
    padding: 6px 10px; outline: none;
  }
  .access-row input:focus { border-color: var(--accent); }
  .access-code-out {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    font-family: var(--font-mono); font-size: 13px;
    color: var(--green); white-space: pre-wrap; display: none;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
  }

  /* ── Schema tab ── */
  .schema-wrap { flex: 1; position: relative; overflow: auto; }
  .schema-wrap pre { margin: 0; padding: 14px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; white-space: pre; }

  /* ── History ── */
  .history-bar {
    background: var(--card); border-top: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .history-bar .hist-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .hist-chip {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 10px; font-size: 11px;
    cursor: pointer; color: var(--muted); transition: all .15s;
    max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hist-chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Loading spinner ── */
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Placeholder states ── */
  .placeholder-msg {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; color: var(--muted); padding: 40px;
    text-align: center;
  }
  .placeholder-msg svg { opacity: .3; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header>
  <div class="header-left">
    <span class="badge-agent">Agent #29</span>
    <h1>JSON Formatter &amp; <span>Explainer</span></h1>
  </div>
  <div class="api-row">
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
  </div>
</header>

<!-- ═══ MAIN ═══ -->
<main>

  <!-- ── LEFT PANEL ── -->
  <div class="panel">
    <div class="panel-header"><div class="dot"></div> Input JSON</div>

    <div class="toolbar">
      <button class="btn primary" onclick="formatJSON()" title="Ctrl+Enter">⚡ Format</button>
      <button class="btn" onclick="minifyJSON()">Minify</button>
      <button class="btn" onclick="loadSample()">Sample JSON</button>
      <button class="btn danger" onclick="clearInput()">Clear</button>
    </div>

    <div class="editor-wrap">
      <div class="line-number-wrap">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="jsonInput" placeholder="Paste your JSON here…" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="status-bar">
      <div class="valid-badge" id="validBadge">
        <div class="circle"></div>
        <span id="validText">Waiting for input…</span>
      </div>
      <div class="stat-badges">
        <span class="stat-badge" id="charCount">0 chars</span>
        <span class="stat-badge" id="keyCount">0 keys</span>
      </div>
    </div>

    <div class="fix-banner" id="fixBanner">
      <p>⚠ JSON has errors — let Gemini repair it?</p>
      <button class="btn danger" onclick="fixJSON()" id="fixBtn">Fix my JSON</button>
    </div>
  </div>

  <!-- ── RIGHT PANEL ── -->
  <div class="panel">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('formatted', this)">Formatted</button>
      <button class="tab-btn" onclick="switchTab('tree', this)">Tree View</button>
      <button class="tab-btn" onclick="switchTab('explained', this)">Explained</button>
      <button class="tab-btn" onclick="switchTab('schema', this)">Schema</button>
    </div>

    <!-- Tab: Formatted -->
    <div class="tab-content active" id="tab-formatted">
      <div class="formatted-wrap">
        <pre id="formattedOutput"><code id="formattedCode" class="language-json"></code></pre>
        <button class="copy-btn-float" onclick="copyFormatted()">Copy</button>
      </div>
    </div>

    <!-- Tab: Tree View -->
    <div class="tab-content" id="tab-tree">
      <div class="tree-wrap" id="treeOutput">
        <div class="placeholder-msg">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          <p>Paste valid JSON to see the tree</p>
        </div>
      </div>
    </div>

    <!-- Tab: Explained -->
    <div class="tab-content" id="tab-explained">
      <div class="explain-area" id="explainArea">
        <div class="explain-header">
          <button class="btn primary" onclick="explainJSON()" id="explainBtn">✦ Explain this JSON</button>
          <span id="explainStatus"></span>
        </div>
        <div id="explainOutput">
          <div class="placeholder-msg">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
            <p>Click "Explain this JSON" to get an AI-powered field-by-field breakdown</p>
          </div>
        </div>

        <div>
          <div class="section-label">Access a field</div>
          <div class="access-row">
            <input type="text" id="fieldInput" placeholder="e.g. user.address.city" onkeydown="if(event.key==='Enter') getAccessCode()">
            <button class="btn" onclick="getAccessCode()" id="accessBtn">Get Code</button>
          </div>
          <div class="access-code-out" id="accessCodeOut"></div>
        </div>
      </div>
    </div>

    <!-- Tab: Schema -->
    <div class="tab-content" id="tab-schema">
      <div class="schema-wrap">
        <pre id="schemaOutput"><code id="schemaCode" class="language-json"></code></pre>
        <button class="copy-btn-float" onclick="copySchema()">Copy schema</button>
      </div>
    </div>
  </div>

</main>

<!-- ═══ HISTORY ═══ -->
<div class="history-bar" id="historyBar">
  <span class="hist-label">History</span>
  <span id="histChips" style="display:flex;gap:8px;flex-wrap:wrap;"></span>
</div>

<script>
// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let currentJSON = null;
let validJSON = false;

const $input  = document.getElementById('jsonInput');
const $lines  = document.getElementById('lineNumbers');
const $badge  = document.getElementById('validBadge');
const $badgeT = document.getElementById('validText');
const $chars  = document.getElementById('charCount');
const $keys   = document.getElementById('keyCount');
const $fix    = document.getElementById('fixBanner');
const $apiKey = document.getElementById('apiKey');

// ── Restore API key ──
$apiKey.value = localStorage.getItem('gemini_api_key') || '';
$apiKey.addEventListener('input', () => localStorage.setItem('gemini_api_key', $apiKey.value.trim()));

// ═══════════════════════════════════════════════
//  LINE NUMBERS + SYNC
// ═══════════════════════════════════════════════
function updateLineNumbers() {
  const lines = $input.value.split('\n').length;
  $lines.textContent = Array.from({length: lines}, (_, i) => i + 1).join('\n');
}

$input.addEventListener('scroll', () => {
  $lines.scrollTop = $input.scrollTop;
});

// ═══════════════════════════════════════════════
//  LIVE VALIDATION
// ═══════════════════════════════════════════════
function countKeys(obj) {
  if (typeof obj !== 'object' || obj === null) return 0;
  let n = 0;
  for (const k in obj) {
    n++;
    if (typeof obj[k] === 'object' && obj[k] !== null) n += countKeys(obj[k]);
  }
  return n;
}

function validate(raw) {
  if (!raw.trim()) {
    $badge.className = 'valid-badge';
    $badgeT.textContent = 'Waiting for input…';
    $chars.textContent = '0 chars';
    $keys.textContent = '0 keys';
    $fix.classList.remove('show');
    currentJSON = null; validJSON = false;
    return;
  }
  try {
    const parsed = JSON.parse(raw);
    currentJSON = parsed;
    validJSON = true;
    $badge.className = 'valid-badge valid';
    $badgeT.textContent = 'Valid JSON';
    $chars.textContent = raw.length.toLocaleString() + ' chars';
    $keys.textContent = countKeys(parsed).toLocaleString() + ' keys';
    $fix.classList.remove('show');
    updateRightPanels(parsed, raw);
  } catch(e) {
    currentJSON = null; validJSON = false;
    const msg = e.message;
    $badge.className = 'valid-badge invalid';
    $badgeT.textContent = 'Invalid — ' + msg;
    $chars.textContent = raw.length.toLocaleString() + ' chars';
    $keys.textContent = '— keys';
    $fix.classList.add('show');
    clearRightPanels();
  }
}

$input.addEventListener('input', () => {
  updateLineNumbers();
  validate($input.value);
});

function updateRightPanels(parsed, raw) {
  // Formatted
  const pretty = JSON.stringify(parsed, null, 2);
  const codeEl = document.getElementById('formattedCode');
  codeEl.textContent = pretty;
  hljs.highlightElement(codeEl);

  // Tree
  const treeWrap = document.getElementById('treeOutput');
  treeWrap.innerHTML = '';
  treeWrap.appendChild(buildTree(parsed, null));

  // Schema
  const schema = generateSchema(parsed);
  const schemaStr = JSON.stringify(schema, null, 2);
  const schemaEl = document.getElementById('schemaCode');
  schemaEl.textContent = schemaStr;
  hljs.highlightElement(schemaEl);
}

function clearRightPanels() {
  document.getElementById('formattedCode').textContent = '';
  document.getElementById('treeOutput').innerHTML = '<div class="placeholder-msg"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg><p>Paste valid JSON to see the tree</p></div>';
  document.getElementById('schemaCode').textContent = '';
}

// ═══════════════════════════════════════════════
//  TOOLBAR ACTIONS
// ═══════════════════════════════════════════════
function formatJSON() {
  if (!validJSON) { shake($input); return; }
  const pretty = JSON.stringify(currentJSON, null, 2);
  $input.value = pretty;
  updateLineNumbers();
  validate(pretty);
  saveHistory(pretty);
}

function minifyJSON() {
  if (!validJSON) { shake($input); return; }
  const mini = JSON.stringify(currentJSON);
  $input.value = mini;
  updateLineNumbers();
  validate(mini);
}

function clearInput() {
  $input.value = '';
  updateLineNumbers();
  validate('');
  document.getElementById('explainOutput').innerHTML = '<div class="placeholder-msg"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><p>Click "Explain this JSON" to get an AI-powered field-by-field breakdown</p></div>';
  document.getElementById('accessCodeOut').style.display = 'none';
}

function loadSample() {
  const sample = {
    "id": "usr_8f3kq92",
    "object": "user",
    "created_at": 1715900000,
    "email": "jane.doe@example.com",
    "name": "Jane Doe",
    "avatar_url": "https://cdn.example.com/avatars/usr_8f3kq92.jpg",
    "plan": {
      "type": "pro",
      "status": "active",
      "renews_at": "2026-06-01",
      "seats": 5,
      "features": ["api_access", "priority_support", "sso"]
    },
    "metadata": {
      "signup_source": "organic",
      "country": "US",
      "locale": "en-US"
    },
    "stats": {

// ═══════════════════════════════════════════════
//  TREE VIEW
// ═══════════════════════════════════════════════
function getType(v) {
  if (v === null) return 'null';
  if (Array.isArray(v)) return 'array';
  return typeof v;
}

function truncate(s, n=40) {
  const str = String(s);
  return str.length > n ? str.slice(0,n) + '…' : str;
}

function buildTree(data, key) {
  const type = getType(data);
  const wrap = document.createElement('div');
  wrap.className = 'tree-node';

  const row = document.createElement('div');
  row.className = 'tree-row';

  const toggle = document.createElement('span');
  toggle.className = 'tree-toggle';

  const keySpan = document.createElement('span');
  keySpan.className = 'tree-key';
  if (key !== null) keySpan.textContent = JSON.stringify(key);

  const colon = document.createElement('span');
  colon.className = 'tree-colon';
  if (key !== null) colon.textContent = ': ';

  const typeBadge = document.createElement('span');
  typeBadge.className = 'type-badge type-' + type;
  typeBadge.textContent = type;

  const valSpan = document.createElement('span');
  valSpan.className = 'tree-val';

  if (type === 'object' || type === 'array') {
    const keys = type === 'array' ? data.length : Object.keys(data).length;
    toggle.textContent = '▶';
    toggle.classList.add('expanded');
    valSpan.textContent = type === 'array' ? `[${keys} items]` : `{${keys} keys}`;

    const children = document.createElement('div');
    children.className = 'tree-children';

    if (type === 'array') {
      data.forEach((item, i) => children.appendChild(buildTree(item, i)));
    } else {
      Object.entries(data).forEach(([k, v]) => children.appendChild(buildTree(v, k)));
    }

    toggle.addEventListener('click', () => {
      const collapsed = children.classList.toggle('collapsed');
      toggle.classList.toggle('expanded', !collapsed);
    });

    row.append(toggle, keySpan, colon, typeBadge, valSpan);
    wrap.append(row, children);
  } else {
    toggle.style.visibility = 'hidden';
    toggle.textContent = '▶';
    let preview = '';
    if (type === 'string') preview = '"' + truncate(data) + '"';
    else if (type === 'null') preview = 'null';
    else preview = truncate(String(data));
    valSpan.textContent = preview;
    row.append(toggle, keySpan, colon, typeBadge, valSpan);
    wrap.append(row);
  }

  return wrap;
}

// ═══════════════════════════════════════════════
//  JSON SCHEMA GENERATOR
// ═══════════════════════════════════════════════
function generateSchema(data, title) {
  const type = getType(data);
  if (type === 'null') return { type: 'null' };
  if (type === 'boolean') return { type: 'boolean' };
  if (type === 'number') return Number.isInteger(data) ? { type: 'integer' } : { type: 'number' };
  if (type === 'string') return { type: 'string' };
  if (type === 'array') {
    const schema = { type: 'array' };
    if (data.length > 0) schema.items = generateSchema(data[0]);
    return schema;
  }
  if (type === 'object') {
    const schema = { type: 'object', properties: {}, required: [] };
    for (const [k, v] of Object.entries(data)) {
      schema.properties[k] = generateSchema(v);
      schema.required.push(k);
    }
    if (title) schema.title = title;
    return schema;
  }
}

function toast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  Object.assign(el.style, {
    position: 'fixed', bottom: '24px', left: '50%', transform: 'translateX(-50%)',
    background: '#333', color: '#fff', padding: '8px 20px', borderRadius: '8px',
    fontSize: '13px', zIndex: 9999, pointerEvents: 'none',
    animation: 'fadeInUp .2s ease'
  });
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

// ═══════════════════════════════════════════════
//  GEMINI API
// ═══════════════════════════════════════════════
async function callGemini(prompt) {
  const key = $apiKey.value.trim();
  if (!key) throw new Error('Please enter your Gemini API key above.');
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API error ${res.status}`);
  }
  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

function parseGeminiJSON(raw) {
  const cleaned = raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
  return JSON.parse(cleaned);
}

// ── Explain ──
async function explainJSON() {
  if (!validJSON) { alert('Please enter valid JSON first.'); return; }
  const btn = document.getElementById('explainBtn');
  const status = document.getElementById('explainStatus');
  const out = document.getElementById('explainOutput');

  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span>';
  out.innerHTML = '<div class="placeholder-msg"><span class="spinner"></span><p>Asking Gemini…</p></div>';

  try {
    const json = JSON.stringify(currentJSON, null, 2);
    const prompt = `Explain this JSON in plain English. Describe what it likely represents, then explain each field.

JSON:
${json}

Return JSON:
{
  "summary": "Plain English summary of what this JSON represents (2-3 sentences)",
  "apiGuess": "What API or service this likely comes from, or 'Unknown'",
  "fields": [
    { "field": "field.name.path", "type": "string", "meaning": "What this field represents", "example": "example value" }
  ]
}
Return only JSON, no markdown.`;

    const raw = await callGemini(prompt);
    const result = parseGeminiJSON(raw);
    renderExplain(result);
    status.innerHTML = '<span style="color:var(--green);font-size:12px">✓ Done</span>';
  } catch(e) {
    out.innerHTML = `<div class="explain-summary" style="color:var(--red)">Error: ${e.message}</div>`;
    status.innerHTML = '';
  }
  btn.disabled = false;
}

function renderExplain(r) {
  const out = document.getElementById('explainOutput');
  let rows = '';
  (r.fields || []).forEach(f => {
    rows += `<tr>
      <td class="field-name">${escHtml(f.field)}</td>
      <td><span class="type-badge type-${f.type}">${escHtml(f.type)}</span></td>
      <td>${escHtml(f.meaning)}</td>
      <td class="field-example">${escHtml(String(f.example ?? ''))}</td>
    </tr>`;
  });
  out.innerHTML = `
    <div class="explain-summary">
      <p>${escHtml(r.summary || '')}</p>
      ${r.apiGuess ? `<div class="api-guess">🔌 Likely from: <strong>${escHtml(r.apiGuess)}</strong></div>` : ''}
    </div>
    ${rows ? `
    <div>
      <div class="section-label">Field Breakdown</div>
      <table class="fields-table">
        <thead><tr><th>Field</th><th>Type</th><th>Meaning</th><th>Example</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>` : ''}
  `;
}

// ── Access code ──
async function getAccessCode() {
  const fieldName = document.getElementById('fieldInput').value.trim();
  if (!fieldName) return;
  if (!validJSON) { alert('Please enter valid JSON first.'); return; }

  const btn = document.getElementById('accessBtn');
  const out = document.getElementById('accessCodeOut');
  btn.disabled = true;
  out.style.display = 'none';

  try {
    const json = JSON.stringify(currentJSON, null, 2).slice(0, 2000);
    const prompt = `Given this JSON structure, write JavaScript code to access the field '${fieldName}'.
JSON: ${json}
Return JSON: { "code": "const value = data.field.name" }`;

    const raw = await callGemini(prompt);
    const result = parseGeminiJSON(raw);
    out.textContent = result.code || '// Could not generate code';
    out.style.display = 'block';
  } catch(e) {
    out.textContent = '// Error: ' + e.message;
    out.style.display = 'block';
  }
  btn.disabled = false;
}

// ── Fix JSON ──
async function fixJSON() {
  const btn = document.getElementById('fixBtn');
  btn.disabled = true;
  btn.textContent = 'Fixing…';

  try {
    const brokenJson = $input.value;
    const prompt = `This JSON has a syntax error. Fix it and return only the corrected valid JSON, nothing else.
Broken JSON: ${brokenJson}`;

    const raw = await callGemini(prompt);
    const cleaned = raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    // validate it worked
    JSON.parse(cleaned);
    $input.value = cleaned;
    updateLineNumbers();
    validate(cleaned);
    formatJSON();
    saveHistory(cleaned);
    toast('JSON fixed!');
  } catch(e) {
    toast('Could not fix: ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Fix my JSON';
}

// ═══════════════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════════════
function saveHistory(json) {
  let hist = JSON.parse(localStorage.getItem('json_history') || '[]');
  const entry = { ts: Date.now(), preview: json.slice(0, 80).replace(/\s+/g,' '), raw: json };
  hist = [entry, ...hist.filter(h => h.raw !== json)].slice(0, 5);
  localStorage.setItem('json_history', JSON.stringify(hist));
  renderHistory();
}

function renderHistory() {
  const hist = JSON.parse(localStorage.getItem('json_history') || '[]');
  const chips = document.getElementById('histChips');
  chips.innerHTML = '';
  hist.forEach(h => {
    const chip = document.createElement('div');
    chip.className = 'hist-chip';
    chip.title = new Date(h.ts).toLocaleString();
    chip.textContent = h.preview + (h.preview.length >= 80 ? '…' : '');
    chip.onclick = () => {
      $input.value = h.raw;
      updateLineNumbers();
      validate(h.raw);
    };
    chips.appendChild(chip);
  });
}

renderHistory();

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
