<body>
<header>
  <span class="badge">#94</span>
  <h1>🔐 Cybersecurity Basics Trainer</h1>
  <span>Learn to think like a hacker. Defend like an engineer.</span>
</header>
<div class="tabs">
  <button class="tab active" onclick="showTab('challenges',this)">CHALLENGES</button>

  <button class="tab" onclick="showTab('tools',this)">TOOLS</button>

<!-- CHALLENGES -->
<div id="tab-challenges" class="content active">
  <div class="score-bar">
    <div><div class="score-num" id="score-display">0</div><div class="score-label">Points</div></div>

</div>

</div>

  </div>

</div>

<script>
const LS='cyber94_';
const get=k=>JSON.parse(localStorage.getItem(LS+k)||'null');
const set=(k,v)=>localStorage.setItem(LS+k,JSON.stringify(v));
let scores=get('scores')||{};
let interviewStatus=get('interviewStatus')||{};

function showTab(id,btn){
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  if(btn)btn.classList.add('active');
}

// ─── CHALLENGES ──────────────────────────────────────────────────────────
const MAX_SCORE=200;

function updateScoreDisplay(){
  const total=Object.values(scores).reduce((a,b)=>a+b,0);
  const completed=Object.keys(scores).length;
  document.getElementById('score-display').textContent=total;
  document.getElementById('score-fill').style.width=Math.min(total/MAX_SCORE*100,100)+'%';
  document.getElementById('progress-display').textContent=`${completed} / 10 completed`;
}

function awardPoints(id,pts){
  if(!scores[id]){scores[id]=pts;set('scores',scores);updateScoreDisplay();}
}

// Challenge 1: Caesar Cipher
function initCaesar(){
  const msg='KHOOR ZRUOG'; // "HELLO WORLD" shifted 3
  const div=document.getElementById('caesar-body');
  if(!div)return;
  div.innerHTML=`<div style="font-family:monospace;background:#040e04;border:1px solid #1a3d1a;padding:10px;border-radius:6px;margin-bottom:10px;color:#4ade80;font-size:1.1rem">Encrypted: ${msg}</div>
    <label>Shift: <span id="caesar-shift-val">1</span></label>
    <input type="range" min="1" max="25" value="1" id="caesar-slider" oninput="updateCaesar()">
    <div style="margin-top:8px;font-family:monospace;font-size:.9rem;color:#e2e8f0" id="caesar-decoded"></div>
    <button class="btn btn-green btn-sm" style="margin-top:8px" onclick="checkCaesar()">Check Answer</button>
    <div class="result-reveal" id="caesar-result"></div>`;
  updateCaesar();
}

function updateCaesar(){
  const shift=+document.getElementById('caesar-slider').value;
  document.getElementById('caesar-shift-val').textContent=shift;
  const msg='KHOOR ZRUOG';
  const decoded=msg.split('').map(c=>{
    if(c===' ')return ' ';
    const code=c.charCodeAt(0)-65;
    return String.fromCharCode(((code-shift+26)%26)+65);
  }).join('');
  document.getElementById('caesar-decoded').textContent='Decoded: '+decoded;
}

function checkCaesar(){
  const shift=+document.getElementById('caesar-slider').value;
  const r=document.getElementById('caesar-result');
  r.style.display='block';
  if(shift===3){r.style.borderColor='#22c55e';r.innerHTML='✅ Correct! Shift of 3 → "HELLO WORLD". Caesar cipher was used by Julius Caesar to encode military messages. Still seen in ROT13 (shift 13) in modern contexts. Always try every shift 1-25.';awardPoints('caesar',20);}
  else{r.style.borderColor='#ef4444';r.innerHTML=`❌ Not quite. Try shift 3. Hint: 'K' decoded with shift 3 = 'H'`;}
}

// Challenge 2: Hash Identifier
function identifyHash(){
  const input=document.getElementById('hash-input').value.trim();
  const r=document.getElementById('hash-result');
  if(!input){r.textContent='Enter a hash value above';return;}
  let type='Unknown', info='';
  if(/^[a-f0-9]{32}$/i.test(input)){type='MD5';info='32 hex chars. Fast but broken — never use for passwords. Collision attacks demonstrated.';}
  else if(/^[a-f0-9]{40}$/i.test(input)){type='SHA-1';info='40 hex chars. Also broken for security purposes. Google demonstrated SHA-1 collision (2017).';}
  else if(/^[a-f0-9]{64}$/i.test(input)){type='SHA-256';info='64 hex chars. Still secure for most purposes. Part of SHA-2 family. Used in Bitcoin, TLS certificates.';}
  else if(/^\$2[ab]\$/.test(input)){type='bcrypt';info='Starts with $2b$ or $2a$. Adaptive hash — designed slow. Work factor (cost parameter) in the string. Gold standard for passwords.';}
  else if(/^[a-f0-9]{128}$/i.test(input)){type='SHA-512';info='128 hex chars. Strongest SHA-2 variant. Used for high-security applications.';}
  else if(/^\$argon2/.test(input)){type='Argon2';info='Winner of Password Hashing Competition 2015. Memory-hard — GPU cracking resistant. Current best practice for passwords.';}
  r.style.display='block';
  r.style.borderColor=type!=='Unknown'?'#22c55e':'#ef4444';
  r.innerHTML=`<strong style="color:${type!=='Unknown'?'#22c55e':'#ef4444'}">${type}</strong><br/>${info}`;
  if(type!=='Unknown')awardPoints('hash',15);
}

// Challenge 3: SQL Injection Spotter
const SQL_SNIPPETS=[
  {code:`# VULNERABLE
query = "SELECT * FROM users WHERE username='"+username+"' AND password='"+password+"'"
db.execute(query)`,vuln:true,why:"String concatenation directly into SQL. Attacker inputs: ' OR '1'='1 — bypasses auth entirely."},
  {code:`# SAFE
cursor.execute("SELECT * FROM users WHERE username=? AND password=?", (username, password))`,vuln:false,why:"Parameterized query. ? placeholders are never interpreted as SQL — user input is data, not code."},
  {code:`# VULNERABLE
$id = $_GET['id'];
$query = "SELECT * FROM products WHERE id = $id";`,vuln:true,why:"PHP: user-controlled $id injected directly. Input '1 OR 1=1' dumps entire table."},
  {code:`# SAFE
const query = 'SELECT * FROM orders WHERE user_id = $1';
await db.query(query, [userId]);`,vuln:false,why:"Node.js with pg library. Parameterized. $1 is a placeholder bound to userId — injection impossible."},
  {code:`# VULNERABLE
search = request.args.get('q')
results = db.execute(f"SELECT * FROM posts WHERE title LIKE '%{search}%'")`,vuln:true,why:"Python f-string directly in SQL. Input: '; DROP TABLE posts;-- deletes the table."},
];

function initSQLSnippets(){
  const div=document.getElementById('sql-body');
  if(!div)return;
  div.innerHTML=SQL_SNIPPETS.map((s,i)=>`
    <div style="margin-bottom:12px">
      <div class="code-snippet">${s.code.replace(/</g,'&lt;')}</div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn btn-sm" style="background:rgba(239,68,68,.15);color:#ef4444;border:1px solid #ef4444" onclick="checkSQL(${i},'vuln')">Vulnerable</button>
        <button class="btn btn-sm" style="background:rgba(34,197,94,.15);color:#22c55e;border:1px solid #22c55e" onclick="checkSQL(${i},'safe')">Safe</button>
        <span id="sql-ans-${i}"></span>
      </div>
      <div class="result-reveal" id="sql-reveal-${i}"></div>
    </div>`).join('');
}

function checkSQL(i,ans){
  const correct=SQL_SNIPPETS[i].vuln?(ans==='vuln'):(ans==='safe');
  document.getElementById('sql-ans-'+i).innerHTML=correct?'<span style="color:#22c55e">✓</span>':'<span style="color:#ef4444">✗</span>';
  const r=document.getElementById('sql-reveal-'+i);
  r.style.display='block';
  r.style.borderColor=correct?'#22c55e':'#ef4444';
  r.innerHTML=(SQL_SNIPPETS[i].vuln?'<strong style="color:#ef4444">⚠️ VULNERABLE</strong>':'<strong style="color:#22c55e">✅ SAFE</strong>')+': '+SQL_SNIPPETS[i].why;
  if(correct)awardPoints('sql_'+i,5);
}

// Challenge 4: Password Strength
function analyzePassword(){
  const pwd=document.getElementById('pwd-input').value;
  const r=document.getElementById('pwd-result');
  if(!pwd){r.style.display='none';return;}
  let score=0,issues=[],strength='';
  if(pwd.length>=8)score+=1;else issues.push('Too short (min 8 chars)');
  if(pwd.length>=12)score+=1;
  if(pwd.length>=16)score+=1;
  if(/[a-z]/.test(pwd)&&/[A-Z]/.test(pwd))score+=1;else issues.push('Mix upper and lowercase letters');
  if(/[0-9]/.test(pwd))score+=1;else issues.push('Add numbers');
  if(/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(pwd))score+=1;else issues.push('Add special characters (!@#$...)');
  if(!/^[a-zA-Z]+$/.test(pwd)&&!/^[0-9]+$/.test(pwd))score+=1;
  const commonWords=['password','123456','qwerty','admin','letmein','monkey','dragon','master'];
  if(commonWords.some(w=>pwd.toLowerCase().includes(w))){score=Math.max(0,score-2);issues.push('Contains common pattern/word');}
  const entropy=pwd.length*Math.log2([26,52,62,94][score>=3?3:score>=2?2:score>=1?1:0]);
  const crack=entropy<30?'< 1 second':entropy<50?'minutes–hours':entropy<70?'years':entropy<90?'centuries':'billions of years';
  const strengthMap=['Very Weak','Weak','Fair','Good','Strong','Very Strong','Excellent'];
  const colorMap=['#ef4444','#f97316','#fbbf24','#fbbf24','#22c55e','#22c55e','#22c55e'];
  strength=strengthMap[Math.min(score,6)];
  r.style.display='block';
  r.style.borderColor=colorMap[Math.min(score,6)];
  r.innerHTML=`<div style="display:flex;gap:16px;align-items:center;margin-bottom:8px;font-family:sans-serif">
    <div style="font-size:1.2rem;font-weight:700;color:${colorMap[Math.min(score,6)]}">${strength}</div>
    <div style="font-size:.78rem;color:#9ca3af">Entropy: ~${entropy.toFixed(0)} bits · Est. crack time: <strong>${crack}</strong></div>
  </div>
  ${issues.length?`<div style="font-size:.78rem;color:#fbbf24">Issues:<br/>${issues.map(i=>'• '+i).join('<br/>')}</div>`:'<div style="font-size:.78rem;color:#22c55e">✓ Strong password — no major issues found</div>'}`;
  if(score>=4)awardPoints('password',20);
}

// Challenge 5: Base64 Tool
function encodeB64(){
  try{document.getElementById('b64-output').value=btoa(document.getElementById('b64-input').value);awardPoints('base64',10);}
  catch(e){document.getElementById('b64-output').value='Error: '+e.message;}
}
function decodeB64(){
  try{document.getElementById('b64-output').value=atob(document.getElementById('b64-input').value);awardPoints('base64',10);}
  catch(e){document.getElementById('b64-output').value='Error: Invalid base64';}
}

// Challenge 6: Binary/Hex converter
function convertText(){
  const txt=document.getElementById('conv-input').value;
  if(!txt)return;
  const hex=Array.from(txt).map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join(' ');
  const bin=Array.from(txt).map(c=>c.charCodeAt(0).toString(2).padStart(8,'0')).join(' ');
  const ascii=Array.from(txt).map(c=>c.charCodeAt(0)).join(', ');
  document.getElementById('conv-hex').textContent=hex;
  document.getElementById('conv-bin').textContent=bin;
  document.getElementById('conv-ascii').textContent=ascii;
  awardPoints('converter',10);
}

function renderChallenges(){
  document.getElementById('challenges-list').innerHTML=`
  <div class="challenge-card">
    <h4><span>1. Caesar Cipher Decoder</span><span class="diff-badge diff-easy">Easy</span><span class="pts-badge">20 pts</span>${scores.caesar?'<span style="color:#22c55e;font-size:.75rem;font-family:sans-serif">✓ Completed</span>':''}</h4>
    <p style="font-size:.8rem;color:#9ca3af;margin-bottom:10px;font-family:sans-serif">Decode the encrypted message. Adjust the shift slider until it makes sense.</p>
    <div id="caesar-body"></div>
  </div>

  <div class="challenge-card">
    <h4><span>2. Hash Identifier</span><span class="diff-badge diff-easy">Easy</span><span class="pts-badge">15 pts</span>${scores.hash?'<span style="color:#22c55e;font-size:.75rem;font-family:sans-serif">✓ Completed</span>':''}</h4>
    <p style="font-size:.8rem;color:#9ca3af;margin-bottom:10px;font-family:sans-serif">Paste a hash string — the tool identifies the type and security status.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('hash-input').value='5f4dcc3b5aa765d61d8327deb882cf99';identifyHash()">Try MD5</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('hash-input').value='e10adc3949ba59abbe56e057f20f883e';identifyHash()">Try MD5 (2)</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('hash-input').value='$2b$12$EixZaYVK1fsbw1ZfbX3OXePaWxn96p36WQoeG6Lruj3vjPGga31lW';identifyHash()">Try bcrypt</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('hash-input').value='a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3';identifyHash()">Try SHA-256</button>
    </div>
    <input id="hash-input" placeholder="Paste a hash string here..." oninput="identifyHash()">
    <div class="result-reveal show" id="hash-result" style="margin-top:8px">Enter a hash above to identify it</div>
  </div>

  <div class="challenge-card">
    <h4><span>3. SQL Injection Spotter</span><span class="diff-badge diff-med">Medium</span><span class="pts-badge">25 pts</span></h4>
    <p style="font-size:.8rem;color:#9ca3af;margin-bottom:10px;font-family:sans-serif">Identify which code snippets are vulnerable to SQL injection. Click Vulnerable or Safe for each.</p>
    <div id="sql-body"></div>
  </div>

  <div class="challenge-card">
    <h4><span>4. Password Strength Analyzer</span><span class="diff-badge diff-easy">Easy</span><span class="pts-badge">20 pts</span></h4>
    <p style="font-size:.8rem;color:#9ca3af;margin-bottom:10px;font-family:sans-serif">Type a password — see entropy, crack time estimate, and specific weaknesses.</p>
    <input id="pwd-input" type="password" placeholder="Type a password..." oninput="analyzePassword()">
    <div class="result-reveal" id="pwd-result" style="margin-top:8px"></div>

// ─── INTERVIEW ───────────────────────────────────────────────────────────
const INTERVIEW_QA=[
  ['What is the difference between symmetric and asymmetric encryption?','Symmetric: same key to encrypt and decrypt (AES, DES). Fast, used for bulk data. Key distribution problem. Asymmetric: public/private key pair (RSA, ECC). Public key encrypts, private key decrypts. Slower, used for key exchange and digital signatures. TLS uses asymmetric to exchange symmetric keys.'],
  ['Explain how TLS handshake works.','1. Client Hello: client sends supported cipher suites + random number. 2. Server Hello: server picks cipher, sends certificate (public key). 3. Client verifies cert against CA. 4. Key exchange (RSA or DH): establish shared session key. 5. Both sides confirm with Finished message. 6. Symmetric encryption (AES) used for session data.'],
  ['What is CSRF and how do you prevent it?','Cross-Site Request Forgery: attacker tricks a browser into making authenticated requests to a target site. The browser automatically sends cookies. Prevention: CSRF tokens (unique per session, verified server-side), SameSite cookie attribute (Strict/Lax), check Origin/Referer headers, require re-authentication for sensitive actions.'],
  ['How does SQL injection work? Show a mitigation.','Untrusted input is interpreted as SQL. Example: WHERE username=\''+username+'\' — input: \' OR \'1\'=\'1 makes it always true. Mitigation: parameterized queries (prepared statements) — user input is always treated as data, never as SQL code. Also: ORM, input validation, least privilege DB user.'],
  ['What\'s the difference between authentication and authorization?','Authentication (AuthN): verify who you are. Identity verification via password, biometric, MFA. Authorization (AuthZ): verify what you\'re allowed to do. Role/permission checks after authentication. Example: logging in = authentication. Accessing /admin = authorization check. JWT contains both: identity claims (AuthN) + role claims (AuthZ).'],
  ['Explain the principle of least privilege.','Give users/processes only the minimum permissions needed to do their job. Examples: DB user can only SELECT/INSERT, not DROP. AWS IAM: only allow specific S3 bucket actions. Process runs as non-root. Reduces blast radius of a breach — compromised account has limited damage potential.'],
  ['What is a buffer overflow? How is it exploited?','When a program writes more data to a buffer than it can hold, overwriting adjacent memory. Attacker can overwrite the return address on the stack to redirect execution to shellcode. Mitigations: ASLR (randomize memory layout), DEP/NX (no-execute bit), stack canaries, bounds checking, use memory-safe languages (Rust, Go).'],
  ['What is a man-in-the-middle attack?','Attacker intercepts communication between two parties. They can read, modify, and inject messages. Examples: ARP spoofing on local network, rogue Wi-Fi hotspots. Prevention: end-to-end encryption (TLS), certificate pinning, mutual TLS (mTLS), HTTPS Strict Transport Security (HSTS).'],
  ['How does HTTPS work?','HTTP + TLS. TLS provides: confidentiality (encryption), integrity (MAC prevents tampering), authentication (certificates verify server identity). Certificate: signed by trusted CA, contains server\'s public key. Browser has root CA store. Chain of trust: root CA → intermediate CA → server cert. HTTPS makes MITM and packet sniffing ineffective.'],
  ['What is XSS and how do you prevent it?','Cross-Site Scripting: inject malicious scripts into pages viewed by other users. Reflected XSS: malicious script in URL, reflected in response. Stored XSS: script saved in database, executed when displayed. Prevention: encode output (htmlspecialchars), Content Security Policy (CSP) header, HttpOnly cookies, validate/sanitize input.'],
  ['What is CORS and why does it exist?','Cross-Origin Resource Sharing: browser security feature blocking cross-origin requests by default (Same-Origin Policy). Server can allow specific origins via Access-Control-Allow-Origin header. Misconfigured CORS (wildcard *) can expose APIs. CORS is enforced by browsers, not servers — server-to-server requests bypass it.'],
  ['What are JWT security best practices?','Sign with strong algorithm (RS256 > HS256). Verify signature on every request. Short expiration times. Never store sensitive data in payload (it\'s base64, not encrypted). Validate all claims (exp, iss, aud). Use HTTPS. Store in httpOnly cookies, not localStorage (XSS vulnerable). Implement token revocation/blacklist for logout.'],
  ['How should passwords be stored?','Never plain text. Never reversible encryption. Use adaptive hashing: bcrypt (work factor 12+), Argon2 (winner of PHC), scrypt. These are intentionally slow + memory-hard to resist GPU cracking. Always use a unique salt per password (automatic in bcrypt/Argon2). NEVER use MD5/SHA1/SHA256 for passwords — too fast.'],
  ['What is a zero-day vulnerability?','Vulnerability unknown to the software vendor — zero days to prepare a patch. Extremely valuable in black markets. After disclosure: vendor has zero days to fix before it\'s public knowledge. CVE system tracks publicly disclosed vulnerabilities. Zero-days are used in nation-state attacks and advanced malware (Stuxnet had 4 zero-days).'],
  ['What is defense in depth?','Security strategy using multiple independent layers of protection. No single point of failure. Layers: network (firewall, IDS), host (antivirus, EDR), application (WAF, input validation), data (encryption, DLP), user (MFA, security training). If one layer is breached, others provide protection. Based on the principle that no single security control is perfect.'],
  ['Explain public key infrastructure (PKI).','PKI manages digital certificates and encryption keys. Components: Certificate Authority (CA) issues/signs certificates. Registration Authority (RA) verifies identities. Certificate Revocation List (CRL) / OCSP for revoked certs. Trust chain: root CA (self-signed) → intermediate CA → end-entity cert. Root CAs are pre-installed in OS/browsers.'],
  ['What is salting in password hashing?','A salt is a random unique value added to each password before hashing. Prevents rainbow table attacks (pre-computed hash→password lookups). Prevents identical passwords from having identical hashes. Modern functions (bcrypt) generate and store the salt automatically. Each password has a different hash even if passwords are identical.'],
  ['What is a penetration test?','Authorized, simulated cyberattack to evaluate security. Types: Black box (no prior knowledge), White box (full access to source/config), Gray box (partial info). Phases: Reconnaissance → Scanning → Gaining access → Maintaining access → Reporting. Bug bounty programs crowdsource this. Different from vulnerability scanning — pentest involves active exploitation.'],
  ['What is threat modeling?','Systematic process to identify security threats and mitigations during design. STRIDE framework: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. PASTA: attack simulation methodology. Output: list of threats, severity ratings, mitigations. Done before building — cheaper than finding bugs in production.'],
  ['What is the CIA triad?','Confidentiality: information only accessible to authorized parties (encryption, access control). Integrity: data is accurate and unmodified (hashing, digital signatures, audit logs). Availability: systems are accessible when needed (redundancy, DDoS protection, backups). Foundation of all security thinking — every security decision maps to one or more of these.'],
];

          <button class="know-btn review-it" onclick="markInterview(${i},'review')">↺ Review</button>
        </div>
        ${s?`<div style="margin-top:6px;font-size:.7rem;color:${s==='known'?'#22c55e':'#fbbf24'}">${s==='known'?'✓ Marked as known':'↺ Marked for review'}</div>`:''}
      </div>
    </div>`;
  }).join('');
  document.getElementById('interview-list').innerHTML=list||'<div style="color:#6b7280;padding:20px;font-family:sans-serif">No cards match this filter.</div>';
}

function toggleQA(i){
  const a=document.getElementById('qa-ans-'+i);
  const arr=document.getElementById('qa-arr-'+i);
  a.classList.toggle('show');
  arr.textContent=a.classList.contains('show')?'▲':'▼';
}
function markInterview(i,s){interviewStatus[i]=s;set('interviewStatus',interviewStatus);renderInterview();}
function filterInterview(f,btn){
  interviewFilter=f;
  document.querySelectorAll('.filter-bar .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderInterview();
}

// Init
renderChallenges();
renderOWASP();
renderTools();
renderInterview();
</script>
</body>
</html>
