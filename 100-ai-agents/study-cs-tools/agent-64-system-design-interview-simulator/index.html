<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Design Interview Simulator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1117;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  header{background:#1a1d27;border-bottom:1px solid #2d3148;padding:16px 24px;display:flex;align-items:center;gap:16px}
  header h1{font-size:1.25rem;font-weight:700;color:#4f8ef7}
  header span{font-size:.85rem;color:#94a3b8}
  .tabs{display:flex;gap:4px;background:#1a1d27;border-bottom:1px solid #2d3148;padding:0 24px}
  .tab{padding:14px 20px;cursor:pointer;font-size:.9rem;font-weight:500;color:#94a3b8;border-bottom:2px solid transparent;transition:all .2s}
  .tab.active{color:#4f8ef7;border-bottom-color:#4f8ef7}
  .tab:hover:not(.active){color:#e2e8f0}
  .panel{display:none;padding:24px;max-width:960px;margin:0 auto}
  .panel.active{display:block}
  .btn{padding:10px 20px;border:none;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
  .btn-primary{background:#4f8ef7;color:#fff}
  .btn-primary:hover{background:#3b7de8}
  .btn-secondary{background:#2d3148;color:#e2e8f0}
  .btn-secondary:hover{background:#3a3f5c}
  .btn-green{background:#4ade8022;color:#4ade80;border:1px solid #4ade8040}
  .btn-green:hover{background:#4ade8033}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .badge-easy{background:#4ade8022;color:#4ade80}
  .badge-medium{background:#fb923c22;color:#fb923c}
  .badge-hard{background:#f8717122;color:#f87171}
  .tag{display:inline-block;background:#1e293b;color:#94a3b8;padding:3px 10px;border-radius:20px;font-size:.73rem;margin:2px}

  /* PROBLEMS */
  .problems-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .problem-card{background:#1a1d27;border:1px solid #2d3148;border-radius:14px;padding:20px;cursor:pointer;transition:all .2s}
  .problem-card:hover{border-color:#4f8ef7;transform:translateY(-2px)}
  .problem-card.done{border-color:#4ade8040}
  .problem-card .ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
  .problem-card h3{font-size:.95rem;font-weight:600;flex:1}
  .problem-card .tags{margin-top:10px}
  .problem-card .footer{margin-top:14px;display:flex;align-items:center;justify-content:space-between}
  .done-check{color:#4ade80;font-size:.85rem}

  /* INTERVIEW */
  #interviewView{display:none}
  .interview-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .back-btn{background:#2d3148;border:none;color:#94a3b8;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem}
  .back-btn:hover{background:#3a3f5c;color:#e2e8f0}
  .interview-title{font-size:1.3rem;font-weight:700}
  .steps-nav{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;padding-bottom:4px}
  .step-btn{padding:8px 16px;border-radius:8px;border:1px solid #2d3148;background:transparent;color:#94a3b8;cursor:pointer;font-size:.82rem;white-space:nowrap;transition:all .2s}
  .step-btn.active{background:#4f8ef7;color:#fff;border-color:#4f8ef7}
  .step-btn.visited{border-color:#4f8ef730;color:#e2e8f0}
  .step-content{background:#1a1d27;border:1px solid #2d3148;border-radius:14px;padding:24px;margin-bottom:16px}
  .step-content h2{font-size:1.05rem;font-weight:600;margin-bottom:14px;color:#4f8ef7}
  .step-content p{color:#94a3b8;line-height:1.7;margin-bottom:10px;font-size:.9rem}
  .step-content ul{list-style:none;padding-left:0}
  .step-content ul li{padding:6px 0;color:#94a3b8;font-size:.9rem;border-bottom:1px solid #0f1117}
  .step-content ul li:before{content:"→ ";color:#4f8ef7}
  .step-content ul li:last-child{border:none}
  .reveal-btn{background:#2d3148;border:none;color:#94a3b8;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:8px}
  .reveal-btn:hover{background:#3a3f5c;color:#e2e8f0}
  .hint-box{background:#1e293b;border:1px solid #4f8ef720;border-radius:10px;padding:16px;margin-top:12px}
  .hint-box h4{color:#4f8ef7;font-size:.85rem;margin-bottom:8px}
  .hint-box p,.hint-box li{color:#94a3b8;font-size:.85rem;line-height:1.6}
  .checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
  .check-item{background:#0f1117;border:1px solid #2d3148;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .2s}
  .check-item.checked{border-color:#4ade8040;background:#4ade8008}
  .check-item .ci-box{width:16px;height:16px;border:2px solid #2d3148;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .check-item.checked .ci-box{background:#4ade80;border-color:#4ade80;color:#0f1117;font-size:.7rem}
  .check-item span{font-size:.82rem;color:#94a3b8}
  .check-item.checked span{color:#e2e8f0}
  .solution-box{background:#0f1117;border-radius:10px;padding:20px;margin-top:12px}
  .solution-box h4{color:#4ade80;margin-bottom:12px;font-size:.9rem}
  .solution-step{display:flex;gap:12px;margin-bottom:12px}
  .solution-step .num{background:#4f8ef7;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;margin-top:2px}
  .solution-step p{color:#94a3b8;font-size:.85rem;line-height:1.6}
  .nav-row{display:flex;justify-content:space-between;margin-top:16px}
  .requirements-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
  .req-box{background:#0f1117;border-radius:10px;padding:16px}
  .req-box h4{font-size:.82rem;font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
  .req-box.func h4{color:#4f8ef7}
  .req-box.nonfunc h4{color:#fb923c}
  .req-box li{color:#94a3b8;font-size:.83rem;padding:4px 0;border-bottom:1px solid #1a1d27;list-style:none}
  .req-box li:before{content:"• ";color:#4f8ef750}
  .rate-row{display:flex;gap:8px;align-items:center;margin-top:16px}
  .rate-label{color:#94a3b8;font-size:.85rem}
  .star{font-size:1.3rem;cursor:pointer;color:#2d3148;transition:color .15s}
  .star.on{color:#fbbf24}

  /* CONCEPTS */
  .concepts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .concept-card{background:#1a1d27;border:1px solid #2d3148;border-radius:14px;padding:20px;cursor:pointer;transition:all .2s}
  .concept-card:hover{border-color:#4f8ef7}
  .concept-card.reviewed{border-color:#4ade8040}
  .concept-card h3{font-size:.95rem;font-weight:600;margin-bottom:8px;color:#e2e8f0}
  .concept-card .preview{font-size:.82rem;color:#94a3b8;line-height:1.5}
  .concept-detail{display:none;background:#1a1d27;border:1px solid #2d3148;border-radius:14px;padding:24px;margin-top:16px}
  .concept-detail.open{display:block}
  .concept-detail h2{font-size:1.1rem;font-weight:700;margin-bottom:14px;color:#4f8ef7}
  .concept-section{margin-bottom:16px}
  .concept-section h4{font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:8px}
  .concept-section p,.concept-section li{font-size:.88rem;color:#cbd5e1;line-height:1.7}
  .concept-section ul{padding-left:0;list-style:none}
  .concept-section ul li:before{content:"▸ ";color:#4f8ef7}

  /* PROGRESS */
  .progress-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:28px}
  .prog-card{background:#1a1d27;border:1px solid #2d3148;border-radius:14px;padding:20px}
  .prog-card .pv{font-size:2rem;font-weight:700;color:#4f8ef7}
  .prog-card .pk{color:#94a3b8;font-size:.82rem;margin-top:6px}
  .section-head{font-size:1rem;font-weight:600;margin-bottom:14px;color:#e2e8f0}
  .weak-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
  .weak-item{background:#1a1d27;border:1px solid #2d3148;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  .weak-item .wn{font-size:.9rem}
  .stars-display{color:#fbbf24;font-size:.9rem}
  .no-data{text-align:center;padding:40px;color:#94a3b8}

  /* misc */
  .hidden{display:none!important}
  .search-box{background:#1a1d27;border:1px solid #2d3148;border-radius:8px;padding:10px 16px;width:100%;font-size:.9rem;color:#e2e8f0;outline:none;margin-bottom:16px}
  .search-box:focus{border-color:#4f8ef7}
  .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .filter-btn{padding:6px 14px;border-radius:20px;border:1px solid #2d3148;background:transparent;color:#94a3b8;cursor:pointer;font-size:.82rem;transition:all .2s}
  .filter-btn.on{background:#4f8ef7;border-color:#4f8ef7;color:#fff}
</style>
</head>
<body>

<header>
  <h1>System Design Interview Simulator</h1>
  <span>100 AI Agents · #64</span>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('problems')">PROBLEMS</div>
  <div class="tab" onclick="switchTab('interview')">INTERVIEW</div>
  <div class="tab" onclick="switchTab('concepts')">CONCEPTS</div>
  <div class="tab" onclick="switchTab('progress')">PROGRESS</div>
</div>

<!-- PROBLEMS -->
<div id="tab-problems" class="panel active">
  <input class="search-box" id="problemSearch" placeholder="Search problems..." oninput="renderProblems()">
  <div class="filter-row">
    <button class="filter-btn" id="fb-Easy" onclick="toggleDiff('Easy',this)">Easy</button>
    <button class="filter-btn" id="fb-Medium" onclick="toggleDiff('Medium',this)">Medium</button>
    <button class="filter-btn" id="fb-Hard" onclick="toggleDiff('Hard',this)">Hard</button>
  </div>
  <div class="problems-grid" id="problemsGrid"></div>
</div>

<!-- INTERVIEW -->
<div id="tab-interview" class="panel">
  <div id="interviewPrompt" style="text-align:center;padding:60px 20px">
    <div style="font-size:3rem;margin-bottom:16px">🏗️</div>
    <h2 style="font-size:1.4rem;margin-bottom:8px">Pick a Problem to Start</h2>
    <p style="color:#94a3b8;margin-bottom:24px">Go to PROBLEMS tab and click "Start" on any problem to begin a mock interview.</p>
    <button class="btn btn-primary" onclick="switchTab('problems')">Browse Problems</button>
  </div>

  <div id="interviewView">
    <div class="interview-header">
      <button class="back-btn" onclick="exitInterview()">← Back</button>
      <div>
        <div class="interview-title" id="ivTitle"></div>
        <div id="ivBadge" style="margin-top:4px"></div>
      </div>
    </div>

    <div class="steps-nav" id="stepsNav"></div>
    <div id="stepContent"></div>
    <div class="nav-row">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevStep()">← Previous</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">Next →</button>
    </div>
  </div>
</div>

<!-- CONCEPTS -->
<div id="tab-concepts" class="panel">
  <input class="search-box" id="conceptSearch" placeholder="Search concepts..." oninput="renderConcepts()">
  <div class="concepts-grid" id="conceptsGrid"></div>
</div>

<!-- PROGRESS -->
<div id="tab-progress" class="panel">
  <div class="progress-grid" id="progressGrid"></div>
  <div class="section-head">Problem Ratings</div>
  <div id="ratingsSection"></div>
  <div class="section-head" style="margin-top:20px">Concepts Reviewed</div>
  <div id="conceptsReviewed"></div>
</div>

<script>
const PROBLEMS = [
  {
    id:'url',title:'Design URL Shortener',difficulty:'Easy',
    tags:['Hashing','Database','Caching'],
    statement:'Design a URL shortening service like bit.ly. Users paste a long URL and get a short alias that redirects to the original.',
    functional:['Shorten a long URL to a unique short code','Redirect short URL to original URL','Optional: custom aliases','Optional: analytics (click count)'],
    nonfunctional:['100M URLs stored','100K reads/sec (read-heavy)','Availability over consistency','Links never expire by default'],
    steps:{
      clarify:'Clarify: Should links expire? Custom aliases? Analytics? Any auth? — Assume: no expiry by default, no auth needed, basic click tracking.',
      estimate:'~100M URLs × 100 bytes avg = 10GB storage. 100K reads/sec → need caching. 1K writes/sec.',
      design:'API: POST /shorten → short_code, GET /{code} → 302 redirect. Use Base62 encoding (a-zA-Z0-9) on an auto-increment ID for the short code. Store in relational DB (id, short_code, original_url, created_at).',
      deepdive:'Hash collisions: Use counter or random + collision check. Cache hot URLs in Redis (LRU). DB: shard by short_code hash for scale. For analytics: write click events async to a queue.',
      tradeoffs:'Counter-based vs. random: counter is sequential (guessable), random needs collision detection. SQL vs NoSQL: SQL simpler, NoSQL scales easier. 302 vs 301: 302 doesn\'t cache (allows analytics), 301 caches (less load).'
    },
    hints:['Think about how to encode an integer to a short string — Base62 maps 62 chars to ~6-char codes for 56B combinations','The redirect endpoint is read-heavy — what layer do you add in front of the DB?','How do you handle concurrent writes generating the same short code?'],
    checklist:['Load Balancer','Short Code Generator','Key-Value Cache (Redis)','Relational DB','CDN','Analytics Queue','Rate Limiter'],
    solution:[
      'Client sends POST /shorten → Load Balancer → App Server',
      'App Server generates short code: Base62(auto-increment ID) or random + collision check',
      'Store {short_code, original_url, created_at} in MySQL/PostgreSQL',
      'On GET /{code}: check Redis cache first, then DB; cache hit rate ~99%',
      'Return 302 redirect; log click event to Kafka → analytics consumer',
      'Scale write path: shard DB by short_code; scale read path: Redis cluster + CDN'
    ]
  },
  {
    id:'twitter',title:'Design Twitter',difficulty:'Hard',
    tags:['Fan-out','Timeline','NoSQL','Caching'],
    statement:'Design a social media platform where users post tweets, follow others, and see a personalized timeline feed.',
    functional:['Post a tweet (text, images)','Follow/unfollow users','View home timeline (tweets from followed users)','Like and retweet'],
    nonfunctional:['500M users, 100M DAU','300K tweet writes/sec','Timeline reads: 1M/sec','Eventual consistency OK for timeline'],
    steps:{
      clarify:'Clarify: Is this read-heavy or write-heavy? Both. Any character limit? 280 chars. Do we need search? Scope out for now.',
      estimate:'100M tweets/day = ~1,200/sec writes. Timeline read: ~1M/sec. Media stored separately in object store.',
      design:'Users, Tweets, Follows tables. Fan-out on write (push) vs. fan-out on read (pull). Push tweet to followers\' timeline caches on write. Pull is simpler but slow for high-follower users.',
      deepdive:'Celebrity problem: users with >1M followers — don\'t fan-out to all, use hybrid approach (push for normal users, pull for celebrities). Timeline stored in Redis sorted sets (score=timestamp).',
      tradeoffs:'Fan-out on write: fast reads, expensive for celebrities. Fan-out on read: simple writes, slow reads. Hybrid balances both. NoSQL (Cassandra) for tweets — wide column, time-series friendly.'
    },
    hints:['A user following 1000 accounts — how do you build their timeline efficiently?','What happens when a celebrity with 50M followers tweets?','Redis sorted sets are great for time-ordered feeds — what\'s the key?'],
    checklist:['Load Balancer','Tweet Service','Timeline Service','Fan-out Service','Redis (Timeline Cache)','Cassandra (Tweets)','CDN (Media)','Message Queue'],
    solution:[
      'POST /tweet → Tweet Service → store in Cassandra, media in S3',
      'Fan-out Service subscribes to tweet events via Kafka',
      'For each follower (if < threshold): push tweet_id to their Redis timeline sorted set',
      'For celebrities: skip fan-out; pull their tweets at read time and merge',
      'GET /timeline: fetch tweet_ids from Redis, batch-fetch tweet details from Cassandra',
      'Add CDN for media; rate limit APIs; use consistent hashing for Redis sharding'
    ]
  },
  {
    id:'netflix',title:'Design Netflix',difficulty:'Hard',
    tags:['CDN','Streaming','Microservices','Encoding'],
    statement:'Design a video streaming service that serves millions of users with high-quality video with minimal buffering.',
    functional:['Upload and store video content','Stream video to users','Support multiple resolutions/quality levels','Track watch history and recommendations'],
    nonfunctional:['200M subscribers','Netflix uses 15% of global internet bandwidth','High availability: 99.99%','Adaptive bitrate streaming'],
    steps:{
      clarify:'Clarify: Live or on-demand? On-demand. Mobile + web? Yes. DRM needed? Yes. Focus on video delivery pipeline.',
      estimate:'1 hour HD video ≈ 2GB. 36K concurrent streams × 5Mbps = 180Gbps egress. 500K video titles.',
      design:'Upload pipeline: raw video → transcoding service → multiple formats (DASH/HLS) at resolutions 360p-4K → stored in S3 → pushed to CDN edge nodes. Playback: client requests manifest → CDN serves chunks.',
      deepdive:'Adaptive bitrate: client downloads small segments (2-10s), monitors bandwidth, switches quality level dynamically. CDN edge prefetches popular content. Use consistent hashing to route users to closest edge.',
      tradeoffs:'Centralized vs. distributed CDN: Netflix uses Open Connect appliances in ISP data centers. Push vs. pull CDN: push popular content proactively. Encoding: per-title encoding vs. fixed ladder — per-title uses less bandwidth for same quality.'
    },
    hints:['How does the video get from a datacenter to a user with minimal latency?','What does "adaptive bitrate" mean in practice for segment requests?','How would you handle a popular show premiering and millions requesting it simultaneously?'],
    checklist:['Upload Service','Transcoding Service','CDN (Edge Nodes)','Manifest Service','Recommendation Engine','DRM Service','Load Balancer','Object Store (S3)'],
    solution:[
      'Video uploaded → Upload Service → raw stored in S3',
      'Transcoding Service (worker fleet) converts to HLS/DASH at 6+ quality levels',
      'Transcoded chunks pushed to CDN edge nodes globally',
      'Client requests manifest file → gets chunk URLs from nearest CDN edge',
      'ABR algorithm selects quality based on network speed every few seconds',
      'Watch history + events → Kafka → ML pipeline → personalized recommendations'
    ]
  },
  {
    id:'uber',title:'Design Uber',difficulty:'Hard',
    tags:['Geospatial','Real-time','Matching','WebSocket'],
    statement:'Design a ride-sharing platform where riders request rides and drivers accept them, with real-time location tracking.',
    functional:['Rider requests a ride from location A to B','Match rider with nearby available driver','Real-time driver location tracking','Trip tracking and fare calculation'],
    nonfunctional:['1M concurrent trips globally','Driver location updates every 5 seconds','Match latency < 1 second','High consistency for trip state'],
    steps:{
      clarify:'Clarify: What markets? Global. Is this just matching, or full platform? Full. Need pricing? Surge pricing is a stretch goal.',
      estimate:'1M drivers × location update every 5s = 200K writes/sec to location store. 1M riders × ride request = 10K requests/sec.',
      design:'Driver App pings location every 5s → Location Service writes to geospatial store. Rider requests ride → Matching Service queries nearby drivers using geohash/quadtree. Driver accepts → Trip Service creates trip.',
      deepdive:'Geospatial indexing: Geohash encodes lat/lng to a string prefix (nearby = similar prefix). Query drivers in a geohash cell. WebSocket for real-time driver tracking during trip.',
      tradeoffs:'Geohash vs. QuadTree: Geohash simpler, QuadTree better for uneven density. Push vs. poll location updates: push with WebSocket reduces latency. Strong vs. eventual consistency for trip: strong required (can\'t match driver twice).'
    },
    hints:['How do you efficiently find drivers within 2km of a rider?','How do you prevent two riders from matching to the same driver simultaneously?','How does the rider\'s app show the driver moving in real time?'],
    checklist:['Load Balancer','Location Service','Matching Service','Trip Service','WebSocket Server','Geospatial DB (Redis GEO)','Message Queue','Payment Service'],
    solution:[
      'Driver App → WebSocket → Location Service → write lat/lng to Redis GEO',
      'Rider requests ride → Matching Service queries Redis GEORADIUS for nearby drivers',
      'Rank drivers by distance + rating; send push notification to top candidates',
      'First driver to accept → Trip Service atomically locks driver (Redis SET NX)',
      'Trip state machine: REQUESTED→ACCEPTED→IN_PROGRESS→COMPLETED stored in PostgreSQL',
      'During trip: driver location streamed via WebSocket to rider app in real time'
    ]
  },
  {
    id:'whatsapp',title:'Design WhatsApp',difficulty:'Medium',
    tags:['Messaging','WebSocket','End-to-End Encryption','Consistency'],
    statement:'Design a real-time messaging app that delivers messages reliably with read receipts.',
    functional:['Send text/media messages between users','Group chats up to 256 members','Message delivery receipts (sent/delivered/read)','Media file sharing'],
    nonfunctional:['2B users, 100B messages/day','End-to-end encryption','Message delivery guarantee (at-least-once)','Store messages for offline delivery'],
    steps:{
      clarify:'Clarify: How long to store messages? 30 days after delivery. Group size? 256. Multi-device? Yes. Focus on 1-1 first.',
      estimate:'100B messages/day = ~1.2M messages/sec. Message size avg 200 bytes = 240MB/sec = 20TB/day.',
      design:'WebSocket connections held open per device. Sender → Chat Service → Message Queue → Delivery Service → recipient WebSocket. Store message until ACK received.',
      deepdive:'Message ID: global sequence using Snowflake IDs for ordering. Fanout for group messages. Read receipts: recipient sends ACK → update message status. Offline users: store in message table, deliver on reconnect.',
      tradeoffs:'Push vs. pull delivery: push with WebSocket for low latency. XMPP vs custom protocol: custom binary protocol more efficient. When to delete messages: only after delivery ACK or 30-day TTL.'
    },
    hints:['What happens when the recipient is offline when a message is sent?','How do you ensure exactly-once delivery (no duplicates)?','How would you fanout a message to 256 group members efficiently?'],
    checklist:['WebSocket Server','Chat Service','Message Queue (Kafka)','Message DB (Cassandra)','Media Store (S3)','Receipt Service','Push Notification','Presence Service'],
    solution:[
      'Sender opens WebSocket → Chat Service assigns server via consistent hashing',
      'Message stored in Cassandra with status=PENDING, unique message_id',
      'If recipient online: delivered via WebSocket, status→DELIVERED',
      'If offline: stored; delivery attempted on reconnect',
      'Read receipt: recipient sends ACK → status→READ → notify sender',
      'Media: upload to S3, share URL; CDN serves downloads'
    ]
  },
  {
    id:'instagram',title:'Design Instagram',difficulty:'Medium',
    tags:['Photo Storage','Feed','CDN','Fan-out'],
    statement:'Design a photo-sharing platform where users post photos and see a feed of people they follow.',
    functional:['Upload and share photos/videos','Follow other users','View personalized photo feed','Like and comment on posts'],
    nonfunctional:['1B users, 100M daily uploads','Feed generation < 200ms','High read throughput','Media delivery via CDN'],
    steps:{
      clarify:'Clarify: Stories (ephemeral)? Scope out. Reels? Scope out. Focus on photos + feed.',
      estimate:'100M uploads/day. Avg photo 3MB → 300TB/day storage for originals + thumbnails. Feed: 500M users × 3 feed loads/day = 17K/sec.',
      design:'Upload: photo → S3 → CDN. Feed: fan-out on write. Post event → Fanout Service → push post_id to followers\' Redis feed list (cap at 500 entries).',

    hints:['How do you store time-series data efficiently for range queries over months?','What\'s downsampling and why is it important for long-term retention?','How do you alert on "CPU > 90% for 5 minutes" without false positives?'],

    solution:[

      'Collector batches writes → Time Series DB (partitioned by metric + time window)',

      'Query engine: parse PromQL-like query → fan out to relevant partitions → aggregate',

      'Alert Manager deduplicates alerts, routes to PagerDuty/Slack based on severity'
    ]

const CONCEPTS = [
  {name:'Load Balancing',preview:'Distributing incoming traffic across multiple servers',explanation:'Load balancers distribute client requests across a pool of backend servers to prevent any single server from becoming a bottleneck. They also handle health checks — removing unhealthy servers from the pool.',whentouse:'Any system with multiple server replicas; needed when single-server throughput is insufficient.',tradeoffs:'L4 (TCP-level) is faster; L7 (HTTP-level) allows routing by path/header. Round-robin is simple; least-connections reduces hotspots. Active health checks add overhead.'},
  {name:'Caching',preview:'Storing frequently accessed data in a fast layer',explanation:'Caching stores copies of expensive-to-compute or frequently-read data in a fast store (memory) to reduce latency and database load. Strategies: Cache-aside (app manages), Write-through (write to cache + DB), Write-back (cache first, async to DB).',whentouse:'Read-heavy systems, expensive computations, data that doesn\'t change frequently.',tradeoffs:'Cache invalidation is hard ("only two hard things in CS"). Stale data risk. Memory cost. TTL vs event-based invalidation.'},
  {name:'CAP Theorem',preview:'Can only guarantee 2 of 3: Consistency, Availability, Partition tolerance',explanation:'In a distributed system, during a network partition you must choose: Consistency (all nodes see the same data) or Availability (system remains operational). Partition Tolerance is not optional in real networks.',whentouse:'When choosing distributed databases: CP (MongoDB, HBase) vs. AP (Cassandra, CouchDB).',tradeoffs:'CA (both C and A): only possible without network partitions — not realistic. CP gives strong consistency at cost of availability. AP gives high availability with eventual consistency.'},
  {name:'SQL vs NoSQL',preview:'Relational databases vs. distributed non-relational stores',explanation:'SQL: structured schema, ACID transactions, joins, vertical scaling. NoSQL: flexible schema, horizontal scaling, sacrifice some consistency. Types: Document (MongoDB), Key-Value (Redis), Wide-Column (Cassandra), Graph (Neo4j).',whentouse:'SQL for complex queries, transactions, relationships. NoSQL for large-scale writes, flexible schema, time-series, caching.',tradeoffs:'SQL harder to scale horizontally. NoSQL often sacrifices consistency or rich queries. ACID in NoSQL is increasingly available (MongoDB 4.0+, DynamoDB transactions).'},
  {name:'Sharding',preview:'Horizontal partitioning of data across multiple database nodes',explanation:'Sharding splits data across multiple database nodes so each node handles a subset. Common strategies: Hash-based (hash(key) % N), Range-based (by ID range or date), Directory-based (lookup table maps keys to shards).',whentouse:'Database too large or write-heavy for a single node.',tradeoffs:'Complex cross-shard queries and joins. Rebalancing when adding shards. Hot shards if distribution is uneven. Operations team complexity.'},
  {name:'Replication',preview:'Maintaining copies of data across multiple nodes',explanation:'Replication copies data to multiple nodes for durability and availability. Single-leader: one primary accepts writes, replicas serve reads. Multi-leader: multiple primaries (for geo-distribution). Leaderless: any node accepts writes (Dynamo-style).',whentouse:'Any system needing high availability or disaster recovery. Read scaling (replicas handle reads).',tradeoffs:'Replication lag causes stale reads. Leader election complexity. Synchronous replication ensures durability but increases write latency. Async is faster but risks data loss on crash.'},
  {name:'Message Queues',preview:'Async communication buffer between services',explanation:'Message queues (Kafka, RabbitMQ, SQS) decouple producers from consumers. Producers publish messages; consumers process at their own rate. Enables async processing, load leveling, and fan-out.',whentouse:'When services have different processing rates, for fan-out notifications, event-driven architectures, reliable async workflows.',tradeoffs:'Adds latency vs. synchronous calls. Message ordering guarantees vary. At-least-once delivery requires idempotent consumers. Queue depth as backpressure signal.'},
  {name:'CDN',preview:'Content delivery network serves assets from geographically distributed edge nodes',explanation:'CDNs like Cloudflare, Akamai cache static and dynamic content at edge nodes globally. Reduces latency by serving from nodes close to users, offloads origin servers.',whentouse:'Static assets (JS/CSS/images), large media files, globally distributed users.',tradeoffs:'Cache invalidation delay. Cost per GB transferred. Origin shield adds another cache layer. Edge compute (Cloudflare Workers) enables logic at edge.'},
  {name:'Rate Limiting',preview:'Controlling request rates to protect services',explanation:'Rate limiting restricts how many requests a client can make in a time window. Algorithms: Token Bucket (allows bursts), Leaky Bucket (smooth output), Fixed Window (simple, boundary burst problem), Sliding Window (accurate, memory cost).',whentouse:'APIs to prevent abuse, protect backend services from overload, enforce SLA tiers.',tradeoffs:'False positives block legitimate users. Distributed rate limiting needs coordination (Redis). Hard vs. soft limits. Rate limit by IP vs. user vs. API key.'},
  {name:'Consistent Hashing',preview:'Distributing keys across nodes with minimal remapping on changes',explanation:'Consistent hashing maps keys and nodes to positions on a virtual ring. Each key is served by the nearest node clockwise. When a node is added/removed, only the keys between it and its predecessor are remapped (O(K/N) keys vs. O(K) for modulo hashing).',whentouse:'Distributed caches, load balancers, distributed databases where nodes come and go.',tradeoffs:'Virtual nodes (vnodes) needed for uniform distribution. Hot spots if node capacity differs. Complex implementation vs. simple modulo hashing.'},
  {name:'Horizontal vs Vertical Scaling',preview:'Scale out (more servers) vs. scale up (bigger servers)',explanation:'Vertical scaling: add CPU/RAM to a single server. Simple but limited and has downtime for upgrades. Horizontal scaling: add more servers. More complex (distributed system) but unlimited scale and better fault tolerance.',whentouse:'Vertical first (simpler), switch to horizontal when you hit limits or need high availability.',tradeoffs:'Horizontal needs load balancing, stateless services, distributed data. Cost of larger servers (non-linear). Vertical can be faster for write-heavy workloads.'},
  {name:'Microservices',preview:'Architecture with many small, independently deployable services',explanation:'Microservices split application into small services each owning their domain. Each deploys independently, scales independently, can use different tech stacks. Communicate via HTTP/gRPC or message queues.',whentouse:'Large teams, independent scaling of components, need different tech per service.',tradeoffs:'Network overhead vs. in-process calls. Distributed transactions are complex (need Saga/2PC). Operational overhead: service discovery, tracing, many deployments. Monolith is simpler to start.'},
  {name:'API Gateway',preview:'Single entry point for all client requests',explanation:'API Gateway handles cross-cutting concerns: authentication, rate limiting, routing, SSL termination, request/response transformation, caching. Examples: Kong, AWS API Gateway, Nginx.',whentouse:'Microservices architecture, when multiple services need common auth/rate limiting, mobile clients needing aggregated APIs.',tradeoffs:'Single point of failure (mitigated by clustering). Bottleneck if not scaled. Logic in gateway can be hard to test. Increases latency (one extra hop).'},
  {name:'Database Indexes',preview:'Data structures that speed up queries at the cost of write overhead',explanation:'Indexes (B-tree, hash, full-text) allow the DB to find rows without scanning every row. B-tree supports range queries; hash index supports exact lookups; full-text enables search. Covering index includes all columns needed by a query.',whentouse:'Any column used in WHERE, JOIN, ORDER BY clauses with large tables.',tradeoffs:'Write overhead (index updated on every insert/update/delete). Storage cost. Too many indexes slow writes. Partial and expression indexes for specific query patterns.'},
  {name:'Eventual Consistency',preview:'All replicas converge to the same value given time without updates',explanation:'In an eventually consistent system, writes propagate to all replicas asynchronously. Reads may return stale data during propagation. Used in AP systems (Cassandra, DynamoDB). Clients must handle conflicts or accept stale reads.',whentouse:'Systems tolerating brief staleness: social feeds, shopping carts, DNS, analytics counters.',tradeoffs:'Conflict resolution (last-write-wins, vector clocks, CRDTs). Read-your-own-writes consistency: ensure writes route to same replica. User experience: showing stale like counts is acceptable; stale bank balance is not.'},
  {name:'Idempotency',preview:'Operation that produces same result regardless of how many times it runs',explanation:'Idempotent operations can be safely retried. HTTP: GET/PUT/DELETE are idempotent; POST is not by default. Achieved via idempotency keys: client sends unique key per request; server stores result and returns it on retry.',whentouse:'Any operation that might be retried due to network failures: payments, notifications, order creation.',tradeoffs:'Server must store idempotency keys (memory/TTL cost). Keys must be unique (UUID). Window of de-duplication: how long to store keys.'},
  {name:'Distributed Transactions',preview:'Coordinating transactions across multiple databases or services',explanation:'2PC (Two-Phase Commit): coordinator locks resources, then commits. Blocking protocol — bad for availability. Saga pattern: sequence of local transactions with compensating rollback actions. Outbox pattern: write event atomically with DB record.',whentouse:'Cross-service writes needing consistency (e.g., payment + order). Use Saga for microservices over 2PC.',tradeoffs:'2PC: blocking, single coordinator failure halts system. Saga: complex compensation logic, eventually consistent. Outbox: reliable but adds DB table and polling/CDC overhead.'},
  {name:'Circuit Breaker',preview:'Stops calling a failing service to allow it to recover',explanation:'Circuit breaker wraps calls to remote services. States: Closed (normal), Open (failing — reject fast), Half-Open (testing recovery). Prevents cascade failures when a downstream service is slow or down.',whentouse:'Any microservice calling another service or external API.',tradeoffs:'False positive trips if threshold is too sensitive. Need fallback logic for when circuit is open. Adds complexity vs. simple retries.'},
  {name:'Service Discovery',preview:'Automatic detection of service instances in a dynamic environment',explanation:'In microservices, instances start/stop dynamically. Service discovery (Consul, Eureka, Kubernetes DNS) tracks live instances. Client-side discovery: client queries registry and load balances. Server-side: load balancer queries registry.',whentouse:'Any microservices deployment where service instances scale dynamically.',tradeoffs:'Additional infrastructure to maintain. Stale registry entries if health checks fail. DNS-based discovery is simpler but slower to propagate changes.'},
  {name:'WebSockets',preview:'Full-duplex persistent connection for real-time communication',explanation:'WebSockets upgrade an HTTP connection to a persistent, bidirectional TCP connection. Server can push data to client without polling. Used in chat, live feeds, collaborative editing, real-time dashboards.',whentouse:'When server needs to push updates to client (not just request-response): live sports, trading, multiplayer games.',tradeoffs:'Stateful connections complicate horizontal scaling (sticky sessions or shared state). Not cacheable. More complex than HTTP polling for simple cases. Connection per client limits server capacity.'},
  {name:'Blob/Object Storage',preview:'Scalable storage for unstructured data (files, images, videos)',explanation:'Object stores (S3, GCS, Azure Blob) store unstructured data at petabyte scale. Data accessed by key (URL), not filesystem path. Features: lifecycle policies, versioning, event notifications, presigned URLs for direct client upload.',whentouse:'User-generated content, backups, logs, media files, ML training datasets.',tradeoffs:'Higher latency than local disk. Costs per GB + per request. Eventual consistency in some operations. Egress costs dominate for large-scale streaming.'},
  {name:'Bloom Filter',preview:'Probabilistic data structure for set membership testing',explanation:'Bloom filter uses a bit array and k hash functions. Check if element might be in set (possible false positives) or definitely not in set (no false negatives). Never false negatives. Space-efficient: 10 bits/element at 1% false positive rate.',whentouse:'When you need fast set membership checks with acceptable false positives: cache pre-screening, duplicate URL detection, malware detection.',tradeoffs:'Cannot delete elements (use Counting Bloom Filter). False positive rate increases as filter fills. Must re-tune size as set grows.'},
  {name:'Long Polling vs SSE vs WebSocket',preview:'Three techniques for server-to-client real-time updates',explanation:'Long Polling: client holds request open; server responds when data arrives. SSE (Server-Sent Events): server streams events to client over HTTP — unidirectional. WebSocket: bidirectional, persistent. Long polling works everywhere; SSE is simple for one-way; WebSocket is best for two-way real-time.',whentouse:'Long polling: simple, firewall-friendly. SSE: live feeds, notifications, dashboards. WebSocket: chat, games, collaborative editing.',tradeoffs:'Long polling: high server connection count, latency of round-trip. SSE: HTTP/2 multiplexing helps, but still unidirectional. WebSocket: stateful, harder to scale horizontally.'},
  {name:'Geospatial Indexing',preview:'Efficient querying for location-based data',explanation:'Geohash encodes (lat, lng) as a string; nearby locations share a prefix. R-tree indexes bounding boxes for spatial range queries. PostGIS adds spatial indexing to PostgreSQL. Used in proximity searches.',whentouse:'Ride-sharing, food delivery, map apps, location-based recommendations.',tradeoffs:'Geohash cells are rectangular — may miss nearby points just across a boundary. R-tree better for irregular polygons. Quadtrees for dynamic data with non-uniform density.'},
  {name:'Data Partitioning Strategies',preview:'How to split data across multiple nodes',explanation:'Hash partitioning: consistent hash distributes evenly, good for key lookups. Range partitioning: by date, ID range — good for range queries but can create hot partitions. Directory partitioning: explicit mapping table flexible but adds lookup overhead.',whentouse:'Any distributed database or storage system.',tradeoffs:'Hash: poor range queries, even distribution. Range: range queries fast, hotspots on sequential IDs. Directory: flexible but lookup table is a bottleneck/SPOF.'},
  {name:'Leader Election',preview:'Choosing one node to act as coordinator in a distributed system',explanation:'Leader election algorithms (Raft, Paxos, ZooKeeper\'s ZAB) ensure exactly one node is elected leader. Leader handles writes or coordination. Consensus algorithms handle leader failure and re-election without data loss.',whentouse:'Distributed databases with primary replica, distributed locks, task schedulers (only one node should run a job).',tradeoffs:'Election process takes time — unavailability window. Split-brain if two nodes believe they\'re leader — prevent with fencing/epoch numbers. Raft is simpler to understand than Paxos.'},
  {name:'Saga Pattern',preview:'Managing distributed transactions via a sequence of local transactions',explanation:'Saga breaks a distributed transaction into local transactions, each publishing an event. Two types: Choreography (each service listens for events and reacts) and Orchestration (central orchestrator commands each step). Failed steps trigger compensating transactions.',whentouse:'Microservices requiring cross-service data consistency without 2PC.',tradeoffs:'Complex compensation logic. Temporary inconsistency. Debugging event chains is hard. Orchestration: easier to track state but adds orchestrator dependency.'},
  {name:'Write-Ahead Log (WAL)',preview:'Durability mechanism writing changes to log before applying them',explanation:'WAL (or transaction log) records every change before it\'s applied. On crash, the system replays the log to recover. Used in PostgreSQL, Kafka (commit log), distributed DBs. Enables replication by shipping the log.',whentouse:'Any stateful system needing crash recovery or replication.',tradeoffs:'Write amplification (write to log + actual storage). Log compaction needed to prevent unbounded growth. WAL shipping latency affects replica freshness.'},
  {name:'Backpressure',preview:'Mechanism for consumers to signal producers to slow down',explanation:'Backpressure prevents producers from overwhelming consumers. Mechanisms: bounded queues (drop or block when full), TCP flow control, reactive streams protocol. Without backpressure, queues grow unbounded, causing OOM or cascading failures.',whentouse:'Any system with asynchronous processing: Kafka consumers, stream processing, microservice fan-out.',tradeoffs:'Blocking backpressure reduces throughput. Dropping messages loses data. Monitoring queue depth as a leading indicator of overload.'},
  {name:'Checksums and Data Integrity',preview:'Detecting corruption in stored or transmitted data',explanation:'Checksums (CRC32, MD5, SHA-256) detect data corruption. Hash stored alongside data; recomputed on read/receipt and compared. Used in TCP, filesystems, object stores. SHA-256 for cryptographic integrity; CRC32 for fast non-cryptographic checks.',whentouse:'Any system storing or transmitting data that could be corrupted: file upload, inter-service data transfer, database storage.',tradeoffs:'CRC32 fast but not collision-resistant. SHA-256 slow but cryptographically secure. End-to-end integrity: client should verify hash, not just network layer.'}
];

const LS = 'sysdesign64_';

function getProgress(){return JSON.parse(localStorage.getItem(LS+'progress')||'{}')}
function saveProgress(p){localStorage.setItem(LS+'progress',JSON.stringify(p))}
function getRatings(){return JSON.parse(localStorage.getItem(LS+'ratings')||'{}')}
function saveRatings(r){localStorage.setItem(LS+'ratings',JSON.stringify(r))}
function getReviewed(){return JSON.parse(localStorage.getItem(LS+'reviewed')||'[]')}
function saveReviewed(r){localStorage.setItem(LS+'reviewed',JSON.stringify(r))}

// PROBLEMS
let diffFilter = new Set();
function toggleDiff(d, btn){
  if(diffFilter.has(d)){diffFilter.delete(d);btn.classList.remove('on');}
  else{diffFilter.add(d);btn.classList.add('on');}
  renderProblems();
}

function renderProblems(){
  const q = (document.getElementById('problemSearch')||{value:''}).value.toLowerCase();
  const prog = getProgress();
  const filtered = PROBLEMS.filter(p=>
    (diffFilter.size===0||diffFilter.has(p.difficulty))&&
    (!q||p.title.toLowerCase().includes(q)||p.tags.some(t=>t.toLowerCase().includes(q)))
  );
  document.getElementById('problemsGrid').innerHTML = filtered.map(p=>{
    const done = prog[p.id]==='done';
    return `<div class="problem-card${done?' done':''}" onclick="openInterview('${p.id}')">
      <div class="ph">
        <h3>${p.title}</h3>
        <span class="badge badge-${p.difficulty.toLowerCase()}">${p.difficulty}</span>
      </div>
      <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="footer">
        ${done?'<span class="done-check">✓ Attempted</span>':'<span style="color:#94a3b8;font-size:.8rem">Not started</span>'}
        <button class="btn btn-primary" style="padding:7px 16px;font-size:.82rem" onclick="event.stopPropagation();openInterview('${p.id}')">Start →</button>
      </div>
    </div>`;
  }).join('');
}

// INTERVIEW
let currentProblem = null;
let currentStep = 0;
const STEPS = ['clarify','estimate','design','deepdive','tradeoffs'];
const STEP_LABELS = ['1. Clarify','2. Estimate','3. Design','4. Deep Dive','5. Tradeoffs'];
let visitedSteps = new Set();
let checklistState = {};
let hintsRevealed = false;
let solutionRevealed = false;

function openInterview(id){
  currentProblem = PROBLEMS.find(p=>p.id===id);
  currentStep = 0;
  visitedSteps = new Set([0]);
  checklistState = {};
  hintsRevealed = false;
  solutionRevealed = false;
  const prog = getProgress();
  prog[id] = 'done';
  saveProgress(prog);
  document.getElementById('interviewPrompt').classList.add('hidden');
  document.getElementById('interviewView').style.display='block';
  document.getElementById('ivTitle').textContent = currentProblem.title;
  document.getElementById('ivBadge').innerHTML = `<span class="badge badge-${currentProblem.difficulty.toLowerCase()}">${currentProblem.difficulty}</span> ${currentProblem.tags.map(t=>`<span class="tag">${t}</span>`).join('')}`;
  renderStepsNav();
  renderStep();
  switchTab('interview');
}

function exitInterview(){
  document.getElementById('interviewPrompt').classList.remove('hidden');
  document.getElementById('interviewView').style.display='none';
  renderProblems();
}

function renderStepsNav(){
  document.getElementById('stepsNav').innerHTML = STEP_LABELS.map((l,i)=>`
    <button class="step-btn${i===currentStep?' active':visitedSteps.has(i)?' visited':''}" onclick="goToStep(${i})">${l}</button>
  `).join('');
}

function goToStep(i){
  currentStep=i;
  visitedSteps.add(i);
  renderStepsNav();
  renderStep();
}

function nextStep(){if(currentStep<STEPS.length-1){goToStep(currentStep+1);}}
function prevStep(){if(currentStep>0){goToStep(currentStep-1);}}

function renderStep(){
  const p = currentProblem;
  const skey = STEPS[currentStep];
  let html = '';

  if(currentStep===0){
    // Clarify + Requirements
    html = `<div class="step-content">
      <h2>Step 1: Clarify Requirements</h2>
      <p>${p.statement}</p>
      <div class="requirements-row">
        <div class="req-box func">
          <h4>Functional Requirements</h4>
          <ul>${p.functional.map(r=>`<li>${r}</li>`).join('')}</ul>
        </div>
        <div class="req-box nonfunc">
          <h4>Non-Functional Requirements</h4>
          <ul>${p.nonfunctional.map(r=>`<li>${r}</li>`).join('')}</ul>
        </div>
      </div>
      <div style="margin-top:16px">
        <button class="reveal-btn" onclick="toggleHint('clarify-hint')">💡 Suggested Clarifications</button>
        <div id="clarify-hint" class="hint-box" style="display:none">
          <h4>What to Clarify</h4>
          <p>${p.steps.clarify}</p>
        </div>
      </div>
    </div>`;
  } else if(currentStep===1){
    html = `<div class="step-content">
      <h2>Step 2: Capacity Estimation</h2>
      <p style="color:#94a3b8">Estimate storage, bandwidth, and QPS. Back-of-envelope numbers help drive design decisions.</p>
      <button class="reveal-btn" onclick="toggleHint('est-hint')">💡 Reveal Estimates</button>
      <div id="est-hint" class="hint-box" style="display:none">
        <h4>Estimation Notes</h4>
        <p>${p.steps.estimate}</p>
      </div>
    </div>`;
  } else if(currentStep===2){
    html = `<div class="step-content">
      <h2>Step 3: High-Level Design</h2>
      <p style="color:#94a3b8">Sketch the major components and how data flows between them.</p>
      <div style="margin-top:14px">
        <div style="font-size:.85rem;font-weight:600;color:#94a3b8;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">Key Components Checklist</div>
        <div class="checklist" id="checklist">
          ${p.checklist.map(c=>`<div class="check-item" id="ci-${c.replace(/\s/g,'_')}" onclick="toggleCheck('${c.replace(/\s/g,'_')}')">
            <div class="ci-box" id="cib-${c.replace(/\s/g,'_')}"></div>
            <span>${c}</span>
          </div>`).join('')}
        </div>
      </div>
      <div style="margin-top:16px">
        <button class="reveal-btn" onclick="toggleHint('design-hint')">💡 Reveal Design Notes</button>
        <div id="design-hint" class="hint-box" style="display:none">
          <h4>Design Approach</h4>
          <p>${p.steps.design}</p>
        </div>
      </div>
    </div>`;
    // Restore checklist state
    Object.keys(checklistState).forEach(k=>{
      if(checklistState[k]){
        const ci = document.getElementById('ci-'+k);
        const cib = document.getElementById('cib-'+k);
        if(ci){ci.classList.add('checked');}
        if(cib){cib.textContent='✓';}
      }
    });
  } else if(currentStep===3){
    html = `<div class="step-content">
      <h2>Step 4: Deep Dive</h2>
      <p style="color:#94a3b8">Go deeper into the most critical or complex component. Explain data flow, algorithms, and scaling.</p>
      <div style="margin-top:16px">
        <button class="reveal-btn" onclick="toggleHint('dd-hint')">💡 Deep Dive Hints</button>
        <div id="dd-hint" class="hint-box" style="display:none">
          <h4>Deep Dive Focus</h4>
          <p>${p.steps.deepdive}</p>
        </div>
      </div>
      <div style="margin-top:16px">
        <div style="font-size:.85rem;color:#94a3b8;font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">Hints Panel</div>
        ${p.hints.map((h,i)=>`
          <button class="reveal-btn" style="margin-bottom:8px;width:100%;justify-content:flex-start" onclick="toggleHint('hint-${i}')">🤔 Hint ${i+1}</button>
          <div id="hint-${i}" class="hint-box" style="display:none;margin-bottom:12px">
            <p>${h}</p>
          </div>
        `).join('')}
      </div>
    </div>`;
  } else if(currentStep===4){
    html = `<div class="step-content">
      <h2>Step 5: Tradeoffs & Conclusion</h2>
      <p style="color:#94a3b8">Discuss design decisions and justify your choices. No perfect answer exists — show you understand the tradeoffs.</p>
      <div style="margin-top:16px">
        <button class="reveal-btn" onclick="toggleHint('to-hint')">💡 Tradeoff Discussion</button>
        <div id="to-hint" class="hint-box" style="display:none">
          <h4>Key Tradeoffs</h4>
          <p>${p.steps.tradeoffs}</p>
        </div>
      </div>
      <div style="margin-top:20px">
        <button class="reveal-btn" onclick="toggleHint('solution-box')">🔓 Reveal Sample Solution</button>
        <div id="solution-box" class="solution-box" style="display:none;margin-top:12px">
          <h4>Sample Solution Outline</h4>
          ${p.solution.map((s,i)=>`<div class="solution-step"><div class="num">${i+1}</div><p>${s}</p></div>`).join('')}
        </div>
      </div>
      <div class="rate-row">
        <span class="rate-label">Self-rate your performance:</span>
        ${[1,2,3,4,5].map(n=>`<span class="star${getRatings()[p.id]>=n?' on':''}" onclick="rateProblem(${n})" id="star-${n}">★</span>`).join('')}
        <span id="rateLabel" style="font-size:.82rem;color:#94a3b8;margin-left:8px">${getRatings()[p.id]?getRatings()[p.id]+'/5':''}</span>
      </div>
    </div>`;
  }

  document.getElementById('stepContent').innerHTML = html;
  document.getElementById('prevBtn').style.visibility = currentStep===0?'hidden':'visible';
  document.getElementById('nextBtn').textContent = currentStep===STEPS.length-1?'Finish':'Next →';
  if(currentStep===STEPS.length-1){
    document.getElementById('nextBtn').onclick = exitInterview;
  } else {
    document.getElementById('nextBtn').onclick = nextStep;
  }
}

function toggleHint(id){
  const el = document.getElementById(id);
  if(el) el.style.display = el.style.display==='none'?'block':'none';
}

function toggleCheck(key){
  checklistState[key] = !checklistState[key];
  const ci = document.getElementById('ci-'+key);
  const cib = document.getElementById('cib-'+key);
  if(ci) ci.classList.toggle('checked', checklistState[key]);
  if(cib) cib.textContent = checklistState[key]?'✓':'';
}

function rateProblem(n){
  const r = getRatings();
  r[currentProblem.id] = n;
  saveRatings(r);
  [1,2,3,4,5].forEach(i=>{
    const s = document.getElementById('star-'+i);
    if(s) s.className = 'star'+(i<=n?' on':'');
  });
  const rl = document.getElementById('rateLabel');
  if(rl) rl.textContent = n+'/5';
}

// CONCEPTS
let openConcept = null;
function renderConcepts(){
  const q = (document.getElementById('conceptSearch')||{value:''}).value.toLowerCase();
  const reviewed = getReviewed();
  const filtered = CONCEPTS.filter(c=>
    !q||c.name.toLowerCase().includes(q)||c.explanation.toLowerCase().includes(q)
  );
  document.getElementById('conceptsGrid').innerHTML = filtered.map((c,i)=>`
    <div class="concept-card${reviewed.includes(c.name)?' reviewed':''}" onclick="toggleConcept('${c.name.replace(/[^a-z0-9]/gi,'_')}')">
      <h3>${c.name}${reviewed.includes(c.name)?'  <span style="color:#4ade80;font-size:.75rem">✓ Reviewed</span>':''}</h3>
      <div class="preview">${c.preview}</div>
    </div>
    <div class="concept-detail" id="cd-${c.name.replace(/[^a-z0-9]/gi,'_')}">
      <h2>${c.name}</h2>
      <div class="concept-section"><h4>Explanation</h4><p>${c.explanation}</p></div>
      <div class="concept-section"><h4>When to Use</h4><p>${c.whentouse}</p></div>
      <div class="concept-section"><h4>Tradeoffs</h4><p>${c.tradeoffs}</p></div>
      <button class="btn btn-green" style="margin-top:8px" onclick="event.stopPropagation();markReviewed('${c.name}')">✓ Mark as Reviewed</button>
    </div>
  `).join('');
}

function toggleConcept(id){
  const el = document.getElementById('cd-'+id);
  if(!el) return;
  const isOpen = el.classList.contains('open');
  document.querySelectorAll('.concept-detail').forEach(d=>d.classList.remove('open'));
  if(!isOpen) el.classList.add('open');
}

function markReviewed(name){
  const r = getReviewed();
  if(!r.includes(name)) r.push(name);
  saveReviewed(r);
  renderConcepts();
}

// PROGRESS
function renderProgress(){
  const prog = getProgress();
  const ratings = getRatings();
  const reviewed = getReviewed();
  const attempted = Object.keys(prog).length;
  const rated = Object.keys(ratings).length;
  const avgRating = rated? (Object.values(ratings).reduce((a,b)=>a+b,0)/rated).toFixed(1): 'N/A';
  const weakProblems = PROBLEMS.filter(p=>ratings[p.id]&&ratings[p.id]<=2);

  document.getElementById('progressGrid').innerHTML = `
    <div class="prog-card"><div class="pv">${attempted}/${PROBLEMS.length}</div><div class="pk">Problems Attempted</div></div>
    <div class="prog-card"><div class="pv">${rated}</div><div class="pk">Problems Rated</div></div>
    <div class="prog-card"><div class="pv">${avgRating}</div><div class="pk">Avg Self Rating</div></div>
    <div class="prog-card"><div class="pv">${reviewed.length}/${CONCEPTS.length}</div><div class="pk">Concepts Reviewed</div></div>
  `;

  const rs = document.getElementById('ratingsSection');
  const ratedProblems = PROBLEMS.filter(p=>ratings[p.id]);
  if(!ratedProblems.length){
    rs.innerHTML='<div class="no-data">No ratings yet. Complete problems and rate yourself!</div>';
  } else {
    rs.innerHTML = '<div class="weak-list">'+ratedProblems.sort((a,b)=>ratings[a.id]-ratings[b.id]).map(p=>`
      <div class="weak-item">
        <span class="wn">${p.title} <span class="badge badge-${p.difficulty.toLowerCase()}">${p.difficulty}</span></span>
        <span class="stars-display">${'★'.repeat(ratings[p.id])}${'☆'.repeat(5-ratings[p.id])}</span>
      </div>
    `).join('')+'</div>';
  }

  const cr = document.getElementById('conceptsReviewed');
  if(!reviewed.length){
    cr.innerHTML='<div class="no-data">No concepts reviewed yet. Go to CONCEPTS tab!</div>';
  } else {
    cr.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:8px">'+reviewed.map(c=>`<span class="tag" style="background:#4ade8015;color:#4ade80;border:1px solid #4ade8030">${c}</span>`).join('')+'</div>';
  }
}

// TAB SWITCHING
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const names=['problems','interview','concepts','progress'];
    t.classList.toggle('active',names[i]===name);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='problems') renderProblems();
  if(name==='concepts') renderConcepts();
  if(name==='progress') renderProgress();
}

// Init
renderProblems();
renderConcepts();
</script>
</body>
</html>
