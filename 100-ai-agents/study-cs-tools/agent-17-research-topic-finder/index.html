<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Topic Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="container">
    <div class="header-icon">🔬</div>
    <h1>Research Topic Finder</h1>
    <p>6 unique research topics — each with a thesis, key arguments, and a full outline.</p>
  </div>
</header>

<div class="api-bar">
  <div class="container api-bar-inner">
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIza…" autocomplete="off" />
    <button class="btn-save" onclick="saveApiKey()">Save</button>
    <span class="api-status" id="apiStatus"></span>
  </div>
</div>

<div class="container">
  <div class="card form-card">
    <div class="form-grid">
      <div class="form-group">
        <label for="subject">Subject / Course Name</label>
        <input type="text" id="subject" placeholder="e.g. American History, Environmental Science…" />
      </div>
      <div class="form-group">
        <label for="paperType">Paper Type</label>
        <select id="paperType">
          <option value="argumentative">Argumentative</option>
          <option value="analytical">Analytical</option>
          <option value="informative">Informative</option>
        </select>
      </div>
      <div class="form-group">
        <label for="difficulty">Difficulty Level</label>
        <select id="difficulty">
          <option value="high school">High School</option>
          <option value="undergraduate">Undergraduate</option>
          <option value="graduate">Graduate</option>
        </select>
      </div>
    </div>
    <button class="btn-generate" id="generateBtn" onclick="generateTopics()">
      <span id="btnText">Generate 6 Topics</span>
      <div class="btn-spinner" id="btnSpinner"></div>
    </button>
  </div>

  <div id="resultsArea"></div>
</div>

<script src="script.js"></script>
</body>
</html>
